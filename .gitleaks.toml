# gitleaks configuration for oisha-os
# Extends the default ruleset and allowlists known non-secret identifiers.

[extend]
useDefault = true

[allowlist]
description = "Non-secret identifiers (not credentials)"
# Airtable BASE IDs are public identifiers that appear in Airtable URLs.
# They are not credentials on their own; the actual AIRTABLE_API_KEY is
# always injected from GitHub secrets. Without this, the default
# "airtable-api-key" rule flags the base id (app...) as a secret.
regexes = [
  '''app8xoyx1XCumYFXV''',
]

paths = [
  '''scripts/generate_session_string\.py''',
  '''scripts/send_qurbon_greetings\.py''',
  '''scripts/send_juma_greetings\.py''',
  '''scripts/refresh_crm_token\.py''',
  '''scripts/discover_session_simple\.py''',
  '''scripts/final_auth\.py''',
  '''scripts/final_auth_2fa\.py''',
  '''scripts/final_juma_proof\.py''',
  '''scripts/remote_auth\.py''',
  '''scripts/test_juma_external\.py''',
  '''scripts/unified_auth_v2\.py''',
  '''scripts/unified_auth_final\.py''',
  '''scripts/vps_request_code\.py''',
  '''src/database_pool\.py''',
  '''src/services/core/github_manager\.py''',
  '''src/services/debug/vps_audit_fix\.py''',
  '''src/services/vps_audit_fix\.py''',
  '''\.github/workflows/userbot-vps\.yml'''
]
