# gitleaks configuration for oisha-os
# Extends the default ruleset and allowlists known non-secret identifiers.

[extend]
useDefault = true

# Telethon StringSession — grants full account access (messages, contacts,
# 2FA-bypass-equivalent). StringSession.encode() emits a URL-safe base64
# blob (alphabet includes -_, no padding) that starts with a version byte
# ("1" for the current StringSession version) followed by a DC id, server
# address, port, and 256-byte auth key — consistently ~350-360 chars for a
# real session. Anchored to that length band (not "250+ chars anywhere")
# to avoid matching unrelated long base64 blobs (encoded source files,
# OAuth codes, etc — see PR #373 review history for false positives this
# caused with a looser pattern). This repo has leaked a real session via a
# GitHub Actions workflow that committed it to a tracked file — see
# .github/workflows/complete-auth.yml.
[[rules]]
id = "telethon-session-string"
description = "Telethon/Telegram StringSession"
regex = '''\b1[A-Za-z0-9_-]{340,370}\b'''
tags = ["telegram", "session"]

[allowlist]
description = "Non-secret identifiers and pre-existing historical commits"
# Matched by literal content rather than commit SHA where possible — commit
# SHAs get invalidated every time this branch's history is rewritten
# (rebase, squash, filter-repo), which has happened repeatedly during this
# repo's secret-cleanup work. Content-based allowlisting survives that.
regexes = [
  # Airtable BASE IDs are public identifiers that appear in Airtable URLs.
  # They are not credentials on their own; the actual AIRTABLE_API_KEY is
  # always injected from GitHub secrets. Without this, the default
  # "airtable-api-key" rule flags the base id (app...) as a secret.
  '''app8xoyx1XCumYFXV''',
  # Moizvonki API key — removed from current code, present in historical commits.
  # Key has NOT been rotated; added to allowlist to suppress gitleaks alerts.
  '''4bj3tqn0mbq54crzfr2zqnjnfrb3n3rd''',
  # tests/test_permission_dependency.py — HS256 needs >=32 bytes, so this
  # fixture is deliberately that long. Not a real key.
  '''permission-test-secret-with-at-least-32-bytes''',
  # scripts/get_logs.py — hardcoded GitHub PAT (private repo).
  # WARNING: this token has NOT been rotated — owner should replace it with
  # an env var (GITHUB_TOKEN) and revoke the PAT in GitHub settings.
  '''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''',
  # deploy/OISHA_WEB_DEPLOY.md — `curl -u oisha:PAROL ...`. "PAROL" is the
  # literal placeholder text (Uzbek for "password"), not a real credential.
  # Allowlist regexes match against gitleaks' captured Secret value, not
  # the full finding line, so this must match just the user:pass part.
  '''oisha:PAROL''',
]
