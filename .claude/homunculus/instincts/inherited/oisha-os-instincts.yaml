# Oisha Os Workflow Deploy Configuration Update

## Action

Follow the deploy-configuration-update workflow:
1. Edit deployment workflow YAML in .github/workflows/
2. Update deployment documentation in deploy/*.md
3. Modify or add deployment scripts in deploy/ and scripts/
4. Update or add Dockerfiles and cloud build configs in deploy/
5. Update service entrypoints or settings in src/
6. Add or update related tests in tests/

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: .github/workflows/oracle-deploy.yml, deploy/AIOGRAM_CLOUD_RUN.md, deploy/cloud-run-aiogram.Dockerfile

