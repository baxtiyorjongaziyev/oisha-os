name: One-shot Next security lock refresh

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  refresh-lockfile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'security/next-runtime-16.2.11'
    runs-on: [self-hosted, oracle]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/next-runtime-16.2.11
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Refresh lockfile without lifecycle scripts
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "chore(deps): refresh lockfile for Next 16.2.11"
          git push origin HEAD:security/next-runtime-16.2.11
