# Oracle VM da prod uchun keraksiz jarayonlarni to'xtatadi.
#
# Nega: VM da atigi 954MB RAM bor va 6GB swap'ning 1.3GB'i ishlatilgan —
# ya'ni mashina doimiy swap'da yashaydi. 11-avgust kechasi OOM killer
# kamida uch marta ishga tushdi va oxirida GitHub Actions runner'ini
# o'ldirdi; runner 24 soatdan ortiq o'lik yotdi va butun deploy navbati
# qotib qoldi.
#
# Nima to'xtatiladi va nega aynan shular:
#
#   salescoach-ai-postgres-1 / salescoach-ai-redis-1 / salescoach-ai-minio-1
#     salescoach-ai/ workspace'ining DEV to'plami. oracle-deploy.yml
#     yozadigan prod .env da ular uchun bironta o'zgaruvchi yo'q, ya'ni
#     oisha-os ularga ulana olmaydi — prod Turso'dan foydalanadi. Ularni
#     ishlatadigan SalesCoach ilovasi (api/worker/web) ham VM da ishlamayapti,
#     ya'ni bular bo'sh turgan ma'lumot bazalari.
#
#   ollama
#     qwen2.5:3b modeli inference paytida yuzlab MB oladi. Bu OOM'ning
#     eng ehtimolli qo'zg'atuvchisi. free_ai_router.py:118 provayderni
#     faqat OLLAMA_BASE_URL bo'sh bo'lmaganda yoqadi, shuning uchun
#     oracle-deploy.yml (ENABLE_OLLAMA=0 bo'lganda) uni .env dan olib
#     tashlaydi va router uni jim o'tkazib yuboradi.
#
#   n8n (remove_n8n=yes bo'lsa) — QAYTARIB BO'LMAYDI
#     Owner qarori (2026-10-02): n8n kerak emas. Lead yo'li (Meta → AmoCRM →
#     Telegram) unga bog'liq emas, 01_lead_lifecycle bor-yo'g'i 1 marta
#     ishlagan. Konteynerlar, volume'lar (baza), image, tarmoq, .env va
#     Caddy'dagi n8n.jonbranding.uz bloki o'chiriladi.
#
# TEGILMAYDI: oisha-os.service, oisha-leads.service, nginx, actions.runner.*.
# restart_oisha=yes bo'lsa oisha-leads va oisha-os faqat qayta ishga tushadi.
#
# Qaytarish oson (n8n'dan tashqari) — pastdagi "Rollback" izohiga qarang.
name: Oracle Free Memory

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Tasdiqlash uchun aynan "free-memory" deb yozing'
        required: true
        default: ''
      stop_ollama:
        description: 'Ollama ham to‘xtatilsinmi? (ENABLE_OLLAMA repo variable ham "0" bo‘lishi kerak)'
        required: false
        default: 'yes'
        type: choice
        options: [ 'yes', 'no' ]
      remove_n8n:
        description: 'n8n ni ma‘lumotlari bilan BUTUNLAY o‘chirish (qaytarib bo‘lmaydi)'
        required: false
        default: 'no'
        type: choice
        options: [ 'no', 'yes' ]
      restart_oisha:
        description: 'Tozalashdan keyin oisha-leads va oisha-os qayta ishga tushirilsinmi?'
        required: false
        default: 'no'
        type: choice
        options: [ 'no', 'yes' ]

permissions:
  contents: read

jobs:
  free-memory:
    name: Stop non-production workloads on Oracle VM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Tasdiq GitHub tomonda tekshiriladi — tasodifiy bosish SSH
      # ochilishidan oldin to'xtaydi.
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "free-memory" ]; then
            echo "TO'XTATILDI: tasdiq maydoniga aynan \"free-memory\" yozilishi kerak."
            exit 1
          fi

      - name: Stop non-production workloads
        uses: appleboy/ssh-action@v1
        env:
          STOP_OLLAMA: ${{ inputs.stop_ollama }}
          REMOVE_N8N: ${{ inputs.remove_n8n }}
          RESTART_OISHA: ${{ inputs.restart_oisha }}
        with:
          envs: STOP_OLLAMA,REMOVE_N8N,RESTART_OISHA
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          # Host key pinning — qarang oracle-health.yml dagi izoh.
          fingerprint: ${{ secrets.ORACLE_SSH_FINGERPRINT }}
          port: 22
          timeout: 30s
          command_timeout: 12m
          script: |
            # set -e YO'Q: bitta konteyner topilmasa ham qolganlari
            # to'xtatilishi kerak.

            # Nishonlar. Birinchi versiyada bu yerda ildizdagi
            # docker-compose.yml ning `container_name:` qiymatlari yozilgan
            # edi (salescoach-postgres va h.k.) — VM da esa umuman boshqa
            # to'plam ishlaydi: salescoach-ai/ ichki workspace'ining compose'i,
            # standart <project>-<service>-<N> nomlash bilan. Natijada
            # workflow to'g'ri "konteyner mavjud emas" deb yozardi, lekin
            # hech narsa to'xtatmasdi. Nomlar `docker ps` dan olindi.
            #
            # n8n bu ro'yxatda emas: u alohida remove_n8n bo'limida
            # (to'xtatish emas, butunlay o'chirish) boshqariladi.
            TARGETS="salescoach-ai-postgres-1 salescoach-ai-redis-1 salescoach-ai-minio-1"

            echo "=== OLDINGI XOTIRA ==="
            free -m || true

            # Docker bilan umuman gaplasha olamizmi? Birinchi urinishda
            # `docker inspect ... 2>&1` xatoni yutib yuborardi va natijada
            # "topilmadi" deb hisobot berardi — ya'ni ruxsat xatosi, osilib
            # qolgan daemon va haqiqatan yo'q konteyner bir xil ko'rinardi.
            # Bu eng yomon nosozlik turi: ish bajarilmagan, lekin hisobot
            # tinch. Har bir chaqiruvda timeout ham bor, chunki mashina
            # yuk ostida bo'lganda docker CLI 20 soniyagacha osilgan.
            echo "=== DOCKER MAVJUDMI ==="
            DOCKER=""
            if timeout 15 docker ps >/dev/null 2>&1; then
              DOCKER="docker"
            elif timeout 15 sudo -n docker ps >/dev/null 2>&1; then
              DOCKER="sudo -n docker"
            fi

            # Ish bajarilmasa job YIQILISHI kerak. Bu workflow'ning birinchi
            # versiyasi hech narsa to'xtatmagan holda yashil tugagan edi —
            # aynan shuning uchun bu o'zgarish yozilyapti. Bayroqni oxirigacha
            # olib boramiz va faqat oxirida chiqamiz, aks holda diagnostika
            # (Ollama, xotira, /readyz) yo'qoladi.
            CLEANUP_FAILED=0

            if [ -z "$DOCKER" ]; then
              echo "XATO: docker bilan bog'lanib bo'lmadi — konteynerlar TO'XTATILMADI."
              echo "--- docker ps ---"
              timeout 15 docker ps 2>&1 | head -n 5
              echo "--- sudo -n docker ps ---"
              timeout 15 sudo -n docker ps 2>&1 | head -n 5
              CLEANUP_FAILED=1
            else
              echo "ishlaydigan chaqiruv: $DOCKER"
              echo "--- hozir ishlab turgan konteynerlar ---"
              timeout 20 $DOCKER ps --format '{{.Names}} | {{.Image}} | {{.Status}}' \
                || echo "(ro'yxat olinmadi)"

              echo "=== DEV STACK KONTEYNERLARINI TO'XTATISH ==="
              for c in $TARGETS; do
                echo "--- $c ---"
                ERR="$(timeout 20 $DOCKER inspect "$c" 2>&1 >/dev/null)"
                if [ -n "$ERR" ]; then
                  # "No such object" — konteyner yo'q, to'xtatadigan narsa
                  # ham yo'q, bu MUVAFFAQIYAT. Boshqa har qanday javob
                  # (ruxsat, timeout, daemon) — nosozlik.
                  if printf '%s' "$ERR" | grep -qi 'No such object'; then
                    echo "  konteyner mavjud emas — to'xtatish shart emas"
                  else
                    echo "  XATO — docker javobi: $ERR"
                    CLEANUP_FAILED=1
                  fi
                  continue
                fi
                # restart=no MUHIM: aks holda 'unless-stopped' siyosati
                # konteynerni reboot'dan keyin qaytaradi.
                ERR="$(timeout 20 $DOCKER update --restart=no "$c" 2>&1 >/dev/null)"
                if [ -n "$ERR" ]; then
                  # Bu jiddiy: konteyner to'xtasa ham, 'unless-stopped'
                  # qolsa reboot'dan keyin qaytadi.
                  echo "  XATO: restart siyosati o'zgarmadi: $ERR"
                  CLEANUP_FAILED=1
                fi
                ERR="$(timeout 60 $DOCKER stop "$c" 2>&1 >/dev/null)"
                if [ -z "$ERR" ]; then
                  echo "  to'xtatildi"
                else
                  echo "  XATO: to'xtatib bo'lmadi: $ERR"
                  CLEANUP_FAILED=1
                fi
              done

              echo "--- to'xtatishdan keyin qolgan konteynerlar ---"
              timeout 20 $DOCKER ps --format '{{.Names}} | {{.Status}}' \
                || CLEANUP_FAILED=1

              # Hisobotga emas, holatning o'ziga qaraymiz: nishonlardan
              # birortasi hali ishlab tursa yoki tekshirib bo'lmasa —
              # tozalash bajarilmagan.
              echo "--- YAKUNIY TEKSHIRUV ---"
              for c in $TARGETS; do
                if STILL="$(timeout 20 $DOCKER ps --filter "name=^/${c}\$" \
                     --format '{{.Names}}' 2>/dev/null)"; then
                  if [ -n "$STILL" ]; then
                    echo "  XATO: $c hali ishlayapti"
                    CLEANUP_FAILED=1
                  else
                    echo "  $c: ishlamayapti ✓"
                  fi
                else
                  echo "  XATO: $c holatini tekshirib bo'lmadi"
                  CLEANUP_FAILED=1
                fi
              done
            fi

            if [ "${STOP_OLLAMA:-yes}" = "yes" ]; then
              echo "=== OLLAMA ==="
              if systemctl list-unit-files --no-legend 'ollama.service' 2>/dev/null | grep -q ollama; then
                if sudo systemctl disable --now ollama; then
                  echo "ollama: to'xtatildi va o'chirildi"
                else
                  echo "XATO: ollama to'xtamadi"
                  CLEANUP_FAILED=1
                fi
              else
                echo "ollama: (unit topilmadi)"
              fi
            else
              echo "=== OLLAMA: so'ralmagan, tegilmadi ==="
            fi

            if [ "${REMOVE_N8N:-no}" = "yes" ]; then
              echo "=== N8N: BUTUNLAY O'CHIRISH ==="
              if [ -z "$DOCKER" ]; then
                echo "XATO: docker bilan bog'lanib bo'lmadi — n8n o'chirilmadi."
                CLEANUP_FAILED=1
              else
                # Nomida n8n bor konteynerlar + ular bilan bir compose
                # loyihasidagi (nomida n8n bo'lgan loyiha) qo'shnilar —
                # postgres konteyneri nomida n8n bo'lmasa ham tushib qolmasin.
                N8N_CONTAINERS="$(timeout 20 $DOCKER ps -a --format '{{.Names}}' 2>/dev/null | grep -i n8n)"
                for c in $N8N_CONTAINERS; do
                  P="$(timeout 20 $DOCKER inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$c" 2>/dev/null)"
                  case "$P" in
                    *n8n*) N8N_CONTAINERS="$N8N_CONTAINERS $(timeout 20 $DOCKER ps -a --filter "label=com.docker.compose.project=$P" --format '{{.Names}}' 2>/dev/null)" ;;
                  esac
                done
                N8N_CONTAINERS="$(printf '%s\n' $N8N_CONTAINERS | sort -u)"
                [ -z "$N8N_CONTAINERS" ] && echo "n8n konteynerlari topilmadi"

                N8N_VOLUMES="$(timeout 20 $DOCKER volume ls -q 2>/dev/null | grep -i n8n)"
                N8N_IMAGES=""
                N8N_NETWORKS=""
                for c in $N8N_CONTAINERS; do
                  echo "--- $c ---"
                  echo "  compose papka: $(timeout 20 $DOCKER inspect -f '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$c" 2>/dev/null)"
                  N8N_VOLUMES="$N8N_VOLUMES $(timeout 20 $DOCKER inspect -f '{{range .Mounts}}{{if eq .Type "volume"}}{{.Name}} {{end}}{{end}}' "$c" 2>/dev/null)"
                  N8N_IMAGES="$N8N_IMAGES $(timeout 20 $DOCKER inspect -f '{{.Config.Image}}' "$c" 2>/dev/null)"
                  N8N_NETWORKS="$N8N_NETWORKS $(timeout 20 $DOCKER inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$c" 2>/dev/null)"
                  ERR="$(timeout 90 $DOCKER rm -f "$c" 2>&1 >/dev/null)"
                  if [ -z "$ERR" ]; then
                    echo "  konteyner o'chirildi"
                  else
                    echo "  XATO: konteyner o'chmadi: $ERR"
                    CLEANUP_FAILED=1
                  fi
                done

                for v in $(printf '%s\n' $N8N_VOLUMES | sort -u); do
                  ERR="$(timeout 60 $DOCKER volume rm "$v" 2>&1 >/dev/null)"
                  if [ -z "$ERR" ]; then
                    echo "volume o'chirildi: $v"
                  else
                    echo "XATO: volume o'chmadi: $v — $ERR"
                    CLEANUP_FAILED=1
                  fi
                done

                # Tarmoq va image boshqa konteynerda band bo'lsa docker
                # o'zi rad etadi — bu xato emas, shunchaki qoldiriladi.
                for n in $(printf '%s\n' $N8N_NETWORKS | sort -u); do
                  case "$n" in bridge|host|none) continue ;; esac
                  if timeout 30 $DOCKER network rm "$n" >/dev/null 2>&1; then
                    echo "tarmoq o'chirildi: $n"
                  else
                    echo "tarmoq qoldirildi (band yoki allaqachon yo'q): $n"
                  fi
                done
                for i in $(printf '%s\n' $N8N_IMAGES | sort -u); do
                  if timeout 90 $DOCKER rmi "$i" >/dev/null 2>&1; then
                    echo "image o'chirildi: $i"
                  else
                    echo "image qoldirildi (boshqa konteyner ishlatadi): $i"
                  fi
                done

                echo "--- YAKUNIY TEKSHIRUV (n8n) ---"
                LEFT="$(timeout 20 $DOCKER ps -a --format '{{.Names}}' 2>/dev/null | grep -i n8n)"
                if [ -n "$LEFT" ]; then
                  echo "  XATO: hali bor: $LEFT"
                  CLEANUP_FAILED=1
                else
                  echo "  n8n konteynerlari: yo'q ✓"
                fi
              fi

              # Sirli .env fayl (POSTGRES_PASSWORD, N8N_ENCRYPTION_KEY).
              # Kuzatiladigan compose fayllarini keyingi deploy'dagi git o'zi
              # olib tashlaydi.
              if [ -f "$HOME/oisha-os/deploy/n8n/.env" ]; then
                rm -f "$HOME/oisha-os/deploy/n8n/.env" && echo "deploy/n8n/.env o'chirildi"
              fi

              echo "=== CADDY: n8n.jonbranding.uz ==="
              CF=/etc/caddy/Caddyfile
              if [ -f "$CF" ] && command -v caddy >/dev/null 2>&1 \
                 && sudo grep -qE '^n8n\.jonbranding\.uz[[:space:]]*\{' "$CF"; then
                TMP="$(mktemp)"
                # Qavslarni sanab faqat shu blokni olib tashlaydi; sed
                # diapazoni yopuvchi qavs boshqacha turganda keyingi saytni
                # ham yutib yuborishi mumkin edi.
                sudo cat "$CF" | awk '
                  !done && /^n8n\.jonbranding\.uz[ \t]*\{[ \t]*$/ { skip = 1 }
                  skip { d += gsub(/\{/, "{"); d -= gsub(/\}/, "}"); if (d <= 0) { skip = 0; done = 1 }; next }
                  { print }
                ' > "$TMP"
                REMOVED=$(( $(sudo cat "$CF" | wc -l) - $(wc -l < "$TMP") ))
                if [ "$REMOVED" -ge 2 ] && [ "$REMOVED" -le 10 ] && ! grep -q '5678' "$TMP" \
                   && sudo caddy validate --config "$TMP" --adapter caddyfile >/dev/null 2>&1; then
                  sudo cp "$CF" "$CF.bak-n8n"
                  sudo cp "$TMP" "$CF"
                  if ! systemctl is-active --quiet caddy; then
                    echo "caddy: n8n bloki olib tashlandi (caddy ishlamayapti, reload shart emas)"
                  elif sudo systemctl reload caddy; then
                    echo "caddy: n8n bloki olib tashlandi, reload qilindi (zaxira: $CF.bak-n8n)"
                  else
                    echo "XATO: caddy reload yiqildi — eski Caddyfile qaytarildi"
                    sudo cp "$CF.bak-n8n" "$CF"
                    sudo systemctl reload caddy || true
                    CLEANUP_FAILED=1
                  fi
                else
                  echo "XATO: Caddyfile o'zgartirilmadi (olib tashlanadigan qator=$REMOVED yoki validatsiya o'tmadi)"
                  CLEANUP_FAILED=1
                fi
                rm -f "$TMP"
              else
                echo "caddy: n8n yozuvi yo'q yoki Caddy o'rnatilmagan"
              fi
              echo "--- nginx'da 5678 ga ishora (faqat hisobot) ---"
              sudo grep -ls '5678' /etc/nginx/sites-enabled/* 2>/dev/null || echo "(yo'q)"
            else
              echo "=== N8N: so'ralmagan, tegilmadi ==="
            fi

            if [ "${RESTART_OISHA:-no}" = "yes" ]; then
              echo "=== OISHA QAYTA ISHGA TUSHIRISH ==="
              if systemctl list-unit-files --no-legend 'oisha-leads.service' 2>/dev/null | grep -q oisha-leads; then
                if sudo systemctl restart oisha-leads; then
                  echo "oisha-leads: qayta ishga tushdi"
                else
                  echo "XATO: oisha-leads qayta ishga tushmadi"
                  CLEANUP_FAILED=1
                fi
              else
                echo "oisha-leads: (unit topilmadi)"
              fi
              if sudo systemctl restart oisha-os; then
                echo "oisha-os: qayta ishga tushdi, /readyz kutilmoqda (2 daqiqagacha)"
              else
                echo "XATO: oisha-os qayta ishga tushmadi"
                CLEANUP_FAILED=1
              fi
              READY=000
              for _ in $(seq 1 24); do
                READY="$(curl -s -o /dev/null -m 5 -w '%{http_code}' http://127.0.0.1:8080/readyz/ 2>/dev/null)"
                [ "$READY" = "200" ] && break
                sleep 5
              done
              echo "readyz: $READY"
            fi

            echo "=== SERVISLAR HOLATI ==="
            for u in oisha-os oisha-leads nginx caddy; do
              printf '%s: ' "$u"
              systemctl is-active "$u" 2>/dev/null || echo "(inactive)"
            done

            echo "=== KEYINGI XOTIRA ==="
            free -m || true

            echo "=== /readyz ==="
            curl -s --max-time 10 -w '\nhttp_code=%{http_code}\n' \
              http://127.0.0.1:8080/readyz/ 2>/dev/null | head -c 2000 \
              || echo "http_code=000 (ulanmadi)"

            if [ "$CLEANUP_FAILED" -ne 0 ]; then
              echo "=== YAKUN: TOZALASH BAJARILMADI ==="
              echo "Yuqoridagi XATO qatorlariga qarang. Job ataylab yiqilyapti —"
              echo "bajarilmagan ish yashil hisobot bilan yopilmasligi kerak."
              exit 1
            fi

            echo "=== TUGADI: tozalash tasdiqlandi ==="
            # Rollback:
            #   docker update --restart=unless-stopped $TARGETS
            #   docker start $TARGETS
            #   (TARGETS skript boshida e'lon qilingan)
            #   sudo systemctl enable --now ollama
            #   (va ENABLE_OLLAMA repository variable'ini "1" qiling)
