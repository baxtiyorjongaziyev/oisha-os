name: gemini-review

# Gemini PR review via Gemini API. Uses a dedicated key (GEMINI_REVIEW_API_KEY)
# in its own Google project so prod bot quotas are untouched. Skips if unset.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: key
        env:
          KEY: ${{ secrets.GEMINI_REVIEW_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: steps.key.outputs.present == 'true'
        run: python .github/scripts/gemini_review.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_REVIEW_API_KEY }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
