# Oisha-OS continuous integration.
# Security boundary: untrusted pull-request code must never execute on the
# production Oracle runner. PRs use isolated GitHub-hosted runners; only
# trusted pushes to main/master may use the production-labelled runner.
name: CI - Oisha-OS

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'apps/**'
      - 'packages/**'
      - 'salescoach-ai/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'deploy/**'
      - 'marketing-os/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'apps/**'
      - 'packages/**'
      - 'salescoach-ai/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'deploy/**'
      - 'marketing-os/**'
      - '.github/workflows/test.yml'

concurrency:
  group: ci-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      salescoach: ${{ steps.filter.outputs.salescoach }}
      marketing_frontend: ${{ steps.filter.outputs.marketing_frontend }}
      marketing_backend: ${{ steps.filter.outputs.marketing_backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            typescript:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/test.yml'
            salescoach:
              - 'salescoach-ai/**'
              - '.github/workflows/test.yml'
            marketing_frontend:
              - 'marketing-os/frontend/**'
              - '.github/workflows/test.yml'
            marketing_backend:
              - 'marketing-os/backend/**'
              - '.github/workflows/test.yml'

  pull-request-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SKIP_LIVE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Security scan
        run: bandit -r src/ -ll -x src/services/debug/ --quiet

      - name: Run Python tests
        run: pytest -q --tb=short

      - name: Upload coverage
        if: ${{ hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false

  typescript-monorepo:
    name: TypeScript monorepo checks
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install TypeScript workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Lint workspace
        run: pnpm run lint

      - name: Test workspace
        run: pnpm run test

      - name: Build workspace
        run: pnpm run build

  salescoach-monorepo:
    name: SalesCoach workspace checks
    needs: changes
    if: needs.changes.outputs.salescoach == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: salescoach-ai
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: salescoach-ai/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: salescoach-ai/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run type-check
      - run: pnpm run test
      - run: pnpm run build

  marketing-frontend:
    name: Marketing frontend checks
    needs: changes
    if: needs.changes.outputs.marketing_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: marketing-os/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: marketing-os/frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm audit --audit-level high --ignore-workspace
      - run: pnpm run build

  marketing-backend:
    name: Marketing backend checks
    needs: changes
    if: needs.changes.outputs.marketing_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx python-dotenv uvicorn

      - name: Syntax & verification
        run: |
          python -m py_compile marketing-os/backend/main.py marketing-os/backend/db.py

  trusted-main-tests:
    if: github.event_name == 'push'
    # Production Oracle is a 1 GB VM. Running the full Python suite there
    # starves the live API/userbot and makes the watchdog restart Oisha.
    # These tests are hermetic (SKIP_LIVE=1), so keep them GitHub-hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SKIP_LIVE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
          pip install -q -r requirements-dev.txt

      - name: Security scan
        run: bandit -r src/ -ll -x src/services/debug/ --quiet

      - name: Run tests with coverage
        run: pytest -q --tb=short

      - name: Upload coverage
        if: ${{ hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false
