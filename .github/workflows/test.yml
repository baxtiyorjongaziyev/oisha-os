# Oisha-OS continuous integration.
# Security boundary: untrusted pull-request code must never execute on the
# production Oracle runner. PRs use an isolated GitHub-hosted runner; only
# trusted pushes to main/master may use the production-labelled runner.
name: CI - Oisha-OS

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'apps/**'
      - 'packages/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'deploy/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'apps/**'
      - 'packages/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'deploy/**'
      - '.github/workflows/test.yml'

concurrency:
  group: ci-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SKIP_LIVE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Security scan
        run: bandit -r src/ -ll -x src/services/debug/ --quiet

      - name: Run Python tests
        run: pytest -q --tb=short

      - name: Upload coverage
        if: ${{ hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false

  trusted-main-tests:
    if: github.event_name == 'push'
    runs-on: [self-hosted, oracle]
    timeout-minutes: 35
    env:
      SKIP_LIVE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python virtualenv
        run: |
          VENV="$HOME/.cache/oisha-ci-venv"
          if [ ! -x "$VENV/bin/python" ]; then
            python3 -m venv "$VENV"
          fi
          "$VENV/bin/pip" install -q --upgrade pip
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
          pip install -q -r requirements-dev.txt

      - name: Security scan
        run: bandit -r src/ -ll -x src/services/debug/ --quiet

      - name: Run tests with coverage
        run: pytest -q --tb=short

      - name: Upload coverage
        if: ${{ hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false
