# Oisha-OS continuous integration.
# Security boundary: untrusted pull-request code must never execute on the
# production Oracle runner. Both PR and trusted-main validation use isolated
# GitHub-hosted runners; the Oracle runner is reserved for deployment only.
name: CI - Oisha-OS

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'apps/**'
      - 'packages/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'deploy/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'apps/**'
      - 'packages/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'deploy/**'
      - '.github/workflows/test.yml'

concurrency:
  group: ci-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SKIP_LIVE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Security scan
        run: bandit -r src/ -ll -x src/services/debug/ --quiet

      - name: Run Python tests
        run: pytest -q --tb=short

      - name: Upload coverage
        if: ${{ hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false

  typescript-monorepo:
    name: TypeScript monorepo checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install TypeScript workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Lint workspace
        run: pnpm run lint

      - name: Test workspace
        run: pnpm run test

      - name: Build workspace
        run: pnpm run build

  trusted-main-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SKIP_LIVE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python virtualenv
        run: |
          VENV="$HOME/.cache/oisha-ci-venv"
          if [ ! -x "$VENV/bin/python" ]; then
            python3 -m venv "$VENV"
          fi
          "$VENV/bin/pip" install -q --upgrade pip
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
          pip install -q -r requirements-dev.txt

      - name: Security scan
        run: bandit -r src/ -ll -x src/services/debug/ --quiet

      - name: Run tests with coverage
        run: pytest -q --tb=short

      - name: Upload coverage
        if: ${{ hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false
