# Oisha-OS: Continuous Integration (Tests)
# Path-filtered to save GitHub Actions minutes (free tier: 2000 min/month)
# Runs on the self-hosted Oracle runner: GitHub-hosted (ubuntu-latest) jobs
# have been failing instantly without ever being assigned a runner
# (account-level Actions issue), while the self-hosted runner keeps working —
# the same move oracle-deploy.yml made in 49177e5.
name: CI - Oisha-OS

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 35
    env:
      SKIP_LIVE: "1"
    steps:
      - uses: actions/checkout@v7

      # Persistent venv on the runner replaces setup-python + pip cache:
      # the VM's system python3 backs it, and reuse across runs keeps
      # installs fast on the small Oracle box.
      - name: Set up Python virtualenv
        run: |
          VENV="$HOME/.cache/oisha-ci-venv"
          if [ ! -x "$VENV/bin/python" ]; then
            python3 -m venv "$VENV"
          fi
          "$VENV/bin/pip" install -q --upgrade pip
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
          pip install -q -r requirements-dev.txt
          
      - name: Security scan
        run: |
          bandit -r src/ -ll -x src/services/debug/ --quiet
          
      - name: Run tests with coverage
        run: |
          pytest -q --tb=short
          
      - name: Upload coverage to Codecov
        if: ${{ hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false
