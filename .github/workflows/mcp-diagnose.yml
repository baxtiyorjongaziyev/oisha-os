name: Telegram MCP — Diagnose stdio handshake

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: SSH -> Oracle VM -> spawn telegram_mcp_server.py -> verify JSON-RPC handshake
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run MCP initialize handshake over stdio
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 2m
          script: |
            set -x
            OISHA_DIR="/home/ubuntu/oisha-os"
            echo "=== venv python ==="
            "$OISHA_DIR/venv/bin/python3" --version
            echo "=== mcp package ==="
            "$OISHA_DIR/venv/bin/python3" -c "import mcp; print(mcp.__file__)"
            echo "=== systemd service status ==="
            systemctl is-active oisha-os || true
            echo "=== readyz ==="
            curl -s -o /dev/null -w "%{http_code}\n" --max-time 5 http://127.0.0.1:8080/readyz/ || true
            echo "=== raw JSON-RPC initialize handshake (10s timeout) ==="
            REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"diag","version":"1.0"}}}'
            printf '%s\n' "$REQ" | timeout 10 "$OISHA_DIR/venv/bin/python3" "$OISHA_DIR/scripts/telegram_mcp_server.py" > /tmp/mcp_stdout.log 2> /tmp/mcp_stderr.log
            EXIT_CODE=$?
            echo "=== exit code: $EXIT_CODE ==="
            echo "=== stdout ==="
            cat /tmp/mcp_stdout.log
            echo "=== stderr ==="
            cat /tmp/mcp_stderr.log
            if grep -q '"result"' /tmp/mcp_stdout.log; then
              echo "DIAGNOSIS: OK — server returned a valid JSON-RPC result for initialize."
            else
              echo "DIAGNOSIS: FAIL — no valid JSON-RPC result on stdout. See stderr/exit code above."
            fi
