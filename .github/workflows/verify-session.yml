name: Verify Userbot Session

on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/verify-session-trigger'

permissions:
  contents: read

jobs:
  verify:
    name: Session Tekshiruv
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Telethon
        run: pip install telethon==1.36.0

      - name: Verify session and notify
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          USERBOT_SESSION_STRING: ${{ secrets.USERBOT_SESSION_STRING }}
        run: |
          python3 - <<'PYEOF'
          import asyncio, os, urllib.parse, urllib.request
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          API_ID = int(os.environ["API_ID"])
          API_HASH = os.environ["API_HASH"]
          BOT_TOKEN = os.environ.get("BOT_TOKEN", "")
          OWNER_ID = int(os.environ.get("OWNER_ID", "150074828"))

          SESSION_STRING = os.environ.get("USERBOT_SESSION_STRING", "")

          def notify(text):
              if not BOT_TOKEN:
                  return
              try:
                  url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
                  data = urllib.parse.urlencode({"chat_id": OWNER_ID, "text": text}).encode()
                  urllib.request.urlopen(url, data=data, timeout=10)
              except Exception as e:
                  print(f"Notification failed: {e}")

          async def main():
              if not SESSION_STRING:
                  result = "FAIL: SESSION_STRING topilmadi"
                  notify(f"❌ {result}")
                  print(result)
                  raise RuntimeError(result)
              client = TelegramClient(StringSession(SESSION_STRING), API_ID, API_HASH)
              try:
                  await client.connect()
                  if not await client.is_user_authorized():
                      result = "FAIL: Session muddati tugagan yoki noto'g'ri"
                      notify(f"❌ {result}")
                      print(result)
                      raise RuntimeError(result)
                  me = await client.get_me()
                  result = f"OK: {me.first_name} (@{me.username}) — session ISHLAYAPTI"
                  notify(f"✅ Userbot session tekshiruvi muvaffaqiyatli!\nAkkaunt: {me.first_name} (@{me.username})\nBarcha workflow'lar ishga tayyor.")
                  print(result)
              finally:
                  await client.disconnect()

          asyncio.run(main())
          PYEOF
