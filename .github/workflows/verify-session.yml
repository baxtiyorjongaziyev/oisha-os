# Userbot session tekshiruvi.
#
# MUHIM: bu workflow ILGARI ubuntu-latest da prod USERBOT_SESSION_STRING bilan
# ikkinchi Telethon client ochardi. Runner ning IP si Oracle VM dan boshqa, shu
# sababli Telegram auth key ni "two different IP addresses simultaneously" deb
# butunlay bekor qilardi (AuthKeyDuplicatedError) — natijada prod userbot ham,
# Juma tabrigi ham o'lardi.
#
# Endi hech qanday yangi Telethon ulanishi ochilmaydi: Oracle VM da ishlab
# turgan oisha-os.service ning o'z health endpointi so'raladi.
name: Verify Userbot Session

on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/verify-session-trigger'

permissions:
  contents: read

jobs:
  verify:
    name: Session Tekshiruv (Oracle VM health)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check live userbot session on Oracle VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 4m
          envs: BOT_TOKEN,OWNER_ID
          script: |
            set -euo pipefail

            HTTP_CODE="$(curl -s -o /tmp/oisha-readyz.json -w "%{http_code}" \
              --max-time 10 http://127.0.0.1:8080/readyz/ || echo 000)"
            BODY="$(cat /tmp/oisha-readyz.json 2>/dev/null || echo '{}')"
            echo "HTTP ${HTTP_CODE}: ${BODY}"

            USERBOT_STATE="$(python3 -c "
            import json, sys
            try:
                print(json.loads(sys.argv[1]).get('checks', {}).get('userbot', 'unknown'))
            except Exception:
                print('unknown')
            " "${BODY}")"

            if [ "${HTTP_CODE}" = "200" ] && [ "${USERBOT_STATE}" = "authorized" ]; then
              RESULT="✅ Userbot session ISHLAYAPTI (Oracle /readyz: ${USERBOT_STATE})"
              STATUS=0
            else
              RESULT="❌ Userbot session TEKSHIRUVDAN O'TMADI
            HTTP: ${HTTP_CODE}
            userbot: ${USERBOT_STATE}

            Agar AuthKeyDuplicated bo'lsa, prod kaliti boshqa IP dan ochilgan.
            Yangi session: oracle-userbot-auth.yml (Oracle VM da xavfsiz tiklash)."
              STATUS=1
            fi

            echo "${RESULT}"
            if [ -n "${BOT_TOKEN:-}" ]; then
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${OWNER_ID:-150074828}" \
                --data-urlencode "text=${RESULT}" >/dev/null || true
            fi
            exit "${STATUS}"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
