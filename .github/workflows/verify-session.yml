name: Verify Userbot Session

on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/verify-session-trigger'

permissions:
  contents: write

jobs:
  verify:
    name: Session Tekshiruv
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Telethon
        run: pip install telethon==1.36.0

      - name: Verify session and write result
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import asyncio, os, json, base64, urllib.parse, urllib.request, urllib.error
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          API_ID = int(os.environ["API_ID"])
          API_HASH = os.environ["API_HASH"]
          BOT_TOKEN = os.environ.get("BOT_TOKEN", "")
          OWNER_ID = int(os.environ.get("OWNER_ID", "150074828"))
          GH_TOKEN = os.environ["GH_TOKEN"]
          REPO = "baxtiyorjongaziyev/oisha-os"
          RESULT_FILE = "data/verify_result.txt"

          SESSION_STRING = os.environ.get("USERBOT_SESSION_STRING", "")
          session_file = "data/session_output.txt"
          try:
              if os.path.exists(session_file):
                  s = open(session_file).read().strip()
                  if s:
                      SESSION_STRING = s
                      print("Session fayldan yuklandi")
          except Exception:
              pass

          def notify(text):
              if not BOT_TOKEN:
                  return
              try:
                  url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
                  data = urllib.parse.urlencode({"chat_id": OWNER_ID, "text": text}).encode()
                  urllib.request.urlopen(url, data=data, timeout=10)
              except Exception as e:
                  print(f"Notification failed: {e}")

          def gh_request(method, path, data=None):
              url = f"https://api.github.com{path}"
              body = json.dumps(data).encode() if data else None
              req = urllib.request.Request(url, data=body, method=method, headers={
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              })
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      content = r.read()
                      return (json.loads(content) if content else {}), r.status
              except urllib.error.HTTPError as e:
                  return {}, e.code

          def write_result(text):
              existing, status = gh_request("GET", f"/repos/{REPO}/contents/{RESULT_FILE}")
              sha = existing.get("sha") if status == 200 else None
              payload = {
                  "message": "verify: session check result [auto]",
                  "content": base64.b64encode(text.encode()).decode(),
                  "committer": {"name": "GitHub Actions", "email": "actions@github.com"},
              }
              if sha:
                  payload["sha"] = sha
              gh_request("PUT", f"/repos/{REPO}/contents/{RESULT_FILE}", payload)

          async def main():
              if not SESSION_STRING:
                  result = "FAIL: SESSION_STRING topilmadi"
                  notify(f"❌ {result}")
                  write_result(result)
                  print(result)
                  return
              client = TelegramClient(StringSession(SESSION_STRING), API_ID, API_HASH)
              try:
                  await client.connect()
                  if not await client.is_user_authorized():
                      result = "FAIL: Session muddati tugagan yoki noto'g'ri"
                      notify(f"❌ {result}")
                      write_result(result)
                      print(result)
                      return
                  me = await client.get_me()
                  result = f"OK: {me.first_name} (@{me.username}) — session ISHLAYAPTI"
                  notify(f"✅ Userbot session tekshiruvi muvaffaqiyatli!\nAkkaunt: {me.first_name} (@{me.username})\nBarcha workflow'lar ishga tayyor.")
                  write_result(result)
                  print(result)
              finally:
                  await client.disconnect()

          asyncio.run(main())
          PYEOF
