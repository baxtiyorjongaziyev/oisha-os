name: Dependabot security remediation

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'requirements*.txt'
      - '.github/workflows/dependabot-remediation.yml'

permissions:
  contents: write
  security-events: read

jobs:
  dependency-audit:
    if: github.head_ref == 'security/dependabot-all-alerts'
    name: Trusted dependency audit and patch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          path: control
          fetch-depth: 0

      - name: Checkout remediation branch
        uses: actions/checkout@v7
        with:
          ref: security/dependabot-all-alerts
          path: target
          fetch-depth: 0

      - name: Capture open Dependabot alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oisha-dependency-audit"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" \
            > "$RUNNER_TEMP/oisha-dependency-audit/dependabot-alerts.json"

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Audit and patch npm dependencies from trusted main
        working-directory: control
        run: |
          set -euo pipefail
          pnpm audit --json > "$RUNNER_TEMP/oisha-dependency-audit/pnpm-audit-before.json" || true
          pnpm audit --fix --audit-level=low || true
          pnpm install --lockfile-only --ignore-scripts
          pnpm audit --json > "$RUNNER_TEMP/oisha-dependency-audit/pnpm-audit-after.json" || true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Audit Python dependencies from trusted main
        working-directory: control
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/oisha-pip-audit-venv"
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --disable-pip-version-check 'pip-audit==2.10.1'
          grep -v '^telegram-mcp @' requirements.txt > "$RUNNER_TEMP/oisha-dependency-audit/requirements-audit.txt"
          "$VENV/bin/pip-audit" -r "$RUNNER_TEMP/oisha-dependency-audit/requirements-audit.txt" \
            --format json --output "$RUNNER_TEMP/oisha-dependency-audit/pip-audit.json" || true

      - name: Copy patched dependency files
        run: |
          set -euo pipefail
          cp control/package.json target/package.json
          cp control/pnpm-workspace.yaml target/pnpm-workspace.yaml
          cp control/pnpm-lock.yaml target/pnpm-lock.yaml
          cp control/requirements.txt target/requirements.txt
          cp control/requirements-dev.txt target/requirements-dev.txt

      - name: Commit remediation
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-workspace.yaml pnpm-lock.yaml requirements.txt requirements-dev.txt
          if git diff --cached --quiet; then
            echo 'No dependency file changes were needed.'
          else
            git commit -m 'fix(security): apply dependency audit remediations'
            git push origin HEAD:security/dependabot-all-alerts
          fi

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-remediation
          path: ${{ runner.temp }}/oisha-dependency-audit/
          retention-days: 7
