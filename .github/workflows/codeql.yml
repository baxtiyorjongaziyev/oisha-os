name: Security - CodeQL

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '**.py'
      - '**.ts'
      - '**.js'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main, master]
    # No paths filter here on purpose: "CodeQL Analyze (python)" and
    # "CodeQL Analyze (javascript-typescript)" are required status checks on
    # main's branch protection, so they must report on every PR regardless of
    # which files it touches — a path filter here means GitHub never sees a
    # run for out-of-scope PRs and treats the check as eternally pending,
    # blocking merge. The push trigger above keeps its path filter.
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !github.event.repository.private || vars.ENABLE_CODEQL == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
