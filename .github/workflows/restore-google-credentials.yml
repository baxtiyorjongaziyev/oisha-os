name: Restore Google credentials on Oracle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    name: Restore and verify Hisobchi Sheets access
    runs-on: [self-hosted, oracle]
    environment: production
    timeout-minutes: 5
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      HISOBCHI_GSHEET_ID: ${{ secrets.HISOBCHI_GSHEET_ID }}
    steps:
      - name: Restore credential and verify Google Sheets
        shell: bash
        run: |
          set -euo pipefail
          : "${GOOGLE_SERVICE_ACCOUNT_JSON:?GOOGLE_SERVICE_ACCOUNT_JSON is required}"
          : "${HISOBCHI_GSHEET_ID:?HISOBCHI_GSHEET_ID is required}"
          cd /home/ubuntu/oisha-os
          umask 077
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json
          ./venv/bin/python - <<'PY'
          import os
          import gspread
          from google.oauth2.service_account import Credentials

          scopes = (
              "https://www.googleapis.com/auth/spreadsheets",
              "https://www.googleapis.com/auth/drive",
          )
          credentials = Credentials.from_service_account_file(
              "service_account.json", scopes=scopes
          )
          spreadsheet = gspread.authorize(credentials).open_by_key(
              os.environ["HISOBCHI_GSHEET_ID"]
          )
          spreadsheet.worksheet("Pul oqimi").row_values(1)
          print("Hisobchi Google Sheets read: OK")
          PY
          sudo systemctl restart oisha-os

      - name: Verify Oisha readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            if curl -fsS --max-time 3 http://127.0.0.1:8080/readyz/ >/dev/null; then
              echo "Oisha readiness: OK"
              exit 0
            fi
            sleep 5
          done
          echo "Oisha readiness failed" >&2
          exit 1
