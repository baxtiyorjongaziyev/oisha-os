name: AmoCRM Live Audit

on:
  push:
    paths:
      - 'deploy/amocrm-audit-trigger'
  workflow_dispatch:

concurrency:
  group: amocrm-live-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only AmoCRM audit on Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run audit script on Oracle VM
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 8m
          envs: GITHUB_TOKEN
          script: |
            set -euo pipefail
            cd /home/ubuntu/oisha-os

            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" 2>/dev/null || true
            git fetch origin main
            git stash --include-untracked 2>/dev/null || true
            git checkout origin/main -- scripts/amocrm_live_audit.py

            ./venv/bin/python scripts/amocrm_live_audit.py
