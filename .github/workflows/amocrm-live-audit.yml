name: AmoCRM Live Audit

on:
  push:
    branches: [main]  # never run branch code on the prod runner
    paths:
      - 'deploy/amocrm-audit-trigger'
  workflow_dispatch:

concurrency:
  group: amocrm-live-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only AmoCRM audit on Hetzner
    runs-on: [self-hosted, oracle]
    timeout-minutes: 10
    steps:
      - name: Run audit script on Hetzner VPS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OISHA_DIR="/home/deploy/oisha-os"
          [ -d "$OISHA_DIR" ] || OISHA_DIR="/home/ubuntu/oisha-os"
          cd "$OISHA_DIR"

          if [ -d .git ]; then
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" 2>/dev/null || true
            git fetch origin main
            git stash --include-untracked 2>/dev/null || true
            git checkout origin/main -- scripts/amocrm_live_audit.py
            git remote set-url origin "https://github.com/baxtiyorjongaziyev/oisha-os.git" 2>/dev/null || true
          fi

          ./venv/bin/python scripts/amocrm_live_audit.py
