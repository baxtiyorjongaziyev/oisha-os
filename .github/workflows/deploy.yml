name: Oisha-OS Auto Deploy

on:
  push:
    branches:
      - claude/infallible-kalam
      - main
      - master
  workflow_dispatch:

env:
  PROJECT_ID: jonbranding-85662071-ea38e
  SERVICE_NAME: oisha-master-bot
  REGION: europe-west3

jobs:
  test:
    name: Run Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short || true

  deploy:
    name: Production Rollout
    needs: test
    if: github.event_name != 'pull_request'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 🏗️ Build & Push Container
        run: |
          gcloud builds submit --tag gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .

      - name: 🚀 Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --timeout 3600 \
            --max-instances 3 \
            --set-env-vars "RUNNING_IN_CLOUD=True,ENVIRONMENT=production" \
            --set-env-vars "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" \
            --set-env-vars "API_ID=${{ secrets.API_ID }}" \
            --set-env-vars "API_HASH=${{ secrets.API_HASH }}" \
            --set-env-vars "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
            --set-env-vars "OISHA_API_SECRET=${{ secrets.OISHA_API_SECRET }}" \
            --set-env-vars "AMOCRM_CLIENT_ID=${{ secrets.AMOCRM_CLIENT_ID }}" \
            --set-env-vars "AMOCRM_CLIENT_SECRET=${{ secrets.AMOCRM_CLIENT_SECRET }}" \
            --set-env-vars "AMOCRM_REDIRECT_URL=${{ secrets.AMOCRM_REDIRECT_URL }}" \
            --set-env-vars "AMOCRM_SUBDOMAIN=${{ secrets.AMOCRM_SUBDOMAIN }}" \
            --set-env-vars "GCS_BUCKET=${{ secrets.GCS_BUCKET }}" \
            --set-env-vars "GOOGLE_SERVICE_ACCOUNT_JSON=${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" \
            --set-env-vars "OWNER_ID=${{ secrets.OWNER_ID }}"

      - name: Verify deployment
        run: |
          gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --format='value(status.url)'

      - name: Notify Telegram
        if: always()
        run: |
          if [ -n "${{ secrets.BOT_TOKEN }}" ] && [ -n "${{ secrets.OWNER_ID }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.OWNER_ID }}" \
              -d "text=🚀 Oisha-OS Deploy Finish%0AStatus: ${{ job.status }}%0ACommit: ${{ github.sha }}"
          fi
