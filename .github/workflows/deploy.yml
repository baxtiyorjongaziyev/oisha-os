# Oisha-OS: Production Deployment Pipeline
# [REFRESH: 2026-05-07] Force IDE re-index
name: Oisha-OS Auto Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  PROJECT_ID: jonbranding-85662071-ea38e
  SERVICE_NAME: oisha-master-bot
  REGION: europe-west3

jobs:
  test:
    name: Run Deploy Safety Checks
    if: "${{ github.event_name == 'workflow_dispatch' || (!contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.event.head_commit.message, 'chore(auto): update DEV_LOG')) }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio bandit

      - name: Security scan (bandit)
        run: |
          bandit -r src/ -ll -x src/services/debug/ --quiet || true

      - name: Compile critical runtime files
        run: |
          python -m py_compile src/database.py src/api_server.py src/main.py

      - name: Run deploy safety tests
        env:
          BOT_TOKEN: "dummy-ci-token"
          API_ID: "12345"
          API_HASH: "dummy-ci-hash"
          GEMINI_API_KEY: "dummy-ci-gemini"
          AMOCRM_SUBDOMAIN: "dummy"
          AMOCRM_CLIENT_ID: "dummy-client"
          AMOCRM_CLIENT_SECRET: "dummy-secret"
          AMOCRM_REDIRECT_URL: "https://example.invalid/cb"
        run: |
          python -m pytest -q

  deploy:
    name: Healthy-Only Production Rollout
    needs: test
    if: "${{ github.event_name == 'workflow_dispatch' || (!contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.event.head_commit.message, 'chore(auto): update DEV_LOG')) }}"
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      final_status: ${{ steps.rollout.outputs.final_status }}
      failure_reason: ${{ steps.rollout.outputs.failure_reason }}
      revision: ${{ steps.rollout.outputs.revision }}
      service_url: ${{ steps.rollout.outputs.service_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy secret
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "${GCP_SA_KEY}" ]; then
            echo "ERROR: GCP_SA_KEY secret is missing."
            exit 1
          fi
          echo "GCP_SA_KEY is present."

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build, deploy candidate, and promote only if healthy
        id: rollout
        shell: bash
        run: |
          set -uo pipefail
          set +e

          IMAGE="gcr.io/${PROJECT_ID}/${SERVICE_NAME}:${GITHUB_SHA}"
          CANDIDATE_TAG="sha-${GITHUB_SHA::7}"
          REVISION=""
          SERVICE_URL=""
          CANDIDATE_URL=""
          PREVIOUS_TRAFFIC_REVISION=""
          FAILURE_REASON=""
          FINAL_STATUS="failure"

          write_outputs() {
            {
              echo "final_status=${FINAL_STATUS}"
              echo "failure_reason=${FAILURE_REASON}"
              echo "revision=${REVISION}"
              echo "service_url=${SERVICE_URL}"
            } >> "${GITHUB_OUTPUT}"
          }

          extract_failure_reason() {
            local revision_name="$1"
            local deploy_output="$2"
            if [[ -z "${revision_name}" ]]; then
              if echo "${deploy_output}" | grep -qi "secret.*not found"; then
                echo "deploy secret topilmadi"
              elif echo "${deploy_output}" | grep -qi "permission\|forbidden\|denied"; then
                echo "deploy ruxsati rad etildi"
              elif echo "${deploy_output}" | grep -qi "image.*not found"; then
                echo "deploy image topilmadi"
              elif [[ -n "${deploy_output}" ]]; then
                echo "${deploy_output}" | tr '\n' ' ' | cut -c1-500
              else
                echo "deploy command failed"
              fi
              return
            fi

            local logs
            logs="$(gcloud logging read \
              "resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE_NAME} AND resource.labels.revision_name=${revision_name}" \
              --project "${PROJECT_ID}" \
              --limit=40 \
              --format='value(textPayload)' 2>/dev/null || true)"

            if echo "${logs}" | grep -qi "InvalidToken\|JWT error"; then
              echo "Turso auth token invalid"
            elif echo "${logs}" | grep -qi "_EmptyResultSet\|malformed for SQL\|init_instance"; then
              echo "Turso adapter startup crash"
            elif echo "${logs}" | grep -qi "Default STARTUP TCP probe failed\|failed to start and listen on the port"; then
              echo "container startup failed"
            elif echo "${logs}" | grep -qi "/health\|unhealthy\|heartbeat_stale"; then
              echo "health check failed"
            elif [[ -n "${logs}" ]]; then
              echo "${logs}" | tr '\n' ' ' | cut -c1-500
            else
              echo "deploy command failed"
            fi
          }

          read_service_state() {
            local service_json
            service_json="$(gcloud run services describe "${SERVICE_NAME}" \
              --region "${REGION}" \
              --project "${PROJECT_ID}" \
              --format=json)"

            REVISION="$(printf '%s' "${service_json}" | python -c 'import json, sys; data = json.load(sys.stdin); print(data["status"].get("latestCreatedRevisionName", ""))')"
            SERVICE_URL="$(printf '%s' "${service_json}" | python -c 'import json, sys; data = json.load(sys.stdin); print(data["status"].get("url", ""))')"
            CANDIDATE_URL="$(printf '%s' "${service_json}" | python -c 'import json, sys; tag = sys.argv[1]; data = json.load(sys.stdin); print(next((entry.get("url", "") for entry in data.get("status", {}).get("traffic", []) if entry.get("tag") == tag), ""))' "${CANDIDATE_TAG}")"
          }

          check_health_endpoint() {
            local url="$1"
            local body_file
            body_file="$(mktemp)"
            local code
            code="$(curl -fsS -o "${body_file}" -w "%{http_code}" "${url}/health" || true)"
            if [[ "${code}" != "200" ]]; then
              rm -f "${body_file}"
              return 1
            fi

            python -c 'import json, sys; payload = json.load(open(sys.argv[1], "r", encoding="utf-8")); raise SystemExit(0 if payload.get("status") == "ok" else 1)' "${body_file}"
            local status=$?
            rm -f "${body_file}"
            return "${status}"
          }

           cleanup_generated_traffic_tags() {
             local service_json
             service_json="$(gcloud run services describe "${SERVICE_NAME}" \
               --region "${REGION}" \
               --project "${PROJECT_ID}" \
               --format=json)"

             # Get all stale tags
             local stale_tags
             stale_tags="$(printf '%s' "${service_json}" | python -c 'import json, sys; data=json.load(sys.stdin); tags=[entry.get("tag", "") for entry in data.get("status", {}).get("traffic", [])]; print(",".join(tag for tag in tags if tag.startswith("sha-") or tag.startswith("debug")))')"
             if [[ -z "${stale_tags}" ]]; then
               return 0
             fi

             # Check which revisions are actually ready before removing tags
             local ready_revisions
             ready_revisions="$(gcloud run revisions list \
               --service "${SERVICE_NAME}" \
               --region "${REGION}" \
               --project "${PROJECT_ID}" \
               --filter="status.conditions[0].status=True" \
               --format='value(metadata.name)' 2>/dev/null || true)"

             # Build a list of tags to remove, filtering out non-ready revisions
             local cleanup_tags=""
             local IFS=','
             for tag in ${stale_tags}; do
               local rev_name=""
               rev_name="$(printf '%s' "${service_json}" | python -c 'import json,sys; data=json.load(sys.stdin); tag=sys.argv[1]; print(next((e["revisionName"] for e in data.get("status",{}).get("traffic",[]) if e.get("tag")==tag),""))' "${tag}")"
               if [[ -z "${rev_name}" ]]; then
                 cleanup_tags="${cleanup_tags},${tag}"
               elif echo "${ready_revisions}" | grep -q "${rev_name}"; then
                 cleanup_tags="${cleanup_tags},${tag}"
               else
                 echo "Skipping tag '${tag}' — revision '${rev_name}' is not ready; deleting revision directly."
                 gcloud run revisions delete "${rev_name}" \
                   --region "${REGION}" \
                   --project "${PROJECT_ID}" \
                   --quiet 2>/dev/null || true
               fi
             done
             unset IFS

             cleanup_tags="${cleanup_tags#,}"

             if [[ -z "${cleanup_tags}" ]]; then
               echo "No ready revisions with stale tags to clean up."
               return 0
             fi

             gcloud run services update-traffic "${SERVICE_NAME}" \
               --region "${REGION}" \
               --project "${PROJECT_ID}" \
               --remove-tags "${cleanup_tags}" \
               --quiet 2>&1 || echo "Tag cleanup completed with warnings (non-fatal)."
             return 0
           }

          cleanup_legacy_userbot_bindings() {
            local service_json
            service_json="$(gcloud run services describe "${SERVICE_NAME}" \
              --region "${REGION}" \
              --project "${PROJECT_ID}" \
              --format=json)"

            local secret_names
            secret_names="$(printf '%s' "${service_json}" | python -c 'import json, sys; data=json.load(sys.stdin); names={"ENABLE_CLOUD_USERBOT","USERBOT_SESSION_STRING","USERBOT_SESSION_B64"}; envs=data.get("spec", {}).get("template", {}).get("spec", {}).get("containers", [{}])[0].get("env", []); print(",".join(env.get("name", "") for env in envs if env.get("name") in names and env.get("valueFrom")))' )"

            local literal_session_names
            literal_session_names="$(printf '%s' "${service_json}" | python -c 'import json, sys; data=json.load(sys.stdin); names={"USERBOT_SESSION_STRING","USERBOT_SESSION_B64"}; envs=data.get("spec", {}).get("template", {}).get("spec", {}).get("containers", [{}])[0].get("env", []); print(",".join(env.get("name", "") for env in envs if env.get("name") in names and "value" in env))' )"

            if [[ -z "${secret_names}" && -z "${literal_session_names}" ]]; then
              return 0
            fi

            local args=()
            if [[ -n "${secret_names}" ]]; then
              args+=(--remove-secrets "${secret_names}")
            fi
            if [[ -n "${literal_session_names}" ]]; then
              args+=(--remove-env-vars "${literal_session_names}")
            fi

            gcloud run services update "${SERVICE_NAME}" \
              --region "${REGION}" \
              --project "${PROJECT_ID}" \
              "${args[@]}" \
              --no-traffic \
              --quiet
          }

          PREVIOUS_TRAFFIC_REVISION="$(gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format=json | python -c 'import json, sys; data=json.load(sys.stdin); print(next((entry.get("revisionName", "") for entry in data.get("status", {}).get("traffic", []) if entry.get("percent", 0) == 100), ""))' 2>/dev/null || true)"

          BUILD_OUTPUT="$(gcloud builds submit --tag "${IMAGE}" --async --quiet . 2>&1)"
          BUILD_RC=$?
          if [[ ${BUILD_RC} -ne 0 ]]; then
            if [[ -n "${BUILD_OUTPUT}" ]]; then
              FAILURE_REASON="$(echo "${BUILD_OUTPUT}" | tr '\n' ' ' | cut -c1-500)"
            else
              FAILURE_REASON="container build command failed"
            fi
            write_outputs
            exit 0
          fi

          IMAGE_READY="false"
          for attempt in {1..36}; do
            if gcloud container images describe "${IMAGE}" >/dev/null 2>&1; then
              IMAGE_READY="true"
              break
            fi
            sleep 10
          done

          if [[ "${IMAGE_READY}" != "true" ]]; then
            FAILURE_REASON="container image not ready after build wait"
            write_outputs
            exit 0
          fi

          TAG_CLEANUP_OUTPUT="$(cleanup_generated_traffic_tags 2>&1)"
          TAG_CLEANUP_RC=$?
          if [[ ${TAG_CLEANUP_RC} -ne 0 ]]; then
            FAILURE_REASON="traffic tag cleanup failed: $(echo "${TAG_CLEANUP_OUTPUT}" | tr '\n' ' ' | cut -c1-500)"
            write_outputs
            exit 0
          fi

          USERBOT_BINDING_CLEANUP_OUTPUT="$(cleanup_legacy_userbot_bindings 2>&1)"
          USERBOT_BINDING_CLEANUP_RC=$?
          if [[ ${USERBOT_BINDING_CLEANUP_RC} -ne 0 ]]; then
            FAILURE_REASON="userbot secret binding cleanup failed: $(echo "${USERBOT_BINDING_CLEANUP_OUTPUT}" | tr '\n' ' ' | cut -c1-500)"
            write_outputs
            exit 0
          fi

          FAILURE_REASON="deploy command failed"
          DEPLOY_OUTPUT="$(gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE}" \
            --platform managed \
            --region "${REGION}" \
            --memory 4Gi \
            --cpu 2 \
            --timeout 3600 \
            --max-instances 1 \
            --min-instances 1 \
            --no-cpu-throttling \
            --cpu-boost \
            --execution-environment gen2 \
            --no-traffic \
            --tag "${CANDIDATE_TAG}" \
            --set-env-vars "RUNNING_IN_CLOUD=True,ENVIRONMENT=production,CLOUD_RUN_CONTROL_PLANE_ONLY=True,ENABLE_CLOUD_USERBOT=False,DATABASE_URL=bot_database.db,AMOCRM_SUBDOMAIN=jonbrandingagency,AIRTABLE_BASE_ID=app8xoyx1XCumYFXV,CRM_GROUP_ID=-1002566480563,TEAM_GROUP_ID=-4860594772,TOPIC_KIRIM_ID=168,GSHEET_ID=1KEFClhl4mVwCXI3YPfeE1B9X3SOkML2fp3NMocZzm8k,GSHEET_CREDS_FILE=service_account.json,OWNER_ID=150074828,AUTO_REPLY_MODE=shadow,VIP_LEAD_SCORE_THRESHOLD=80" \
            --set-secrets "BOT_TOKEN=BOT_TOKEN:latest,API_ID=API_ID:latest,API_HASH=API_HASH:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,OISHA_API_SECRET=OISHA_API_SECRET:latest,AMOCRM_CLIENT_ID=AMOCRM_CLIENT_ID:latest,AMOCRM_CLIENT_SECRET=AMOCRM_CLIENT_SECRET:latest,AMOCRM_REDIRECT_URL=AMOCRM_REDIRECT_URL:latest,GCS_BUCKET=GCS_BUCKET:latest,GOOGLE_SERVICE_ACCOUNT_JSON=GOOGLE_SERVICE_ACCOUNT_JSON:latest,DEEPSEEK_API_KEY=oisha-deepseek-api-key:latest,TURSO_DATABASE_URL=TURSO_DATABASE_URL:latest,TURSO_AUTH_TOKEN=TURSO_AUTH_TOKEN:latest,AIRTABLE_API_KEY=AIRTABLE_API_KEY:latest,AMOCRM_TOKEN_JSON=amocrm-token:latest" \
            --labels "commit-sha=${GITHUB_SHA}" 2>&1)"
          DEPLOY_RC=$?

          if [[ ${DEPLOY_RC} -ne 0 ]]; then
            REVISION="$(gcloud run revisions list \
              --service "${SERVICE_NAME}" \
              --region "${REGION}" \
              --project "${PROJECT_ID}" \
              --filter "metadata.labels.commit-sha=${GITHUB_SHA}" \
              --limit 1 \
              --format='value(metadata.name)' 2>/dev/null || true)"
            FAILURE_REASON="$(extract_failure_reason "${REVISION}" "${DEPLOY_OUTPUT}")"
            write_outputs
            exit 0
          fi

          read_service_state

          if [[ -z "${CANDIDATE_URL}" ]]; then
            FAILURE_REASON="candidate revision URL not found"
            write_outputs
            exit 0
          fi

          READY_STATUS="$(gcloud run revisions describe "${REVISION}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format='value(status.conditions[0].status)' 2>/dev/null || true)"
          if [[ "${READY_STATUS}" != "True" ]]; then
            FAILURE_REASON="revision not ready"
            write_outputs
            exit 0
          fi

          sleep 45
          if ! check_health_endpoint "${CANDIDATE_URL}"; then
            FAILURE_REASON="health check failed"
            write_outputs
            exit 0
          fi

          sleep 20
          if ! check_health_endpoint "${CANDIDATE_URL}"; then
            FAILURE_REASON="health check unstable"
            write_outputs
            exit 0
          fi

          if ! gcloud run services update-traffic "${SERVICE_NAME}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --to-revisions "${REVISION}=100"; then
            FAILURE_REASON="traffic promotion failed"
            write_outputs
            exit 0
          fi

          SERVICE_URL="$(gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format='value(status.url)')"

          sleep 10
          if ! check_health_endpoint "${SERVICE_URL}"; then
            FAILURE_REASON="post-promotion health check failed"
            if [[ -n "${PREVIOUS_TRAFFIC_REVISION}" ]]; then
              gcloud run services update-traffic "${SERVICE_NAME}" \
                --region "${REGION}" \
                --project "${PROJECT_ID}" \
                --to-revisions "${PREVIOUS_TRAFFIC_REVISION}=100" || true
            fi
            write_outputs
            exit 0
          fi

          FINAL_STATUS="success"
          FAILURE_REASON=""
          write_outputs

      - name: Ecosystem Health Check
        if: steps.rollout.outputs.final_status == 'success'
        run: |
          python scripts/health_check.py

      - name: Mark deployment failed
        if: steps.rollout.outputs.final_status != 'success'
        run: |
          echo "Deployment failed: ${{ steps.rollout.outputs.failure_reason }}"
          exit 1

  update-devlog:
    name: Auto-update DEV_LOG.md
    needs:
      - test
      - deploy
    if: "${{ always() && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.event.head_commit.message, 'chore(auto): update DEV_LOG') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Build and prepend log entry
        shell: bash
        run: |
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          BRANCH="${GITHUB_REF_NAME}"
          SHA="${GITHUB_SHA::7}"
          ACTOR="${GITHUB_ACTOR}"
          COMMIT_MSG=$(git log -1 --pretty=%s)

          DEPLOY_STATUS="${{ needs.deploy.outputs.final_status }}"
          FAILURE_REASON="${{ needs.deploy.outputs.failure_reason }}"
          REVISION="${{ needs.deploy.outputs.revision }}"

          if [[ "${DEPLOY_STATUS}" == "success" ]]; then
            STATUS_ICON="✅"
            STATUS_LINE="Deploy muvaffaqiyatli | Revision: ${REVISION}"
          elif [[ "${{ needs.test.result }}" != "success" ]]; then
            STATUS_ICON="🔴"
            STATUS_LINE="Test bosqichi muvaffaqiyatsiz"
          else
            STATUS_ICON="⚠️"
            STATUS_LINE="Deploy muvaffaqiyatsiz | Sabab: ${FAILURE_REASON}"
          fi

          # Build the new entry (use heredoc to avoid YAML block indent issues)
          cat > /tmp/new_entry.md <<EOF
          ## ${DATE} | ${STATUS_ICON} ${BRANCH} \`${SHA}\`

          **Commit**: ${COMMIT_MSG}
          **Actor**: @${ACTOR}
          **Status**: ${STATUS_LINE}

          ---

          EOF
          # Strip the 10-space indent that YAML block indentation forced on us
          sed -i 's/^          //' /tmp/new_entry.md
          NEW_ENTRY="$(cat /tmp/new_entry.md)"

          # Prepend to DEV_LOG.md (after the title lines)
          HEADER=$(head -6 DEV_LOG.md)
          BODY=$(tail -n +7 DEV_LOG.md)
          printf '%s\n\n%s\n%s' "$HEADER" "$NEW_ENTRY" "$BODY" > DEV_LOG.md
          # Force UTF-8 encoding for safety
          # Note: The original file header should be preserved.

      - name: Commit updated DEV_LOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DEV_LOG.md
          git diff --staged --quiet || git commit -m "chore(auto): update DEV_LOG [skip ci] — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

  notify:
    name: Notify Telegram
    needs:
      - test
      - deploy
    if: "${{ always() && !contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.event.head_commit.message, 'chore(auto): update DEV_LOG') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Send final deploy status
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${{ secrets.BOT_TOKEN }}" || -z "${{ secrets.OWNER_ID }}" ]]; then
            echo "Telegram secrets are missing; skipping notification."
            exit 0
          fi

          STATUS="failure"
          DETAILS=""

          if [[ "${{ needs.test.result }}" != "success" ]]; then
            DETAILS="tests failed"
          elif [[ "${{ needs.deploy.outputs.final_status }}" == "success" ]]; then
            STATUS="success"
            DETAILS="Revision: ${{ needs.deploy.outputs.revision }}"
          elif [[ -n "${{ needs.deploy.outputs.failure_reason }}" ]]; then
            DETAILS="Reason: ${{ needs.deploy.outputs.failure_reason }}"
          elif [[ "${{ needs.deploy.result }}" == "failure" ]]; then
            DETAILS="Reason: deploy job failed before promotion"
          else
            DETAILS="Reason: deployment skipped"
          fi

          MESSAGE=$'Deploy finished\nCommit: ${{ github.sha }}\nStatus: '"${STATUS}"$'\n'"${DETAILS}"

          curl -fsS -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.OWNER_ID }}" \
            --data-urlencode "text=${MESSAGE}"
