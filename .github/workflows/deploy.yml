name: Oisha-OS Auto Deploy

on:
  push:
    branches:
      - claude/infallible-kalam
      - main
      - master
  workflow_dispatch:

env:
  PROJECT_ID: jonbranding-85662071-ea38e
  SERVICE_NAME: oisha-master-bot
  REGION: europe-west3
  CLOUD_BUILD_LOG_DIR: gs://jonbranding-85662071-ea38e_cloudbuild/logs

jobs:
  test:
    name: Run Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short || true

      - name: Summary
        run: echo "Quality checks completed."

  deploy:
    name: Production Rollout
    needs: test
    if: github.event_name != 'pull_request'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy secret
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "ERROR: GCP_SA_KEY secret is missing."
            exit 1
          fi
          echo "GCP_SA_KEY is present."

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy via Cloud Build
        run: |
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --suppress-logs \
            --gcs-log-dir="${{ env.CLOUD_BUILD_LOG_DIR }}" \
            .

      - name: Verify deployment
        run: |
          gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --format='value(status.url)'

      - name: Notify Telegram
        if: always()
        run: |
          if [ -n "${{ secrets.BOT_TOKEN }}" ] && [ -n "${{ secrets.OWNER_ID }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.OWNER_ID }}" \
              -d "text=Deploy finished%0ACommit: ${{ github.sha }}%0AStatus: ${{ job.status }}"
          fi
