name: Oisha-OS Auto Deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: jonbranding-85662071-ea38e
  SERVICE_NAME: oisha-master-bot
  REGION: europe-west3
  WORKLOAD_IDENTITY_PROVIDER: projects/982617914297/locations/global/workloadIdentityPools/github-actions/providers/oisha-os
  DEPLOY_SERVICE_ACCOUNT: github-actions-oisha@jonbranding-85662071-ea38e.iam.gserviceaccount.com

jobs:
  test:
    name: Run Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev build-essential

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short || true

      - name: Summary
        run: echo "Quality checks completed."

  deploy:
    name: Production Rollout
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions="_SERVICE_NAME=${{ env.SERVICE_NAME }},_DEPLOY_REGION=${{ env.REGION }}" \
            .

      - name: Verify deployment
        run: |
          gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --format='value(status.url)'

      - name: Notify Telegram
        if: always()
        run: |
          if [ -n "${{ secrets.BOT_TOKEN }}" ] && [ -n "${{ secrets.OWNER_ID }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.OWNER_ID }}" \
              -d "text=Deploy finished%0ACommit: ${{ github.sha }}%0AStatus: ${{ job.status }}"
          fi
