name: Oisha-OS Auto Deploy

on:
  push:
    branches:
      - claude/infallible-kalam
      - main
      - master
  workflow_dispatch:

env:
  PROJECT_ID: jonbranding-85662071-ea38e
  SERVICE_NAME: oisha-master-bot
  REGION: europe-west3
  CLOUD_BUILD_LOG_DIR: gs://jonbranding-85662071-ea38e_cloudbuild/logs

jobs:
  test:
    name: Run Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short || true

      - name: Summary
        run: echo "Quality checks completed."

  deploy:
    name: Production Rollout
    needs: test
    if: github.event_name != 'pull_request'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy secret
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "ERROR: GCP_SA_KEY secret is missing."
            exit 1
          fi
          echo "GCP_SA_KEY is present."

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 🔄 Sync Secrets to GCP
        run: |
          sync_secret() {
            local name=$1
            local value=$2
            if [ -z "$value" ]; then
              echo "⚠️ Skipping $name (empty value)"
              return
            fi
            echo "Syncing $name..."
            if gcloud secrets describe "$name" --project=${{ env.PROJECT_ID }} > /dev/null 2>&1; then
              echo "$value" | gcloud secrets versions add "$name" --project=${{ env.PROJECT_ID }} --data-file=-
            else
              gcloud secrets create "$name" --project=${{ env.PROJECT_ID }} --replication-policy="automatic"
              echo "$value" | gcloud secrets versions add "$name" --project=${{ env.PROJECT_ID }} --data-file=-
            fi
          }
          # Mapping GitHub Secrets to cloudbuild.yaml names
          sync_secret "oisha-bot-token" "${{ secrets.BOT_TOKEN }}"
          sync_secret "oisha-api-hash" "${{ secrets.API_HASH }}"
          sync_secret "oisha-gemini-api-key" "${{ secrets.GEMINI_API_KEY }}"
          sync_secret "oisha-deepseek-api-key" "${{ secrets.DEEPSEEK_API_KEY }}"
          sync_secret "oisha-turso-auth-token" "${{ secrets.TURSO_AUTH_TOKEN }}"
          sync_secret "oisha-amocrm-client-secret" "${{ secrets.AMOCRM_CLIENT_SECRET }}"
          sync_secret "oisha-airtable-api-key" "${{ secrets.AIRTABLE_API_KEY }}"
          sync_secret "amocrm-token" "${{ secrets.AMOCRM_TOKEN_JSON }}"
          sync_secret "oisha-google-service-account-json" "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}"

      - name: Build and deploy via Cloud Build
        run: |
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --suppress-logs \
            --gcs-log-dir="${{ env.CLOUD_BUILD_LOG_DIR }}" \
            .

      - name: Verify deployment
        run: |
          gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --format='value(status.url)'

      - name: Notify Telegram
        if: always()
        run: |
          if [ -n "${{ secrets.BOT_TOKEN }}" ] && [ -n "${{ secrets.OWNER_ID }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.OWNER_ID }}" \
              -d "text=Deploy finished%0ACommit: ${{ github.sha }}%0AStatus: ${{ job.status }}"
          fi
