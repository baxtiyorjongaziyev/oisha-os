# Oisha-OS: Juma Greeting Automation
# Contabo VPS'dagi self-hosted runner'da, prod checkout ichida to'g'ridan-to'g'ri
# ishlaydi (SSH yo'q). Eski variant ORACLE_HOST ga SSH qilar edi — Oracle VM
# o'chirilgach 2026-10 dan beri har hafta "dial tcp :22 i/o timeout" bilan
# yiqilgan.
#
# Session: skript prod userbot kalitini ishlatishni RAD ETADI — Contabo
# .env da alohida JUMA_SESSION_STRING bo'lishi shart (telethon_guard).
#
# Payshanba Shomidan (taxminan 19:30 Toshkent) boshlab Juma Shomigacha davom
# etadigan ~24 soatlik oynada tarqatiladi — skriptning o'zi DEADLINE'ni
# ushlaydi. Job faqat jarayon ishga tushganini tasdiqlab tugaydi; skript fon
# rejimida davom etadi va Telegram orqali progress yuboradi.
name: Juma Tabrigi — Tez Natija guruhlar

on:
  workflow_dispatch:
  schedule:
    # Har Payshanba 19:30 Toshkent vaqti (taxminiy Shom) = 14:30 UTC
    - cron: '30 14 * * 4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send-greetings:
    name: Tez Natija Juma Tabrigi (Contabo VPS)
    runs-on: [self-hosted, oracle]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Start Juma greetings in prod checkout (fon rejimida)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /home/ubuntu/oisha-os

          # Skriptning main'dagi oxirgi versiyasini olamiz (faqat shu fayllar —
          # prod checkout'ning qolgan qismiga tegilmaydi).
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" 2>/dev/null || true
          git fetch origin main
          git checkout origin/main --             scripts/send_juma_greetings.py             scripts/juma_greeting_text.py             scripts/telethon_guard.py             scripts/__init__.py

          set -a
          . ./.env
          set +a

          if [ -z "${JUMA_SESSION_STRING:-}" ] && [ -z "${TELEGRAM_ONEOFF_SESSION_STRING:-}" ]; then
            echo "XATO: .env da JUMA_SESSION_STRING yo'q. Skript prod userbot kalitini ishlatmaydi —"
            echo "alohida session generatsiya qilib, Contabo .env ga JUMA_SESSION_STRING=... qo'shing."
            exit 1
          fi

          # Fon rejimi: ~24 soatlik oyna job timeout'idan uzun. RUNNER_TRACKING_ID
          # bo'shatilmasa, runner job tugaganda "orphan process" deb o'ldiradi.
          mkdir -p data/logs
          LOG_FILE="data/logs/juma_$(date +%Y%m%d_%H%M%S).log"
          RUNNER_TRACKING_ID="" setsid nohup ./venv/bin/python scripts/send_juma_greetings.py > "$LOG_FILE" 2>&1 < /dev/null &
          PID=$!
          sleep 8
          if kill -0 "$PID" 2>/dev/null; then
            echo "Juma tabrigi fon rejimida ishga tushdi (PID $PID), log: $LOG_FILE"
          else
            # Oyna yopiq bo'lsa skript 0 bilan chiqadi — bu xato emas.
            if wait "$PID"; then
              echo "Skript darhol va xatosiz tugadi. Log:"
              cat "$LOG_FILE" || true
            else
              echo "XATO: jarayon darhol yiqildi. Log:"
              cat "$LOG_FILE" || true
              exit 1
            fi
          fi
