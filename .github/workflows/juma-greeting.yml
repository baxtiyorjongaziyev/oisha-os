# Oisha-OS: Juma Greeting Automation
# Runs directly on Oracle VM using the live Telethon session —
# no StringSession expiry, no manual token renewal needed.
#
# Juma 06:00 Toshkent (06:00–08:00 silent=True) dan Juma Shomigacha (17:00)
# davom etadigan oynada, TN7 ustuvorligida tarqatiladi — skriptning o'zi
# DEADLINE va sokin soatlarni ushlaydi. GitHub-hosted runner'lar 6 soatdan
# uzoq ishlay olmaydi, shuning uchun jarayon VM'da FON rejimida (nohup)
# ishga tushiriladi — GH Actions job faqat ishga tushganini tasdiqlab,
# darhol tugaydi; skriptning o'zi Telegram orqali progress xabarlarini
# yuboradi (send_tg_notification).
name: Juma Tabrigi — Tez Natija guruhlar

on:
  workflow_dispatch:
  schedule:
    # Har Juma 06:00 Toshkent vaqti = 01:00 UTC
    - cron: '0 1 * * 5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send-greetings:
    name: Tez Natija Juma Tabrigi (Hetzner VPS)
    runs-on: [self-hosted, oracle]
    timeout-minutes: 10
    steps:
      - name: Send Juma greetings on Hetzner VPS (fon rejimida)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OISHA_DIR="/home/deploy/oisha-os"
          [ -d "$OISHA_DIR" ] || OISHA_DIR="/home/ubuntu/oisha-os"
          cd "$OISHA_DIR"

          # Pull latest script from main if git repo is initialized
          if [ -d .git ]; then
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" 2>/dev/null || true
            git fetch origin main
            git stash --include-untracked 2>/dev/null || true
            git checkout origin/main -- scripts/send_juma_greetings.py scripts/telethon_guard.py scripts/__init__.py src/services/core/juma_guard.py
            git remote set-url origin "https://github.com/baxtiyorjongaziyev/oisha-os.git" 2>/dev/null || true
          fi

          # Load credentials from VM's .env and dedicated /etc/oisha/juma.env
          if [ -f .env ]; then
            set -o allexport
            source .env
            if [ -f /etc/oisha/juma.env ]; then
              source /etc/oisha/juma.env
            fi
            set +o allexport
          fi

          # Fon rejimida ishga tushirish: RUNNER_TRACKING_ID olib tashlanadi va setsid
          # yangi sessiya ochadi, aks holda runner cleanup jarayonni o'ldiradi.
          mkdir -p data/logs
          LOG_FILE="data/logs/juma_$(date +%Y%m%d_%H%M%S).log"
          env -u RUNNER_TRACKING_ID setsid nohup ./venv/bin/python scripts/send_juma_greetings.py > "$LOG_FILE" 2>&1 < /dev/null &
          PID=$!
          sleep 5
          if kill -0 "$PID" 2>/dev/null; then
            echo "Juma tabrigi fon rejimida ishga tushdi (PID $PID), log: $LOG_FILE"
          else
            echo "OGOHLANTIRISH: jarayon darhol to'xtadi. Log:"
            cat "$LOG_FILE" || true
            exit 1
          fi
