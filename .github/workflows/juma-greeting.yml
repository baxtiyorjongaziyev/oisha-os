# Oisha-OS: Juma Greeting Automation
# [REFRESH: 2026-05-07]
name: Juma Tabrigi — TN5 Kursdoshlar

on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/juma-trigger'

jobs:
  send-greetings:
    name: TN5 Juma Tabrigi
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install telethon==1.36.0 python-dotenv

      - name: Send Juma greetings
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          USERBOT_SESSION_STRING: ${{ secrets.USERBOT_SESSION_STRING }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: python scripts/send_juma_greetings.py
