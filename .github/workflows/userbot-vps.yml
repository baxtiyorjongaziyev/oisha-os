# Oisha-OS: Userbot VPS Deployment
# [REFRESH: 2026-05-07.1] Final sync
# ⚠️ NOTE: All secrets must be passed via GitHub Secrets or configured manually on VPS.
#         No credentials should be hardcoded in public repo files.
name: Userbot — VPS Deploy & Start

on:
  push:
    paths:
      - '.github/workflows/userbot-vps.yml'
      - 'deploy/userbot-trigger'
  workflow_dispatch:

env:
  OWNER_ID: "150074828"

jobs:
  deploy-userbot:
    name: SSH → VPS → Userbot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to VPS 1 (109.199.100.137)
        id: vps1
        uses: appleboy/ssh-action@v1.2.5
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMOCRM_CLIENT_ID: ${{ secrets.AMOCRM_CLIENT_ID }}
          AMOCRM_CLIENT_SECRET: ${{ secrets.AMOCRM_CLIENT_SECRET }}
          OISHA_API_SECRET: ${{ secrets.OISHA_API_SECRET }}
          OPENCLAW_SECRET: ${{ secrets.OPENCLAW_SECRET }}
          USERBOT_SESSION_STRING: ${{ secrets.USERBOT_SESSION_STRING }}
        with:
          host: 109.199.100.137
          username: root
          password: ${{ secrets.VPS_PASSWORD_1 }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          envs: GITHUB_TOKEN,BOT_TOKEN,API_ID,API_HASH,GEMINI_API_KEY,AMOCRM_CLIENT_ID,AMOCRM_CLIENT_SECRET,OISHA_API_SECRET,OPENCLAW_SECRET,USERBOT_SESSION_STRING
          script: |
            set -e
            echo "=== VPS 1 (109.199.100.137) ga ulandi ==="

            # Papkani topish
            OISHA_DIR=""
            for d in /root/oisha-os /root/telegram_bot /home/baxtiyorjongaziyev/oisha-os; do
              [ -f "$d/src/main.py" ] && OISHA_DIR="$d" && break
            done

            if [ -z "$OISHA_DIR" ]; then
              OISHA_DIR="/root/oisha-os"
              mkdir -p "$OISHA_DIR"
              git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" "$OISHA_DIR"
            else
              cd "$OISHA_DIR"
              git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" 2>/dev/null || true
              git fetch origin main 2>/dev/null && git reset --hard origin/main 2>/dev/null || echo "Git sync skipped (branch may not exist or no changes)"
            fi

            cd "$OISHA_DIR"
            echo "Papka: $(pwd)"

            # .env faylini GitHub Secrets dan yaratish
            > .env
            echo "BOT_TOKEN=${BOT_TOKEN}" >> .env
            echo "API_ID=${API_ID}" >> .env
            echo "API_HASH=${API_HASH}" >> .env
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> .env
            echo "AMOCRM_SUBDOMAIN=jonbrandingagency" >> .env
            echo "AMOCRM_CLIENT_ID=${AMOCRM_CLIENT_ID}" >> .env
            echo "AMOCRM_CLIENT_SECRET=${AMOCRM_CLIENT_SECRET}" >> .env
            echo "OISHA_API_SECRET=${OISHA_API_SECRET}" >> .env
            echo "OPENCLAW_SECRET=${OPENCLAW_SECRET}" >> .env
            echo "USERBOT_SESSION_STRING=${USERBOT_SESSION_STRING}" >> .env
            echo "OWNER_ID=150074828" >> .env
            echo "ENABLE_AUTO_REPLY=false" >> .env
            echo "RUNNING_IN_CLOUD=False" >> .env
            echo "AIRTABLE_BASE_ID=app8xoyx1XCumYFXV" >> .env
            echo "CRM_GROUP_ID=-1002566480563" >> .env
            echo "TEAM_GROUP_ID=-4860594772" >> .env
            echo "GSHEET_ID=1KEFClhl4mVwCXI3YPfeE1B9X3SOkML2fp3NMocZzm8k" >> .env

            # Python paketlar
            if [ -f requirements.txt ]; then
              python3 -m pip install -r requirements.txt -q --break-system-packages 2>/dev/null \
                || python3 -m pip install -r requirements.txt -q || true
            else
              echo "WARNING: requirements.txt not found, skipping pip install"
            fi

            # Eski jarayon
            pkill -f "python.*main.py" 2>/dev/null || true
            pkill -f "python.*userbot" 2>/dev/null || true
            sleep 2

            # Systemd service yaratish (persistent) — root uchun system service
            mkdir -p /etc/systemd/system
            > /etc/systemd/system/oisha-userbot.service
            echo "[Unit]" >> /etc/systemd/system/oisha-userbot.service
            echo "Description=Oisha Userbot" >> /etc/systemd/system/oisha-userbot.service
            echo "After=network.target" >> /etc/systemd/system/oisha-userbot.service
            echo "" >> /etc/systemd/system/oisha-userbot.service
            echo "[Service]" >> /etc/systemd/system/oisha-userbot.service
            echo "WorkingDirectory=${OISHA_DIR}" >> /etc/systemd/system/oisha-userbot.service
            echo "ExecStart=/usr/bin/python3 ${OISHA_DIR}/src/main.py" >> /etc/systemd/system/oisha-userbot.service
            echo "Restart=always" >> /etc/systemd/system/oisha-userbot.service
            echo "RestartSec=10" >> /etc/systemd/system/oisha-userbot.service
            echo "EnvironmentFile=${OISHA_DIR}/.env" >> /etc/systemd/system/oisha-userbot.service
            echo "StandardOutput=append:/var/log/oisha-userbot.log" >> /etc/systemd/system/oisha-userbot.service
            echo "StandardError=append:/var/log/oisha-userbot.log" >> /etc/systemd/system/oisha-userbot.service
            echo "" >> /etc/systemd/system/oisha-userbot.service
            echo "[Install]" >> /etc/systemd/system/oisha-userbot.service
            echo "WantedBy=multi-user.target" >> /etc/systemd/system/oisha-userbot.service

            systemctl daemon-reload 2>/dev/null || true
            systemctl enable oisha-userbot 2>/dev/null || true
            if ! systemctl restart oisha-userbot 2>/dev/null; then
              # Fallback: nohup (if systemd not available)
              mkdir -p /var/log
              nohup python3 ${OISHA_DIR}/src/main.py >> /var/log/oisha-userbot.log 2>&1 &
              echo "nohup PID: $!"
            fi

            sleep 8

            # Natijani tekshirish
            if pgrep -f "python.*main.py" > /dev/null; then
              PID=$(pgrep -f "python.*main.py" | head -1)
              echo "SUCCESS: Oisha userbot ishlayapti! PID=$PID"
              tail -15 /var/log/oisha-userbot.log 2>/dev/null || true
            else
              echo "XATO: Jarayon topilmadi"
              tail -30 /var/log/oisha-userbot.log 2>/dev/null || true
              exit 1
            fi

      - name: Deploy to VPS 2 (104.197.19.4)
        id: vps2
        if: steps.vps1.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.5
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMOCRM_CLIENT_ID: ${{ secrets.AMOCRM_CLIENT_ID }}
          AMOCRM_CLIENT_SECRET: ${{ secrets.AMOCRM_CLIENT_SECRET }}
          OISHA_API_SECRET: ${{ secrets.OISHA_API_SECRET }}
          OPENCLAW_SECRET: ${{ secrets.OPENCLAW_SECRET }}
          USERBOT_SESSION_STRING: ${{ secrets.USERBOT_SESSION_STRING }}
        with:
          host: 104.197.19.4
          username: baxtiyorjongaziyev
          password: ${{ secrets.VPS_PASSWORD_2 }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          envs: GITHUB_TOKEN,BOT_TOKEN,API_ID,API_HASH,GEMINI_API_KEY,AMOCRM_CLIENT_ID,AMOCRM_CLIENT_SECRET,OISHA_API_SECRET,OPENCLAW_SECRET,USERBOT_SESSION_STRING
          script: |
            set -e
            echo "=== VPS 2 (104.197.19.4) ==="

            OISHA_DIR=""
            for d in /home/baxtiyorjongaziyev/oisha-os /home/baxtiyorjongaziyev/telegram_bot; do
              [ -f "$d/src/main.py" ] && OISHA_DIR="$d" && break
            done

            if [ -z "$OISHA_DIR" ]; then
              OISHA_DIR="/home/baxtiyorjongaziyev/oisha-os"
              mkdir -p "$OISHA_DIR"
              git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" "$OISHA_DIR"
            else
              cd "$OISHA_DIR"
              git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" 2>/dev/null || true
              git fetch origin main 2>/dev/null && git reset --hard origin/main 2>/dev/null || echo "Git sync skipped"
            fi

            cd "$OISHA_DIR"

            > .env
            echo "BOT_TOKEN=${BOT_TOKEN}" >> .env
            echo "API_ID=${API_ID}" >> .env
            echo "API_HASH=${API_HASH}" >> .env
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> .env
            echo "AMOCRM_SUBDOMAIN=jonbrandingagency" >> .env
            echo "AMOCRM_CLIENT_ID=${AMOCRM_CLIENT_ID}" >> .env
            echo "AMOCRM_CLIENT_SECRET=${AMOCRM_CLIENT_SECRET}" >> .env
            echo "OISHA_API_SECRET=${OISHA_API_SECRET}" >> .env
            echo "OPENCLAW_SECRET=${OPENCLAW_SECRET}" >> .env
            echo "USERBOT_SESSION_STRING=${USERBOT_SESSION_STRING}" >> .env
            echo "OWNER_ID=150074828" >> .env
            echo "ENABLE_AUTO_REPLY=false" >> .env
            echo "RUNNING_IN_CLOUD=False" >> .env

            if [ -f requirements.txt ]; then
              python3 -m pip install -r requirements.txt -q --break-system-packages 2>/dev/null || true
            fi

            pkill -f "python.*main.py" 2>/dev/null || true
            sleep 2
            nohup python3 src/main.py >> /tmp/oisha-userbot.log 2>&1 &
            sleep 8
            pgrep -f "python.*main.py" && echo "SUCCESS" || (tail -20 /tmp/oisha-userbot.log; exit 1)

      - name: Telegram — natijani yuborish
        if: always()
        run: |
          VPS1_STATUS="${{ steps.vps1.conclusion }}"
          VPS2_STATUS="${{ steps.vps2.conclusion }}"
          if [ "$VPS1_STATUS" = "success" ]; then
            MSG="✅ Oisha userbot VPS 1 da ishga tushdi!%0A%F0%9F%96%A5 109.199.100.137%0ASystemd + nohup orqali"
          elif [ "$VPS2_STATUS" = "success" ]; then
            MSG="✅ Oisha userbot VPS 2 da ishga tushdi!%0A%F0%9F%96%A5 104.197.19.4"
          else
            MSG="❌ Userbot VPS ga ulanmadi.%0AVPS 1: $VPS1_STATUS%0AVPS 2: $VPS2_STATUS%0AHar ikki server ham yopiq ko'rinadi."
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${OWNER_ID}" \
            -d "text=${MSG}" || true