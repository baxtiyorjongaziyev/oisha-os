name: Userbot — VPS Deploy & Start

on:
  push:
    paths:
      - '.github/workflows/userbot-vps.yml'
      - 'deploy/userbot-trigger'
  workflow_dispatch:

env:
  BOT_TOKEN: "8343217526:AAH0odkrzt9hF2xCIxbYped2OnYnP0Txe-4"
  OWNER_ID: "150074828"

jobs:
