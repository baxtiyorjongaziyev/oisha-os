            sed -i 's/^            //' .env

            # Python paketlar
            python3 -m pip install -r requirements.txt -q --break-system-packages 2>/dev/null \
              || python3 -m pip install -r requirements.txt -q || true

            # Eski jarayon
            pkill -f "python.*main.py" 2>/dev/null || true
            pkill -f "python.*userbot" 2>/dev/null || true
            sleep 2

            # Systemd service yaratish (persistent)
            mkdir -p ~/.config/systemd/user
            cat > ~/.config/systemd/user/oisha-userbot.service << SVCEOF
            [Unit]
            Description=Oisha Userbot
            After=network.target

            [Service]
            WorkingDirectory=$(pwd)
            ExecStart=/usr/bin/python3 src/main.py
            Restart=always
            RestartSec=10
            EnvironmentFile=$(pwd)/.env
            StandardOutput=append:/var/log/oisha-userbot.log
            StandardError=append:/var/log/oisha-userbot.log

            [Install]
            WantedBy=default.target
            SVCEOF
            sed -i 's/^            //' ~/.config/systemd/user/oisha-userbot.service

            systemctl --user daemon-reload 2>/dev/null || true
            systemctl --user enable oisha-userbot 2>/dev/null || true
            systemctl --user restart oisha-userbot 2>/dev/null || (
              # Fallback: nohup
              mkdir -p /var/log
              nohup python3 src/main.py >> /var/log/oisha-userbot.log 2>&1 &
              echo "nohup PID: $!"
            )

            sleep 8

            # Natijani tekshirish
            if pgrep -f "python.*main.py" > /dev/null; then
              PID=$(pgrep -f "python.*main.py" | head -1)
              echo "SUCCESS: Oisha userbot ishlayapti! PID=$PID"
              tail -15 /var/log/oisha-userbot.log 2>/dev/null || true
            else
              echo "XATO: Jarayon topilmadi"
              tail -30 /var/log/oisha-userbot.log 2>/dev/null || true
