# Oisha-OS: Userbot VPS Deployment
# [REFRESH: 2026-05-07.1] Final sync
# ⚠️ NOTE: All secrets must be passed via GitHub Secrets or configured manually on VPS.
#         No credentials should be hardcoded in public repo files.
name: Userbot — VPS Deploy & Start

on:
  push:
    paths:
      - '.github/workflows/userbot-vps.yml'
      - 'deploy/userbot-trigger'
  workflow_dispatch:

env:
  OWNER_ID: "150074828"

jobs:
  deploy-userbot:
    name: SSH → VPS → Userbot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to VPS 1 (109.199.100.137)
        id: vps1
        uses: appleboy/ssh-action@v1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMOCRM_CLIENT_ID: ${{ secrets.AMOCRM_CLIENT_ID }}
          AMOCRM_CLIENT_SECRET: ${{ secrets.AMOCRM_CLIENT_SECRET }}
          OISHA_API_SECRET: ${{ secrets.OISHA_API_SECRET }}
          OPENCLAW_SECRET: ${{ secrets.OPENCLAW_SECRET }}
          USERBOT_SESSION_STRING: ${{ secrets.USERBOT_SESSION_STRING }}
        with:
          host: 109.199.100.137
          username: root
          password: ${{ secrets.VPS_PASSWORD_1 }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          envs: GITHUB_TOKEN,BOT_TOKEN,API_ID,API_HASH,GEMINI_API_KEY,AMOCRM_CLIENT_ID,AMOCRM_CLIENT_SECRET,OISHA_API_SECRET,OPENCLAW_SECRET,USERBOT_SESSION_STRING
          script: |
            set -e
            echo "=== VPS 1 (109.199.100.137) ga ulandi ==="

            # Papkani topish
            OISHA_DIR=""
            for d in /root/oisha-os /root/telegram_bot /home/baxtiyorjongaziyev/oisha-os; do
              [ -f "$d/src/main.py" ] && OISHA_DIR="$d" && break
            done

            if [ -z "$OISHA_DIR" ]; then
              OISHA_DIR="/root/oisha-os"
              mkdir -p "$OISHA_DIR"
              git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" "$OISHA_DIR"
            else
              cd "$OISHA_DIR"
              git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" 2>/dev/null || true
              git fetch origin main 2>/dev/null && git reset --hard origin/main 2>/dev/null || true
            fi

            cd "$OISHA_DIR"
            echo "Papka: $(pwd)"

            # .env faylini GitHub Secrets dan yaratish
            cat > .env << ENVEOF
BOT_TOKEN=${BOT_TOKEN}
API_ID=${API_ID}
API_HASH=${API_HASH}
GEMINI_API_KEY=${GEMINI_API_KEY}
AMOCRM_SUBDOMAIN=jonbrandingagency
AMOCRM_CLIENT_ID=${AMOCRM_CLIENT_ID}
AMOCRM_CLIENT_SECRET=${AMOCRM_CLIENT_SECRET}
OISHA_API_SECRET=${OISHA_API_SECRET}
OPENCLAW_SECRET=${OPENCLAW_SECRET}
USERBOT_SESSION_STRING=${USERBOT_SESSION_STRING}
OWNER_ID=150074828
ENABLE_AUTO_REPLY=false
RUNNING_IN_CLOUD=False
AIRTABLE_BASE_ID=app8xoyx1XCumYFXV
CRM_GROUP_ID=-1002566480563
TEAM_GROUP_ID=-4860594772
GSHEET_ID=1KEFClhl4mVwCXI3YPfeE1B9X3SOkML2fp3NMocZzm8k
ENVEOF

            # Python paketlar
            python3 -m pip install -r requirements.txt -q --break-system-packages 2>/dev/null \
              || python3 -m pip install -r requirements.txt -q || true

            # Eski jarayon
            pkill -f "python.*main.py" 2>/dev/null || true
            pkill -f "python.*userbot" 2>/dev/null || true
            sleep 2

            # Systemd service yaratish (persistent)
            mkdir -p ~/.config/systemd/user
            cat > ~/.config/systemd/user/oisha-userbot.service << SVCEOF
            [Unit]
            Description=Oisha Userbot
            After=network.target

            [Service]
            WorkingDirectory=$(pwd)
            ExecStart=/usr/bin/python3 src/main.py
            Restart=always
            RestartSec=10
            EnvironmentFile=$(pwd)/.env
            StandardOutput=append:/var/log/oisha-userbot.log
            StandardError=append:/var/log/oisha-userbot.log

            [Install]
            WantedBy=default.target
            SVCEOF
            sed -i 's/^            //' ~/.config/systemd/user/oisha-userbot.service

            systemctl --user daemon-reload 2>/dev/null || true
            systemctl --user enable oisha-userbot 2>/dev/null || true
            systemctl --user restart oisha-userbot 2>/dev/null || (
              # Fallback: nohup
              mkdir -p /var/log
              nohup python3 src/main.py >> /var/log/oisha-userbot.log 2>&1 &
              echo "nohup PID: $!"
            )

            sleep 8

            # Natijani tekshirish
            if pgrep -f "python.*main.py" > /dev/null; then
              PID=$(pgrep -f "python.*main.py" | head -1)
              echo "SUCCESS: Oisha userbot ishlayapti! PID=$PID"
              tail -15 /var/log/oisha-userbot.log 2>/dev/null || true
            else
              echo "XATO: Jarayon topilmadi"
              tail -30 /var/log/oisha-userbot.log 2>/dev/null || true
              exit 1
            fi

      - name: Deploy to VPS 2 (104.197.19.4)
        id: vps2
        if: steps.vps1.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMOCRM_CLIENT_ID: ${{ secrets.AMOCRM_CLIENT_ID }}
          AMOCRM_CLIENT_SECRET: ${{ secrets.AMOCRM_CLIENT_SECRET }}
          OISHA_API_SECRET: ${{ secrets.OISHA_API_SECRET }}
          USERBOT_SESSION_STRING: ${{ secrets.USERBOT_SESSION_STRING }}
        with:
          host: 104.197.19.4
          username: baxtiyorjongaziyev
          password: ${{ secrets.VPS_PASSWORD_2 }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          envs: GITHUB_TOKEN,BOT_TOKEN,API_ID,API_HASH,GEMINI_API_KEY,AMOCRM_CLIENT_ID,AMOCRM_CLIENT_SECRET,OISHA_API_SECRET,USERBOT_SESSION_STRING
          script: |
            set -e
            echo "=== VPS 2 (104.197.19.4) ==="

            OISHA_DIR=""
            for d in /home/baxtiyorjongaziyev/oisha-os /home/baxtiyorjongaziyev/telegram_bot; do
              [ -f "$d/src/main.py" ] && OISHA_DIR="$d" && break
            done

            if [ -z "$OISHA_DIR" ]; then
              OISHA_DIR="/home/baxtiyorjongaziyev/oisha-os"
              mkdir -p "$OISHA_DIR"
              git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" "$OISHA_DIR"
            else
              cd "$OISHA_DIR"
              git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" 2>/dev/null || true
              git fetch origin main && git reset --hard origin/main || true
            fi

            cd "$OISHA_DIR"

            cat > .env << ENVEOF
BOT_TOKEN=${BOT_TOKEN}
API_ID=${API_ID}
API_HASH=${API_HASH}
GEMINI_API_KEY=${GEMINI_API_KEY}
AMOCRM_SUBDOMAIN=jonbrandingagency
AMOCRM_CLIENT_ID=${AMOCRM_CLIENT_ID}
AMOCRM_CLIENT_SECRET=${AMOCRM_CLIENT_SECRET}
OISHA_API_SECRET=${OISHA_API_SECRET}
USERBOT_SESSION_STRING=${USERBOT_SESSION_STRING}
OWNER_ID=150074828
ENABLE_AUTO_REPLY=false
RUNNING_IN_CLOUD=False
ENVEOF

            python3 -m pip install -r requirements.txt -q --break-system-packages 2>/dev/null || true
            pkill -f "python.*main.py" 2>/dev/null || true
            sleep 2
            nohup python3 src/main.py >> /tmp/oisha-userbot.log 2>&1 &
            sleep 8
            pgrep -f "python.*main.py" && echo "SUCCESS" || (tail -20 /tmp/oisha-userbot.log; exit 1)

      - name: Telegram — natijani yuborish
        if: always()
        run: |
          if [ "${{ steps.vps1.outcome }}" = "success" ]; then
            MSG="✅ Oisha userbot VPS 1 da ishga tushdi!%0A🖥 109.199.100.137%0ASystemd + nohup orqali"
          elif [ "${{ steps.vps2.outcome }}" = "success" ]; then
            MSG="✅ Oisha userbot VPS 2 da ishga tushdi!%0A🖥 104.197.19.4"
          else
            MSG="❌ Userbot VPS ga ulanmadi.%0AVPS 1: ${{ steps.vps1.outcome }}%0AVPS 2: ${{ steps.vps2.outcome }}%0AHar ikki server ham yopiq ko'rinadi."
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${OWNER_ID}" \
            -d "text=${MSG}" || true
