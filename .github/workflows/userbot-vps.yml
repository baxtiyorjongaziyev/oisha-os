          username: root
          password: "#8tV9Hsm0aMqapdb"
          port: 22
          timeout: 30s
          command_timeout: 10m
          envs: GITHUB_TOKEN
          script: |
            set -e
            echo "=== VPS 1 (109.199.100.137) ga ulandi ==="

            # Papkani topish
            OISHA_DIR=""
            for d in /root/oisha-os /root/telegram_bot /home/baxtiyorjongaziyev/oisha-os; do
              [ -f "$d/src/main.py" ] && OISHA_DIR="$d" && break
            done

            if [ -z "$OISHA_DIR" ]; then
              OISHA_DIR="/root/oisha-os"
              mkdir -p "$OISHA_DIR"
              git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" "$OISHA_DIR"
            else
