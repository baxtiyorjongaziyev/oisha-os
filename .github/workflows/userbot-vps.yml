# Oisha-OS: Userbot VPS Decommission
# [REFRESH: 2026-07-03.1] Architecture fix
# ⚠️ VPS no longer runs the userbot. Oracle VM (oracle-deploy.yml) is the
#    sole owner of USERBOT_SESSION_STRING — it auto-deploys on every push
#    to main and is health-checked via /readyz. Running the same Telegram
#    session from VPS *and* Oracle VM concurrently causes Telegram to kick
#    both sides with AuthKeyDuplicatedError ("used under two different IP
#    addresses simultaneously"), which was the root cause of recurring
#    Oracle production deploy failures. This workflow now just ensures any
#    leftover userbot process/service on the VPS boxes stays stopped.
#    No app secrets are needed for a stop-only operation.
name: Userbot — VPS Decommission (stop only)

on:
  push:
    paths:
      - '.github/workflows/userbot-vps.yml'
      - 'deploy/userbot-trigger'
  workflow_dispatch:

env:
  OWNER_ID: "150074828"

jobs:
  stop-userbot:
    name: SSH → VPS → Stop userbot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Stop on VPS 1 (109.199.100.137)
        id: vps1
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        continue-on-error: true
        with:
          host: 109.199.100.137
          username: root
          password: ${{ secrets.VPS_PASSWORD_1 }}
          port: 22
          timeout: 30s
          command_timeout: 5m
          script: |
            set -e
            echo "=== VPS 1 (109.199.100.137): userbot decommission ==="
            systemctl stop oisha-userbot 2>/dev/null || true
            systemctl disable oisha-userbot 2>/dev/null || true
            pkill -f "python.*main.py" 2>/dev/null || true
            pkill -f "python.*userbot" 2>/dev/null || true
            sleep 2
            if pgrep -f "python.*main.py" > /dev/null; then
              echo "XATO: jarayon hali ham ishlayapti"
              exit 1
            fi
            echo "SUCCESS: VPS 1 userbot to'xtatildi (Oracle VM yagona production runner)"

      - name: Stop on VPS 2 (104.197.19.4)
        id: vps2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        continue-on-error: true
        with:
          host: 104.197.19.4
          username: baxtiyorjongaziyev
          password: ${{ secrets.VPS_PASSWORD_2 }}
          port: 22
          timeout: 30s
          command_timeout: 5m
          script: |
            set -e
            echo "=== VPS 2 (104.197.19.4): userbot decommission ==="
            pkill -f "python.*main.py" 2>/dev/null || true
            sleep 2
            if pgrep -f "python.*main.py" > /dev/null; then
              echo "XATO: jarayon hali ham ishlayapti"
              exit 1
            fi
            echo "SUCCESS: VPS 2 userbot to'xtatildi (Oracle VM yagona production runner)"

      - name: Telegram — natijani yuborish
        if: always()
        run: |
          # steps.<id>.outcome reflects the real result of the SSH step;
          # .conclusion would always read "success" here because of
          # continue-on-error, hiding real SSH/auth failures.
          VPS1_STATUS="${{ steps.vps1.outcome }}"
          VPS2_STATUS="${{ steps.vps2.outcome }}"
          MSG="Oisha userbot VPS decommission%0AVPS 1: $VPS1_STATUS%0AVPS 2: $VPS2_STATUS%0AOracle VM endi yagona userbot session egasi."
          if [ "$VPS1_STATUS" != "success" ] || [ "$VPS2_STATUS" != "success" ]; then
            MSG="⚠️ ${MSG}%0ADIQQAT: kamida bitta VPS ga ulanib bo'lmadi — userbot u yerda hali ham ishlab turgan bo'lishi mumkin. VPS_PASSWORD_1/VPS_PASSWORD_2 secretlarini tekshiring."
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${OWNER_ID}" \
            -d "text=${MSG}" || true