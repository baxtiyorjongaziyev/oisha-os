            cd "$OISHA_DIR"
            echo "Papka: $(pwd)"

            # To'liq .env yozish
            cat > .env << 'ENVEOF'
            BOT_TOKEN=8343217526:AAH0odkrzt9hF2xCIxbYped2OnYnP0Txe-4
            API_ID=30643078
            API_HASH=e5850001c1d86ac0fb439fbd8319cb7f
