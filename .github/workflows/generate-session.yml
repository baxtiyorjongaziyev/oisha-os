name: Telegram Session Generator

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Qadam: "1" = SMS yuborish | "2" = Login'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
      phone:
        description: 'Telefon raqami'
        required: false
        default: ''
      phone_code_hash:
        description: '[Faqat 2-qadam] 1-qadamdan olingan hash'
        required: false
        default: ''
      sms_code:
        description: '[Faqat 2-qadam] SMS kodi'
        required: false
        default: ''
      tg_password:
        description: '[Faqat 2-qadam] 2FA paroli'
        required: false
        default: ''
  push:
    paths:
      - 'deploy/session-step1-trigger'

jobs:
  generate:
    name: Session String Generator
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Telethon
        run: pip install telethon==1.36.0

      - name: Step 1 — SMS yuborish
        if: github.event.inputs.step == '1' || github.event_name == 'push'
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          PHONE: ${{ github.event.inputs.phone || secrets.TG_PHONE }}
        run: |
          python3 - <<'PYEOF'
          import asyncio, os
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          async def main():
              phone = os.environ["PHONE"]
              client = TelegramClient(StringSession(), int(os.environ["API_ID"]), os.environ["API_HASH"])
              await client.connect()
              result = await client.send_code_request(phone)
              print("=" * 60)
              print(f"SMS YUBORILDI: {phone}")
              print(f"PHONE_CODE_HASH: {result.phone_code_hash}")
              print("=" * 60)
              print("KEYINGI QADAM — Actions -> Telegram Session Generator -> Run workflow:")
              print(f"  step: 2")
              print(f"  phone: {phone}")
              print(f"  phone_code_hash: {result.phone_code_hash}")
              print(f"  sms_code: <telefoningizga kelgan kod>")
              print(f"  tg_password: <2FA parol>")
              await client.disconnect()

          asyncio.run(main())
          PYEOF

      - name: Step 2 — Login va Session String
        if: github.event.inputs.step == '2'
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          PHONE: ${{ github.event.inputs.phone }}
          PHONE_CODE_HASH: ${{ github.event.inputs.phone_code_hash }}
          SMS_CODE: ${{ github.event.inputs.sms_code }}
          TG_PASSWORD: ${{ github.event.inputs.tg_password }}
        run: |
          python3 - <<'PYEOF'
          import asyncio, os, sys
          from telethon import TelegramClient
          from telethon.errors import SessionPasswordNeededError
          from telethon.sessions import StringSession

          async def main():
              phone = os.environ["PHONE"]
              code = os.environ["SMS_CODE"].strip()
              phone_code_hash = os.environ["PHONE_CODE_HASH"].strip()
              password = os.environ.get("TG_PASSWORD", "").strip()

              client = TelegramClient(StringSession(), int(os.environ["API_ID"]), os.environ["API_HASH"])
              await client.connect()

              try:
                  await client.sign_in(
                      phone=phone,
                      code=code,
                      phone_code_hash=phone_code_hash,
                  )
              except SessionPasswordNeededError:
                  if not password:
                      print("2FA KERAK: tg_password maydonini to'ldiring va qayta ishga tushiring.")
                      sys.exit(1)
                  await client.sign_in(password=password)

              if not await client.is_user_authorized():
                  print("Authorization muvaffaqiyatsiz")
                  sys.exit(1)

              me = await client.get_me()
              session_string = client.session.save()

              print("=" * 60)
              print(f"LOGIN OK: {me.first_name} (@{me.username})")
              print("=" * 60)
              print("USERBOT_SESSION_STRING:")
              print(session_string)
              print("=" * 60)
              print("GitHub -> Settings -> Secrets -> USERBOT_SESSION_STRING ga joylashtiring!")
              await client.disconnect()

          asyncio.run(main())
          PYEOF
