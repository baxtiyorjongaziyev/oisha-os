name: Qurbon Hayit Tabrigi — Tez Natija guruhlar

on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/qurbon-trigger'

jobs:
  send-greetings:
    name: Tez Natija Qurbon Hayit Tabrigi
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Telethon
        run: pip install telethon==1.36.0

      - name: Send Qurbon Hayit greetings
        env:
          USERBOT_SESSION_STRING: ${{ secrets.USERBOT_SESSION_STRING || vars.USERBOT_SESSION_STRING }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: python scripts/send_qurbon_greetings.py
