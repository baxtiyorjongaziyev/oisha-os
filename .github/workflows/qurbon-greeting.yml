# Oisha-OS: Qurbon Hayit tabrigi.
#
# MUHIM: bu workflow ILGARI ubuntu-latest da prod USERBOT_SESSION_STRING bilan
# Telethon ga ulanardi. Runner ning IP si Oracle VM dan boshqa bo'lgani uchun
# Telegram auth key ni "two different IP addresses simultaneously" deb butunlay
# bekor qilardi (AuthKeyDuplicatedError) va prod userbot o'lardi.
#
# Endi juma-greeting.yml bilan bir xil: skript session EGASI bo'lgan Oracle VM
# da, VM ning o'z .env i bilan ishlaydi.
name: Qurbon Hayit Tabrigi — Tez Natija guruhlar

on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/qurbon-trigger'

jobs:
  send-greetings:
    name: Tez Natija Qurbon Hayit Tabrigi (Oracle VM)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Send Qurbon Hayit greetings on Oracle VM
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 115m
          envs: GITHUB_TOKEN
          script: |
            set -euo pipefail
            cd /home/ubuntu/oisha-os

            # Pull latest script from main
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" 2>/dev/null || true
            git fetch origin main
            git stash --include-untracked 2>/dev/null || true
            git checkout origin/main -- scripts/send_qurbon_greetings.py scripts/telethon_guard.py scripts/__init__.py

            # Load credentials from VM's .env (same session the main service uses)
            if [ -f .env ]; then
              set -o allexport
              source .env
              set +o allexport
            fi

            ./venv/bin/python scripts/send_qurbon_greetings.py
