name: Google Billing Support Reply

on:
  push:
    paths:
      - 'deploy/billing-reply-trigger'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reply:
    name: Post waiver request to Google Support cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q google-api-python-client google-auth

      - name: Post billing waiver comments
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$GCP_SA_KEY" > /tmp/sa.json
          SA_FILE=/tmp/sa.json python scripts/post_billing_reply.py
          rm -f /tmp/sa.json

      - name: Notify result via Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            MSG="Google%20Billing%20Reply%3A%20SUCCESS%0AComments%20posted%20to%20cases%2071989960%20(%2479.16)%20%2B%2071874253%20(%2458.61)"
          else
            MSG="Google%20Billing%20Reply%3A%20FAILED%0ACheck%20Actions%20logs"
          fi
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=150074828&text=${MSG}" > /dev/null || true
