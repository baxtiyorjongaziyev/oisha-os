name: Google Billing Support Reply

on:
  push:
    paths:
      - 'deploy/billing-reply-trigger'
  workflow_dispatch:

jobs:
  reply:
    name: Post waiver request to Google Support cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post comments via Cloud Support API on Oracle VM
        uses: appleboy/ssh-action@v1
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 4m
          envs: GCP_SA_KEY,GITHUB_TOKEN
          script: |
            set -euo pipefail
            cd /home/ubuntu/oisha-os
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" 2>/dev/null || true
            git fetch origin main
            git checkout origin/main -- scripts/post_billing_reply.py
            SA_TMP="/tmp/billing_sa_$$.json"
            printf '%s' "$GCP_SA_KEY" > "$SA_TMP"
            PROJECT=$(python3 -c "import json; print(json.load(open('$SA_TMP'))['project_id'])")
            if command -v gcloud &>/dev/null; then
              echo "=== gcloud accounts on Oracle VM ==="
              gcloud auth list --format="value(account,status)" 2>&1 || true
              echo "=== attempting enable ==="
              gcloud services enable cloudsupport.googleapis.com --project="$PROJECT" 2>&1 && echo "ENABLED OK" && sleep 10 || echo "gcloud enable failed"
            else
              echo "gcloud not found on Oracle VM"
            fi
            SA_FILE="$SA_TMP" /home/ubuntu/oisha-os/venv/bin/python scripts/post_billing_reply.py
            rm -f "$SA_TMP"

      - name: Notify result via Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            MSG="Google%20Billing%20Reply%3A%20SUCCESS%0AComments%20posted%20to%20cases%2071989960%20(%2479.16)%20%2B%2071874253%20(%2458.61)"
          else
            MSG="Google%20Billing%20Reply%3A%20FAILED%0ACheck%20Actions%20logs"
          fi
          curl -s "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage?chat_id=150074828&text=${MSG}" > /dev/null || true
