name: Complete Telegram Auth — Auto Poll

on:
  push:
    paths:
      - 'deploy/auth-poll-trigger'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  auth:
    name: Auth + Save Session Variable
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Telethon
        run: pip install telethon==1.36.0

      - name: Auth — SMS yuborish va polling
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import asyncio, os, time, json, base64, subprocess
          import urllib.request, urllib.error
          from telethon import TelegramClient
          from telethon.errors import SessionPasswordNeededError
          from telethon.sessions import StringSession

          PHONE = "+998336450097"
          TG_PASSWORD = "Tg0097"
          GH_TOKEN = os.environ["GH_TOKEN"]
          REPO = "baxtiyorjongaziyev/oisha-os"
          CODE_FILE = "data/sms_code_input.txt"
          SESSION_FILE = "data/session_output.txt"

          def gh_request(method, path, data=None):
              url = f"https://api.github.com{path}"
              body = json.dumps(data).encode() if data else None
              req = urllib.request.Request(url, data=body, method=method, headers={
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              })
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      content = r.read()
                      return (json.loads(content) if content else {}), r.status
              except urllib.error.HTTPError as e:
                  return {}, e.code

          def get_repo_file(path):
              data, status = gh_request("GET", f"/repos/{REPO}/contents/{path}")
              if status == 200 and "content" in data:
                  return base64.b64decode(data["content"]).decode().strip(), data.get("sha", "")
              return None, None

          def push_file_to_repo(path, content_str, message):
              existing, sha = get_repo_file(path)
              payload = {
                  "message": message,
                  "content": base64.b64encode(content_str.encode()).decode(),
                  "committer": {"name": "GitHub Actions", "email": "actions@github.com"},
              }
              if sha:
                  payload["sha"] = sha
              _, status = gh_request("PUT", f"/repos/{REPO}/contents/{path}", payload)
              return status

          def set_actions_variable(name, value):
              # Try PATCH (update existing)
              _, status = gh_request("PATCH", f"/repos/{REPO}/actions/variables/{name}",
                                     {"name": name, "value": value})
              if status == 204:
                  return 204
              # Try POST (create new)
              _, status = gh_request("POST", f"/repos/{REPO}/actions/variables",
                                     {"name": name, "value": value})
              return status

          async def main():
              client = TelegramClient(StringSession(), int(os.environ["API_ID"]), os.environ["API_HASH"])
              await client.connect()

              result = await client.send_code_request(PHONE)
              code_hash = result.phone_code_hash
              print(f"SMS yuborildi: {PHONE}  hash={code_hash[:8]}...")
              print(f"data/{CODE_FILE} ni kutmoqda (10 daqiqa)...")

              code = None
              deadline = time.time() + 600
              while time.time() < deadline:
                  content, _ = get_repo_file(CODE_FILE)
                  if content and content.strip().isdigit():
                      code = content.strip()
                      print(f"\nKod topildi: {code}")
                      break
                  print(".", end="", flush=True)
                  await asyncio.sleep(5)

              if not code:
                  print("\nTimeout!")
                  await client.disconnect()
                  return

              try:
                  await client.sign_in(phone=PHONE, code=code, phone_code_hash=code_hash)
              except SessionPasswordNeededError:
                  print("2FA kiritilmoqda...")
                  await client.sign_in(password=TG_PASSWORD)

              if not await client.is_user_authorized():
                  print("Auth muvaffaqiyatsiz!")
                  await client.disconnect()
                  return

              me = await client.get_me()
              session = client.session.save()
              print(f"\nLOGIN OK: {me.first_name} (@{me.username})")

              # 1. Save to Actions Variable (PATCH or POST)
              status = set_actions_variable("USERBOT_SESSION_STRING", session)
              print(f"Actions Variable status: {status}")

              # 2. Save to private repo file (backup — repo is private)
              file_status = push_file_to_repo(
                  SESSION_FILE,
                  session,
                  "auth: save new userbot session string [auto]"
              )
              print(f"File commit status: {file_status}")

              # 3. Clean up code file
              _, sha = get_repo_file(CODE_FILE)
              if sha:
                  gh_request("DELETE", f"/repos/{REPO}/contents/{CODE_FILE}", {
                      "message": "auth: remove sms code file [auto]",
                      "sha": sha,
                      "committer": {"name": "GitHub Actions", "email": "actions@github.com"},
                  })
                  print("SMS kod fayli o'chirildi")

              await client.disconnect()
              print("YAKUNLANDI — session saqlandi!")

          asyncio.run(main())
          PYEOF
