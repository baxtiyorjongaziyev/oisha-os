name: Complete Telegram Auth — Auto Poll

on:
  push:
    paths:
      - 'deploy/auth-poll-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auth:
    name: Auth + Save Session Variable
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Telethon
        run: pip install telethon==1.36.0 pynacl

      - name: Auth — SMS yuborish va polling
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_ADMIN_PAT: ${{ secrets.REPO_ADMIN_PAT }}
          TG_PHONE: ${{ secrets.TG_PHONE }}
          TG_PASSWORD: ${{ secrets.TG_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import asyncio, os, time, json, base64
          import urllib.request, urllib.error
          from nacl import encoding, public
          from telethon import TelegramClient
          from telethon.errors import SessionPasswordNeededError
          from telethon.sessions import StringSession
          from telethon.errors import FloodWaitError

          # `.get(name, default)` bu yerda ISHLAMAYDI: env bloki TG_PHONE ni
          # secret'dan oladi, secret yo'q bo'lsa GitHub o'zgaruvchini BO'SH
          # SATR qilib qo'yadi — kalit mavjud bo'lgani uchun default hech
          # qachon olinmaydi va Telethon ga None ketadi
          # ("TypeError: bytes or str expected, not NoneType").
          # `or` bo'sh satrni ham qamrab oladi.
          PHONE = (os.environ.get("TG_PHONE") or "").strip()
          if not PHONE:
              raise RuntimeError(
                  "TG_PHONE secret o'rnatilmagan. Repo Settings > Secrets and "
                  "variables > Actions da TG_PHONE qo'shing."
              )
          # Parolni TRIM QILMAYMIZ: 2FA parolida boshida/oxirida probel
          # bo'lishi mumkin, strip uni jimgina buzadi va sign_in yiqiladi.
          TG_PASSWORD = os.environ.get("TG_PASSWORD", "")
          GH_TOKEN = os.environ["GH_TOKEN"]
          # Secrets API (unlike Variables) requires admin-level repo permissions
          # that the default GITHUB_TOKEN doesn't have — a separate PAT is
          # needed to write the session into a real (masked, encrypted) secret.
          REPO_ADMIN_PAT = os.environ.get("REPO_ADMIN_PAT", "")
          REPO = "baxtiyorjongaziyev/oisha-os"
          CODE_FILE = "data/sms_code_input.txt"

          def gh_request(method, path, data=None, token=None):
              url = f"https://api.github.com{path}"
              body = json.dumps(data).encode() if data else None
              req = urllib.request.Request(url, data=body, method=method, headers={
                  "Authorization": f"Bearer {token or GH_TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              })
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      content = r.read()
                      return (json.loads(content) if content else {}), r.status
              except urllib.error.HTTPError as e:
                  return {}, e.code

          def get_repo_file(path):
              data, status = gh_request("GET", f"/repos/{REPO}/contents/{path}")
              if status == 200 and "content" in data:
                  return base64.b64decode(data["content"]).decode().strip(), data.get("sha", "")
              return None, None

          def set_actions_secret(name, value):
              if not REPO_ADMIN_PAT:
                  raise RuntimeError(
                      "REPO_ADMIN_PAT not set — cannot write a real Actions "
                      "secret. Refusing to fall back to an Actions Variable "
                      "(unmasked, not encrypted at rest)."
                  )
              key_data, status = gh_request(
                  "GET", f"/repos/{REPO}/actions/secrets/public-key", token=REPO_ADMIN_PAT
              )
              if status != 200:
                  raise RuntimeError(f"Failed to fetch secrets public key: {status}")
              public_key = public.PublicKey(key_data["key"], encoding.Base64Encoder())
              sealed_box = public.SealedBox(public_key)
              encrypted = base64.b64encode(sealed_box.encrypt(value.encode())).decode()
              _, status = gh_request(
                  "PUT", f"/repos/{REPO}/actions/secrets/{name}",
                  {"encrypted_value": encrypted, "key_id": key_data["key_id"]},
                  token=REPO_ADMIN_PAT,
              )
              if status not in (201, 204):
                  raise RuntimeError(f"Failed to write secret {name}: {status}")
              return status

          async def main():
              client = TelegramClient(StringSession(), int(os.environ["API_ID"]), os.environ["API_HASH"])
              await client.connect()

              try:
                  result = await client.send_code_request(PHONE)
              except FloodWaitError as e:
                  print(f"FloodWaitError: {e}")
                  print("Too many requests. Please wait before running this again.")
                  import sys; sys.exit(0)
              code_hash = result.phone_code_hash
              print(f"SMS yuborildi: {PHONE}  hash={code_hash[:8]}...")
              print(f"{CODE_FILE} ni kutmoqda (10 daqiqa)...")

              code = None
              deadline = time.time() + 600
              while time.time() < deadline:
                  content, _ = get_repo_file(CODE_FILE)
                  if content and content.strip().isdigit():
                      code = content.strip()
                      print(f"\nKod topildi: {code}")
                      break
                  print(".", end="", flush=True)
                  await asyncio.sleep(5)

              if not code:
                  print("\nTimeout!")
                  await client.disconnect()
                  return

              try:
                  await client.sign_in(phone=PHONE, code=code, phone_code_hash=code_hash)
              except SessionPasswordNeededError:
                  if not TG_PASSWORD:
                      raise RuntimeError(
                          "Akkauntda 2FA yoqilgan, lekin TG_PASSWORD secret'i "
                          "qo'yilmagan. Repo Settings > Secrets and variables > "
                          "Actions da TG_PASSWORD qo'shing va qayta ishga tushiring. "
                          "(Bo'sh parol bilan Telethon tushunarsiz ValueError beradi.)"
                      )
                  print("2FA kiritilmoqda...")
                  await client.sign_in(password=TG_PASSWORD)

              if not await client.is_user_authorized():
                  print("Auth muvaffaqiyatsiz!")
                  await client.disconnect()
                  return

              me = await client.get_me()
              session = client.session.save()
              print(f"\nLOGIN OK: {me.first_name} (@{me.username})")

              # Save to a real Actions Secret (encrypted, masked in logs).
              # Never commit the session string to the repo (git history) —
              # a leaked session string is a standing account-takeover risk
              # that git history rewrite cannot undo once pushed. Fail loudly
              # rather than fall back to an Actions Variable so the SMS code
              # file only gets cleaned up once the secret write is confirmed.
              status = set_actions_secret("USERBOT_SESSION_STRING", session)
              print(f"Actions Secret status: {status}")

              # Clean up code file
              _, sha = get_repo_file(CODE_FILE)
              if sha:
                  gh_request("DELETE", f"/repos/{REPO}/contents/{CODE_FILE}", {
                      "message": "auth: remove sms code file [auto]",
                      "sha": sha,
                      "committer": {"name": "GitHub Actions", "email": "actions@github.com"},
                  })
                  print("SMS kod fayli o'chirildi")

              await client.disconnect()
              print("YAKUNLANDI — session saqlandi!")

          asyncio.run(main())
          PYEOF
