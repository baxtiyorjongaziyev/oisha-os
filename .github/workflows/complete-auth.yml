name: Complete Telegram Auth — Auto Poll

on:
  push:
    paths:
      - 'deploy/auth-poll-trigger'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  auth:
    name: Auth + Save Session Variable
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install Telethon
        run: pip install telethon==1.36.0

      - name: Auth — SMS yuborish va polling
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import asyncio, os, time, json, base64
          import urllib.request, urllib.error
          from telethon import TelegramClient
          from telethon.errors import SessionPasswordNeededError
          from telethon.sessions import StringSession

          PHONE = "+998336450097"
          TG_PASSWORD = "Tg0097"
          GH_TOKEN = os.environ["GH_TOKEN"]
          REPO = "baxtiyorjongaziyev/oisha-os"
          CODE_FILE = "data/sms_code_input.txt"

          def gh_get(path):
              url = f"https://api.github.com{path}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "Accept": "application/vnd.github+json",
              })
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return json.loads(r.read()), r.status
              except urllib.error.HTTPError as e:
                  return {}, e.code

          def gh_put(path, data):
              url = f"https://api.github.com{path}"
              body = json.dumps(data).encode()
              req = urllib.request.Request(url, data=body, method="PUT", headers={
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              })
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.status
              except urllib.error.HTTPError as e:
                  return e.code

          def get_repo_file(path):
              data, status = gh_get(f"/repos/{REPO}/contents/{path}")
              if status == 200 and "content" in data:
                  return base64.b64decode(data["content"]).decode().strip(), data.get("sha", "")
              return None, None

          def set_actions_variable(name, value):
              status = gh_put(f"/repos/{REPO}/actions/variables/{name}", {"name": name, "value": value})
              if status not in (201, 204):
                  # Try PATCH if PUT not supported
                  url = f"https://api.github.com/repos/{REPO}/actions/variables/{name}"
                  req = urllib.request.Request(url, data=json.dumps({"name": name, "value": value}).encode(),
                      method="PATCH", headers={
                          "Authorization": f"Bearer {GH_TOKEN}",
                          "Accept": "application/vnd.github+json",
                          "Content-Type": "application/json",
                      })
                  try:
                      with urllib.request.urlopen(req, timeout=10) as r:
                          status = r.status
                  except urllib.error.HTTPError as e:
                      status = e.code
              return status

          async def main():
              client = TelegramClient(StringSession(), int(os.environ["API_ID"]), os.environ["API_HASH"])
              await client.connect()

              # Step 1: send SMS
              result = await client.send_code_request(PHONE)
              code_hash = result.phone_code_hash
              print(f"✅ SMS yuborildi: {PHONE}")
              print(f"PHONE_CODE_HASH: {code_hash}")
              print("data/sms_code_input.txt ni kutmoqda... (10 daqiqa)")

              # Step 2: poll for SMS code file
              code = None
              deadline = time.time() + 600
              while time.time() < deadline:
                  content, _ = get_repo_file(CODE_FILE)
                  if content and content.strip().isdigit():
                      code = content.strip()
                      print(f"\n✅ Kod topildi: {code}")
                      break
                  print(".", end="", flush=True)
                  await asyncio.sleep(5)

              if not code:
                  print("\n❌ Timeout — 10 daqiqa ichida kod kelmadi")
                  await client.disconnect()
                  return

              # Step 3: sign in
              try:
                  await client.sign_in(phone=PHONE, code=code, phone_code_hash=code_hash)
              except SessionPasswordNeededError:
                  print("2FA kerak — parol kiritilmoqda...")
                  await client.sign_in(password=TG_PASSWORD)

              if not await client.is_user_authorized():
                  print("❌ Authorization muvaffaqiyatsiz!")
                  await client.disconnect()
                  return

              me = await client.get_me()
              session = client.session.save()
              print(f"\n✅ LOGIN: {me.first_name} (@{me.username})")
              print(f"Session uzunligi: {len(session)}")

              # Step 4: save to Actions Variable
              status = set_actions_variable("USERBOT_SESSION_STRING", session)
              print(f"Variable update status: {status}")
              print("✅ USERBOT_SESSION_STRING GitHub Variable ga saqlandi!")

              await client.disconnect()
              print("\n🎉 Auth muvaffaqiyatli yakunlandi! Qurbon workflow tayyor.")

          asyncio.run(main())
          PYEOF
