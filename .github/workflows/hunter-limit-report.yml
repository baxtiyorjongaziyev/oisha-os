name: Hunter limit report (read-only)

# Faqat qo'lda ishga tushadi. Contabo'dagi self-hosted runner'da prod .env bilan
# scripts/hunter_limit_report.py ni ishga tushiradi. amoCRM'ga faqat GET so'rov
# yuboradi, hech narsa yozmaydi, servisni qayta ishga tushirmaydi.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Necha kunlik ma'lumot"
        default: "30"
        required: true

permissions:
  contents: read

jobs:
  report:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 10
    steps:
      - name: Run report in prod checkout
        env:
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          case "$DAYS" in ''|*[!0-9]*) echo "days must be a number"; exit 1;; esac
          cd /home/ubuntu/oisha-os
          set -a
          . ./.env
          set +a
          ./venv/bin/python scripts/hunter_limit_report.py --days "$DAYS"
