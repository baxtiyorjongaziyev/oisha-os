name: AmoCRM Task Cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (preview) or live (actually close tasks)"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - live
  schedule:
    - cron: "0 6 * * 1"  # Every Monday 06:00 UTC (11:00 Tashkent) — dry-run only

concurrency:
  group: amocrm-task-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Clean Oisha tasks from closed AmoCRM deals
    runs-on: [self-hosted, oracle]
    timeout-minutes: 15
    steps:
      - name: Run task cleanup on Hetzner VPS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode || 'dry-run' }}
        run: |
          set -euo pipefail
          OISHA_DIR="/home/deploy/oisha-os"
          [ -d "$OISHA_DIR" ] || OISHA_DIR="/home/ubuntu/oisha-os"
          cd "$OISHA_DIR"

          if [ -d .git ]; then
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" 2>/dev/null || true
            git fetch origin main
            git stash --include-untracked 2>/dev/null || true
            git checkout origin/main -- scripts/amocrm_task_cleanup.py
            git remote set-url origin "https://github.com/baxtiyorjongaziyev/oisha-os.git" 2>/dev/null || true
          fi

          if [ "${MODE}" = "live" ]; then
            ./venv/bin/python - <<'PY'
          import sys
          from scripts.amocrm_task_cleanup import AmoCRMTaskCleaner, CONFIRM_TEXT
          result = AmoCRMTaskCleaner(live=True, confirm=CONFIRM_TEXT).run(
              closed_oisha_only=True
          )
          print(result)
          sys.exit(0 if result["success"] else 1)
          PY
          else
            ./venv/bin/python scripts/amocrm_task_cleanup.py --closed-oisha-only
          fi
