name: Security - Secret Scan (gitleaks)

on:
  # Push trigger removed — gitleaks scans full history, so running on
  # every push wastes minutes. Weekly schedule + PR checks are sufficient.
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    if: false
    # Full-history scans are deliberately isolated from the 1 GB production VM.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          case "$(uname -m)" in
            aarch64|arm64) ARCH=arm64 ;;
            *) ARCH=x64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_${ARCH}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version

      # Scan the full git history (history has been scrubbed with git-filter-repo,
      # so commits no longer carry legacy leaks). fetch-depth: 0 above gives the
      # complete history for gitleaks to walk.
      - name: Scan git history for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
