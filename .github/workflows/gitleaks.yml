name: Security - Secret Scan (gitleaks)

on:
  # Push trigger removed — gitleaks scans full history, so running on
  # every push wastes minutes. Weekly schedule + PR checks are sufficient.
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    if: false
    # GitHub-hosted runner: the Oracle self-hosted runner is a 1GB free-tier
    # VM that also runs the production oisha-os stack (userbot, minio, n8n,
    # docker). A full-history gitleaks scan competing with that for memory
    # thrashes into swap and can run 40+ minutes without finishing. Moved
    # here once the account-level billing issue blocking ubuntu-latest was
    # resolved (see test.yml history).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          case "$(uname -m)" in
            aarch64|arm64) ARCH=arm64 ;;
            *) ARCH=x64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_${ARCH}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version

      # Scan only the history reachable from this checkout's HEAD. gitleaks'
      # default git log invocation uses `--all`, which walks every ref
      # actions/checkout fetched — and checkout fetches every branch on the
      # remote (+refs/heads/*:refs/remotes/origin/*), not just this PR's.
      # main and this branch have been scrubbed with git-filter-repo, but
      # dozens of other stale branches on this repo still carry the old
      # leaked session commits; `--all` would flag those on every PR
      # regardless of what changed. `--log-opts=HEAD` scopes the scan to
      # what's actually being reviewed.
      - name: Scan git history for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1 --log-opts=HEAD
