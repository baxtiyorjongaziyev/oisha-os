name: Security - Secret Scan (gitleaks)

on:
  # Push trigger removed — gitleaks scans full history, so running on
  # every push wastes minutes. Weekly schedule + PR checks are sufficient.
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    # GitHub-hosted runner: the Oracle self-hosted runner is a 1GB free-tier
    # VM that also runs the production oisha-os stack (userbot, minio, n8n,
    # docker). A full-history gitleaks scan competing with that for memory
    # thrashes into swap and can run 40+ minutes without finishing. Moved
    # here once the account-level billing issue blocking ubuntu-latest was
    # resolved (see test.yml history).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          case "$(uname -m)" in
            aarch64|arm64) ARCH=arm64 ;;
            *) ARCH=x64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_${ARCH}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version

      # On pull_request: scan only the commits introduced by this PR (origin/${{ github.base_ref }}...HEAD).
      # On schedule / workflow_dispatch: scan history reachable from HEAD.
      # Historical repository findings are tracked in .gitleaksignore.
      - name: Scan git history for secrets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${{ github.base_ref }}" ]; then
            echo "[GITLEAKS] Scanning PR commits: origin/${{ github.base_ref }}...HEAD"
            gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1 --log-opts="origin/${{ github.base_ref }}...HEAD"
          else
            echo "[GITLEAKS] Scanning history reachable from HEAD"
            gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1 --log-opts=HEAD
          fi
