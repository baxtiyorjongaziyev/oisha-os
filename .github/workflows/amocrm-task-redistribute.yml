name: AmoCRM Task Redistribution

on:
  workflow_dispatch:

jobs:
  redistribute:
    name: Redistribute overdue + today tasks (25/day)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run redistribution on Oracle VM
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 8m
          envs: GITHUB_TOKEN
          script: |
            set -euo pipefail
            cd /home/ubuntu/oisha-os

            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" 2>/dev/null || true
            git fetch origin main
            git stash --include-untracked 2>/dev/null || true
            git checkout origin/main -- scripts/redistribute_tasks_today.py scripts/refresh_crm_token.py

            # .env yuklab, AMOCRM settings borligini tekshirish
            set +eu
            set -o allexport
            source .env 2>/dev/null
            set +o allexport
            set -eu

            # Token diagnostika
            echo "=== Token diagnostika ==="
            if [ -f data/amocrm_token.json ]; then
              python3 -c "
import json
t = json.load(open('data/amocrm_token.json'))
print('Kalitlar:', list(t.keys()))
at = t.get('access_token','')
rt = t.get('refresh_token','')
print(f'access_token: ...{at[-10:]}' if at else 'access_token: YO_Q')
print(f'refresh_token: ...{rt[-10:]}' if rt else 'refresh_token: YO_Q')
"
            else
              echo "XATO: data/amocrm_token.json TOPILMADI"
              exit 1
            fi

            # Token yangilash
            echo "=== Token refresh ==="
            ./venv/bin/python scripts/refresh_crm_token.py || echo "Refresh FAILED — davom etamiz mavjud token bilan"

            # Redistribution
            echo "=== Redistribution ==="
            ./venv/bin/python scripts/redistribute_tasks_today.py
