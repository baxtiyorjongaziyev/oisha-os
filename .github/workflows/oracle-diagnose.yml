name: Oracle VM Diagnose

# Deadline-alert spam tekshiruvi uchun qo'lda ishga tushiriladigan workflow.
# oracle-deploy.yml bilan bir xil self-hosted runner'da ishlaydi, ya'ni
# buyruqlar to'g'ridan-to'g'ri Oracle VM da bajariladi.
#
# Standart rejim (diagnose) FAQAT o'qiydi — hech qanday process to'xtatilmaydi.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnose = faqat o'qish; sync-models = Hermes va OpenClaw modellarini yangilash; stop-service = oisha-os servisini to'xtatish"
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - sync-models
          - stop-service

concurrency:
  group: oracle-diagnose
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    name: Oracle VM diagnose
    runs-on: [self-hosted, oracle]
    timeout-minutes: 5
    steps:
      - name: Collect runtime state
        run: |
          set +e
          echo "=== 1. Vaqt va zona ==="
          date; timedatectl 2>/dev/null | head -5

          echo
          echo "=== 2. Ishlab turgan Oisha process'lari (START = qachon ko'tarilgan) ==="
          ps -eo pid,ppid,lstart,etimes,cmd | grep -E "python3?.*(src/main|oisha)" | grep -v grep

          echo
          echo "=== 3. Oisha bilan bog'liq systemd unitlari ==="
          systemctl list-units --type=service --all --no-pager | grep -i oisha

          echo
          echo "=== 4. oisha-os.service holati ==="
          systemctl status oisha-os --no-pager 2>&1 | head -25

          echo
          echo "=== 5. Deploy katalogidagi kod versiyasi ==="
          cd /home/ubuntu/oisha-os 2>/dev/null && git log -1 --format='%h %ci %s' && git status --short | head

          echo
          echo "=== 6. Diskda proactive_worker.py ning BARCHA nusxalari ==="
          find /home /opt /srv /root -maxdepth 6 -name proactive_worker.py 2>/dev/null

          echo
          echo "=== 7. Har bir nusxada soat filtri bormi? (yo'q = spam manbai) ==="
          for f in $(find /home /opt /srv /root -maxdepth 6 -name proactive_worker.py 2>/dev/null); do
            if grep -q "target_hours" "$f"; then
              echo "BOR      : $f"
            else
              echo "YO'Q  <<<: $f   ← ESKI KOD"
            fi
            grep -c "claim_job_run" "$f" | xargs echo "         claim_job_run soni:"
          done

          echo
          echo "=== 8. Cron va timer'lar ==="
          crontab -l 2>/dev/null | grep -vE '^\s*#' | grep -v '^$'
          sudo -n crontab -l 2>/dev/null | grep -vE '^\s*#' | grep -v '^$'
          systemctl list-timers --all --no-pager 2>/dev/null | head -15

          echo
          echo "=== 9. Oxirgi deadline alert loglari ==="
          journalctl -u oisha-os --since "6 hours ago" --no-pager 2>/dev/null | grep -i "deadline" | tail -20

          exit 0

      - name: Deep check — spam manbai va watchdog
        run: |
          set +e
          echo "=== A. Bugun 'Project deadline check started' necha marta ==="
          journalctl --since today --no-pager 2>/dev/null | grep -c "Project deadline check started"
          echo "--- vaqtlari ---"
          journalctl --since today --no-pager 2>/dev/null | grep "Project deadline check started"

          echo
          echo "=== B. Bugun necha ta deadline xabari yuborilgan (loyiha soni logi) ==="
          journalctl --since today --no-pager 2>/dev/null | grep "loyiha deadline'i yaqin"

          echo
          echo "=== C. Watchdog nima qiladi ==="
          systemctl cat watchdog.service --no-pager 2>/dev/null | head -30
          echo "--- watchdog skripti ichida main.py ishga tushirish bormi ---"
          for f in /home/ubuntu/oisha-os/ops/*.sh /home/ubuntu/oisha-os/scripts/*watchdog* /opt/oisha-os/ops/*.sh; do
            [ -f "$f" ] || continue
            if grep -lE "main\.py|systemctl (start|restart)" "$f" >/dev/null 2>&1; then
              echo "### $f"
              grep -nE "main\.py|systemctl (start|restart)|cd /" "$f" | head -15
            fi
          done

          echo
          echo "=== D. /opt/oisha-os uchun systemd unit bormi ==="
          grep -rl "/opt/oisha-os" /etc/systemd/system/ 2>/dev/null
          echo "--- /opt katalogidagi kod versiyasi ---"
          cd /opt/oisha-os 2>/dev/null && git log -1 --format='%h %ci %s' 2>/dev/null || echo "git repo emas"

          echo
          echo "=== E. Barcha python process'lari (to'liq) ==="
          ps -eo pid,lstart,cmd | grep -E "python" | grep -v grep | head -20

          echo
          echo "=== F. Job claim jadvali ishlayaptimi (yangi fix) ==="
          ls -la /home/ubuntu/oisha-os/data/job_claims/ 2>/dev/null || echo "job_claims katalogi hali yaratilmagan"

          echo
          echo "=== G. Watchdog maqsadi: oisha.service vs oisha-os.service ==="
          for u in oisha.service oisha-os.service watchdog.service oisha-watchdog.service; do
            printf '%-26s load=%-10s active=%-10s fragment=%s\n' "$u" \
              "$(systemctl show -p LoadState --value "$u")" \
              "$(systemctl show -p ActiveState --value "$u")" \
              "$(systemctl show -p FragmentPath --value "$u")"
          done
          systemctl show -p Environment,ExecStart,WorkingDirectory --value watchdog.service 2>/dev/null
          journalctl -u watchdog --since "24 hours ago" --no-pager 2>/dev/null | grep -iE "restart|fail" | tail -10
          exit 0

      - name: Stop oisha-os service
        if: inputs.mode == 'stop-service'
        run: |
          set +e
          echo "oisha-os servisi to'xtatilmoqda..."
          sudo systemctl stop oisha-os
          sleep 5
          systemctl is-active oisha-os
          echo "--- to'xtatishdan keyin qolgan process'lar ---"
          ps -eo pid,lstart,cmd | grep -E "python3?.*(src/main|oisha)" | grep -v grep
          exit 0

      - name: Sync Hermes and OpenClaw models
        if: inputs.mode == 'sync-models'
        run: |
          set +e
          echo "=== 1. Hermes Agent — Oisha personasi va modellari ==="
          if id -u hermes >/dev/null 2>&1; then
            echo "Hermes foydalanuvchisi topildi."
            if [ -f /home/ubuntu/oisha-os/deploy/hermes/SOUL.md ]; then
              echo "Hermes uchun Oisha SOUL.md ko'chirilmoqda..."
              sudo cp /home/ubuntu/oisha-os/deploy/hermes/SOUL.md /home/hermes/.hermes/SOUL.md || true
              sudo chown hermes:hermes /home/hermes/.hermes/SOUL.md 2>/dev/null || true
            fi
            sudo -iu hermes bash -c '
              if command -v hermes >/dev/null 2>&1; then
                echo "Hozirgi model:"
                hermes config get model.default 2>/dev/null || true
                echo "Yangi model o‘rnatilmoqda: gemini / gemini-2.5-flash..."
                hermes config set model.provider gemini || true
                hermes config set model.default gemini-2.5-flash || true
                echo "Tasdiq:"
                hermes config get model.provider 2>/dev/null || true
                hermes config get model.default 2>/dev/null || true
              else
                echo "hermes CLI buyrug‘i topilmadi."
              fi
            '
            if systemctl is-active --quiet hermes-gateway; then
              echo "hermes-gateway qayta ishga tushirilmoqda..."
              sudo systemctl restart hermes-gateway || true
              echo "hermes-gateway holati: $(systemctl is-active hermes-gateway)"
            fi
          else
            echo "hermes foydalanuvchisi topilmadi."
          fi

          echo
          echo "=== 2. OpenClaw — Mr.Jon personasi va modellari ==="
          for u in openclaw ubuntu root; do
            if id -u "$u" >/dev/null 2>&1; then
              U_HOME=$(eval echo "~$u")
              OC_WS="$U_HOME/.openclaw/workspace/oisha"
              if [ -d "$OC_WS" ] && [ -f /home/ubuntu/oisha-os/deploy/openclaw/workspace/SOUL.md ]; then
                echo "[$u] OpenClaw workspace'ga Mr.Jon SOUL.md va IDENTITY.md ko'chirilmoqda..."
                sudo cp /home/ubuntu/oisha-os/deploy/openclaw/workspace/SOUL.md "$OC_WS/SOUL.md" || true
                sudo cp /home/ubuntu/oisha-os/deploy/openclaw/workspace/IDENTITY.md "$OC_WS/IDENTITY.md" 2>/dev/null || true
                sudo chown -R "$u:$u" "$OC_WS" 2>/dev/null || true
              fi
              sudo -iu "$u" bash -c '
                if command -v openclaw >/dev/null 2>&1; then
                  echo "[$USER] openclaw topildi."
                  echo "Asosiy model: google/gemini-2.5-flash o‘rnatilmoqda..."
                  openclaw config set agents.defaults.model.primary "google/gemini-2.5-flash" || openclaw config set agents.defaults.model "google/gemini-2.5-flash" || true
                  echo "Zaxira modellar: groq/llama-3.3-70b-versatile va google/gemini-2.5-flash-lite..."
                  openclaw config set agents.defaults.model.fallbacks '\''["groq/llama-3.3-70b-versatile", "google/gemini-2.5-flash-lite"]'\'' || true
                  echo "Tasdiq:"
                  openclaw config get agents.defaults.model 2>/dev/null || true
                fi
              '
            fi
          done

          echo
          echo "=== 3. Jarayonlar tekshiruvi ==="
          ps -eo pid,cmd | grep -E "hermes|openclaw" | grep -v grep || true
          exit 0
