name: Oisha Web Ops

# oisha.jonbranding.uz web dashboard: diagnostika va deploy.
# 1GB serverda build qilinmaydi — build Actions runner'da bo'lib,
# tayyor standalone bundle serverga ko'chiriladi.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnose | deploy"
        required: true
        default: "diagnose"
  # Dispatch API'ga ruxsat bo'lmagan muhitlar uchun: ops/web-diagnose yoki
  # ops/web-deploy branch'iga push qilish ham ishga tushiradi
  push:
    branches:
      - "ops/web-diagnose"
      - "ops/web-deploy"

concurrency:
  group: oisha-web-ops
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose') ||
      github.ref_name == 'ops/web-diagnose'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Server diagnostics (read-only)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 8m
          script: |
            set -u
            echo "=== SYSTEM ==="; uname -n; free -h | head -2; df -h / | tail -1
            echo "=== SERVICES ==="
            systemctl list-units --type=service --no-pager | grep -Ei 'oisha|caddy|nginx|node' || true
            echo "=== PORTS ==="
            sudo ss -tlnp | grep -E ':(80|443|3000|8080|8088)\s' || true
            echo "=== CADDY CONFIG ==="
            sudo cat /etc/caddy/Caddyfile 2>/dev/null || echo "Caddyfile yo'q"
            echo "=== NODE ==="
            node -v 2>/dev/null || echo "node yo'q"; command -v pnpm >/dev/null && pnpm -v || echo "pnpm yo'q"
            echo "=== REPO ==="
            cd /home/ubuntu/oisha-os 2>/dev/null && git log --oneline -2 && git branch --show-current || echo "repo yo'q"
            echo "=== ENV KEYS (faqat nomlar) ==="
            cut -d= -f1 /home/ubuntu/oisha-os/.env 2>/dev/null | sort | tr '\n' ' '; echo
            echo "=== HEALTH ==="
            curl -s -m 5 http://127.0.0.1:8080/healthz/ | head -c 300; echo
            curl -s -m 8 http://127.0.0.1:8080/readyz/ | head -c 600; echo
            curl -s -m 5 -o /dev/null -w 'localhost:3000 -> %{http_code}\n' http://127.0.0.1:3000/ || echo "localhost:3000 -> ulanib bo'lmadi"
            echo "=== OISHA-OS LOGS (DB/xato) ==="
            sudo journalctl -u oisha-os -n 400 --no-pager 2>/dev/null | grep -iE 'turso|libsql|auth|token|error|traceback' | tail -25 || true
            echo "=== BOOT OQIMI (oxirgi restart'dan beri qayerda) ==="
            sudo journalctl -u oisha-os --no-pager 2>/dev/null | grep -E 'Started Oisha|BOOT|boot|wiring|SESSION|MONITOR|Boshlandi' | tail -20 || true
            echo "=== TURSO TO'G'RIDAN-TO'G'RI TEST ==="
            cd /home/ubuntu/oisha-os && ./venv/bin/python - <<'PYEOF' || true
            import os, sys, time
            from dotenv import load_dotenv
            load_dotenv()
            url = os.getenv("TURSO_DATABASE_URL", "")
            tok = os.getenv("TURSO_AUTH_TOKEN", "")
            print("URL bor:", bool(url), "| Token bor:", bool(tok))
            try:
                import libsql
            except ImportError:
                import libsql_experimental as libsql
            try:
                t0 = time.time()
                conn = libsql.connect("local-replica.db", sync_url=url, auth_token=tok) if url else None
                if conn is None:
                    print("TURSO URL yo'q — SQLite rejimi")
                else:
                    conn.sync()
                    cur = conn.execute("SELECT 1")
                    print("TURSO OK:", cur.fetchone(), f"({time.time()-t0:.1f}s)")
            except Exception as exc:
                print("TURSO XATO:", type(exc).__name__, str(exc)[:300])
            PYEOF
            rm -f /home/ubuntu/oisha-os/local-replica.db* 2>/dev/null || true

  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy') ||
      github.ref_name == 'ops/web-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web app (standalone)
        working-directory: salescoach-ai
        env:
          NEXT_PUBLIC_API_URL: https://oisha.jonbranding.uz/api/v1
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate || npm i -g pnpm
          pnpm install --no-frozen-lockfile --filter @salescoach/web...
          pnpm --filter @salescoach/web run build
          cd apps/web
          # standalone bundle: server.js + kerakli node_modules
          cp -r .next/static .next/standalone/apps/web/.next/static
          [ -d public ] && cp -r public .next/standalone/apps/web/public || true
          tar -czf /tmp/oisha-web-bundle.tar.gz -C .next/standalone .
          ls -lh /tmp/oisha-web-bundle.tar.gz

      - name: Copy bundle to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          source: /tmp/oisha-web-bundle.tar.gz
          target: /home/ubuntu/
          strip_components: 1

      - name: Install and start on server
        uses: appleboy/ssh-action@v1
        env:
          ADMIN_PASS: ${{ secrets.OISHA_API_SECRET }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 15m
          envs: ADMIN_PASS
          script: |
            set -euo pipefail

            # Buzilgan venv'ni ta'mirlash: BotAccessSettings import xatosi —
            # python-telegram-bot chala yangilangan
            cd /home/ubuntu/oisha-os
            ./venv/bin/pip install -q --force-reinstall "python-telegram-bot>=22.8" || true
            # Node runtime (standalone uchun faqat node kerak, pnpm shart emas)
            if ! command -v node >/dev/null 2>&1 || [ "$(node -v | cut -c2-3 | tr -d '.')" -lt 20 ]; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y -qq nodejs
            fi

            # Bundle'ni joylash
            sudo systemctl stop oisha-web 2>/dev/null || true
            rm -rf /home/ubuntu/oisha-web
            mkdir -p /home/ubuntu/oisha-web
            tar -xzf /home/ubuntu/oisha-web-bundle.tar.gz -C /home/ubuntu/oisha-web
            rm -f /home/ubuntu/oisha-web-bundle.tar.gz

            # systemd unit
            sudo tee /etc/systemd/system/oisha-web.service > /dev/null <<'UNIT'
            [Unit]
            Description=Oisha Admin Web (Next.js standalone)
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=simple
            User=ubuntu
            WorkingDirectory=/home/ubuntu/oisha-web/apps/web
            Environment=NODE_ENV=production
            Environment=PORT=3000
            Environment=HOSTNAME=127.0.0.1
            Environment=NODE_OPTIONS=--max-old-space-size=256
            ExecStart=/usr/bin/node server.js
            Restart=always
            RestartSec=10
            StandardOutput=journal
            StandardError=journal
            SyslogIdentifier=oisha-web

            [Install]
            WantedBy=multi-user.target
            UNIT

            sudo systemctl daemon-reload
            sudo systemctl enable oisha-web
            sudo systemctl restart oisha-web
            sleep 6
            sudo systemctl status oisha-web --no-pager | head -8
            curl -s -m 8 -o /dev/null -w 'localhost:3000 -> %{http_code}\n' http://127.0.0.1:3000/

            # Caddy routing: / -> web (:3000), /api va servis yo'llari -> API (:8080)
            # Basic auth: butun sayt (healthz'dan tashqari), user=oisha, parol=OISHA_API_SECRET
            OTHER_SITES=$(grep -E '^[A-Za-z0-9.*-]+(\s|,).*\{|^[A-Za-z0-9.*-]+\{' /etc/caddy/Caddyfile | grep -v 'oisha\.jonbranding\.uz' || true)
            if grep -q "oisha.jonbranding.uz" /etc/caddy/Caddyfile && [ -z "$OTHER_SITES" ]; then
              HASH=$(caddy hash-password --plaintext "$ADMIN_PASS")
              sudo tee /etc/caddy/Caddyfile > /dev/null <<CADDY
            oisha.jonbranding.uz {
                @public path /healthz /healthz/ /readyz /readyz/
                handle @public {
                    reverse_proxy localhost:8080
                }
                @api path /api/* /webhook/* /docs /openapi.json /static/* /dashboard/*
                handle @api {
                    basic_auth {
                        oisha $HASH
                    }
                    reverse_proxy localhost:8080
                }
                # SalesCoach API (NestJS) deploy qilinmagan — ishlaydigan
                # sahifa /admin, root'ni o'sha yerga yo'naltiramiz
                redir / /admin 302
                handle {
                    basic_auth {
                        oisha $HASH
                    }
                    reverse_proxy localhost:3000
                }
            }
            CADDY
              sudo caddy validate --config /etc/caddy/Caddyfile && sudo systemctl reload caddy
            else
              echo "Caddyfile kutilmagan holatda — routing o'zgartirilmadi"
            fi

            # Buzilgan venv tuzatilgani uchun botni qayta ishga tushiramiz
            sudo systemctl restart oisha-os
            # Bot ko'tarilishini kutamiz (1GB serverda 8s yetmaydi — run'ni
            # noto'g'ri "failure" qilmaslik uchun 60s gacha retry)
            for i in $(seq 1 12); do
              curl -s -m 5 -o /dev/null http://127.0.0.1:8080/healthz/ && break
              sleep 5
            done
            curl -s -m 8 http://127.0.0.1:8080/healthz/ | head -c 200 || true; echo
            curl -s -m 8 -o /dev/null -w 'https://oisha.jonbranding.uz -> %{http_code}\n' https://oisha.jonbranding.uz/ || true
