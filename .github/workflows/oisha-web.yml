name: Oisha Web Ops

# oisha.jonbranding.uz web dashboard: diagnostika va deploy.
# 1GB serverda build qilinmaydi — build Actions runner'da bo'lib,
# tayyor standalone bundle serverga ko'chiriladi.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnose | deploy"
        required: true
        default: "deploy"
  push:
    branches:
      - main
      - "ops/web-deploy"
    paths:
      - "apps/web/**"
      - "deploy/**"
      - ".github/workflows/oisha-web.yml"

concurrency:
  group: oisha-web-ops
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Server diagnostics (read-only)
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$ORACLE_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=15 ubuntu@$ORACLE_HOST 'bash -s' <<'EOF'
            set -u
            echo "=== SYSTEM ==="; uname -n; free -h | head -2; df -h / | tail -1
            echo "=== SERVICES ==="
            systemctl list-units --type=service --no-pager | grep -Ei 'oisha|caddy|nginx|node' || true
            echo "=== PORTS ==="
            sudo ss -tlnp | grep -E ':(80|443|3000|8080|8088)\s' || true
            echo "=== CADDY CONFIG ==="
            sudo cat /etc/caddy/Caddyfile 2>/dev/null || echo "Caddyfile yo'q"
            echo "=== NODE ==="
            node -v 2>/dev/null || echo "node yo'q"; command -v pnpm >/dev/null && pnpm -v || echo "pnpm yo'q"
            echo "=== HEALTH ==="
            curl -s -m 5 http://127.0.0.1:8080/healthz/ | head -c 300; echo
            curl -s -m 8 http://127.0.0.1:8080/readyz/ | head -c 600; echo
            curl -s -m 5 -o /dev/null -w 'localhost:3000 -> %{http_code}\n' http://127.0.0.1:3000/ || echo "localhost:3000 -> ulanib bo'lmadi"
          EOF

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build web app (standalone)
        env:
          NEXT_PUBLIC_API_URL: https://oisha.jonbranding.uz
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate || npm i -g pnpm
          pnpm install --no-frozen-lockfile --filter @salescoach/web...
          pnpm --filter @salescoach/web run build
          mkdir -p apps/web/.next/standalone/apps/web/.next/static
          cp -r apps/web/.next/static/* apps/web/.next/standalone/apps/web/.next/static/
          [ -d apps/web/public ] && cp -r apps/web/public apps/web/.next/standalone/apps/web/public || true
          tar -czf /tmp/oisha-web-bundle.tar.gz -C apps/web/.next/standalone .
          ls -lh /tmp/oisha-web-bundle.tar.gz

      - name: Deploy bundle to Oracle VM via Native SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$ORACLE_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

          # Copy bundle and deployment scripts
          scp /tmp/oisha-web-bundle.tar.gz deploy/oisha-web.service deploy/Caddyfile deploy/install_web.sh ubuntu@$ORACLE_HOST:/home/ubuntu/

          # Remote execution
          ssh ubuntu@$ORACLE_HOST "chmod +x /home/ubuntu/install_web.sh && bash /home/ubuntu/install_web.sh"
