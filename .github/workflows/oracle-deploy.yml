name: Oracle Production Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/oracle-deploy.yml"
      - "deploy/oracle-trigger"
      - "deploy/oracle-setup.sh"
  workflow_dispatch:

concurrency:
  group: oracle-production-deploy
  cancel-in-progress: true

env:
  OWNER_ID: "150074828"

jobs:
  deploy:
    name: Oracle VM healthy deploy
    if: "!startsWith(github.event.head_commit.message, 'chore(auto):')"
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    timeout-minutes: 10
    steps:
      - name: Deploy to Oracle VM and verify health
        id: oracle
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMOCRM_CLIENT_ID: ${{ secrets.AMOCRM_CLIENT_ID }}
          AMOCRM_CLIENT_SECRET: ${{ secrets.AMOCRM_CLIENT_SECRET }}
          AMOCRM_REDIRECT_URL: ${{ secrets.AMOCRM_REDIRECT_URL }}
          AMOCRM_TOKEN_JSON: ${{ secrets.AMOCRM_TOKEN_JSON }}
          AMOCRM_REFRESH_TOKEN: ${{ secrets.AMOCRM_REFRESH_TOKEN }}
          OISHA_API_SECRET: ${{ secrets.OISHA_API_SECRET }}
          OPENCLAW_SECRET: ${{ secrets.OPENCLAW_SECRET }}
          USERBOT_SESSION_STRING: ${{ secrets.USERBOT_SESSION_STRING }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GCP_SA_KEY }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 7m
          envs: GITHUB_TOKEN,BOT_TOKEN,API_ID,API_HASH,GEMINI_API_KEY,AMOCRM_CLIENT_ID,AMOCRM_CLIENT_SECRET,AMOCRM_REDIRECT_URL,AMOCRM_TOKEN_JSON,AMOCRM_REFRESH_TOKEN,OISHA_API_SECRET,OPENCLAW_SECRET,USERBOT_SESSION_STRING,TURSO_DATABASE_URL,TURSO_AUTH_TOKEN,AIRTABLE_API_KEY,GOOGLE_SERVICE_ACCOUNT_JSON
          script: |
            set -euo pipefail
            OISHA_DIR="/home/ubuntu/oisha-os"
            cd "$OISHA_DIR"

            mkdir -p data
            cp -a data/*.session /tmp/ 2>/dev/null || true
            cp -a data/amocrm_token.json /tmp/amocrm_token.json 2>/dev/null || true
            cp -a service_account.json /tmp/service_account.json 2>/dev/null || true
            cp -a token.pickle /tmp/token.pickle 2>/dev/null || true

            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main

            mkdir -p data
            cp -a /tmp/*.session data/ 2>/dev/null || true
            cp -a /tmp/amocrm_token.json data/amocrm_token.json 2>/dev/null || true
            cp -a /tmp/service_account.json service_account.json 2>/dev/null || true
            cp -a /tmp/token.pickle token.pickle 2>/dev/null || true

            ./venv/bin/pip install -q -r requirements.txt

            : "${AMOCRM_REDIRECT_URL:=https://localhost}"
            if [ -n "${AMOCRM_TOKEN_JSON:-}" ]; then
              printf '%s' "$AMOCRM_TOKEN_JSON" > data/amocrm_token.json
            fi
            if [ -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ]; then
              printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json
              cp service_account.json data/service_account.json
            fi

            cat > .env <<ENVFILE
            BOT_TOKEN=${BOT_TOKEN}
            API_ID=${API_ID}
            API_HASH=${API_HASH}
            GEMINI_API_KEY=${GEMINI_API_KEY}
            AMOCRM_SUBDOMAIN=jonbrandingagency
            AMOCRM_CLIENT_ID=${AMOCRM_CLIENT_ID}
            AMOCRM_CLIENT_SECRET=${AMOCRM_CLIENT_SECRET}
            AMOCRM_REDIRECT_URL=${AMOCRM_REDIRECT_URL}
            AMOCRM_REFRESH_TOKEN=${AMOCRM_REFRESH_TOKEN}
            OISHA_API_SECRET=${OISHA_API_SECRET}
            OPENCLAW_SECRET=${OPENCLAW_SECRET}
            TURSO_DATABASE_URL=${TURSO_DATABASE_URL}
            TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}
            OWNER_ID=150074828
            OISHA_RUNTIME=vm_service
            CLOUD_RUN_CONTROL_PLANE_ONLY=false
            SESSION_MODE=file
            ENABLE_CLOUD_USERBOT=true
            ENABLE_AUTO_REPLY=false
            ALLOW_LOCAL_RUN=1
            AIRTABLE_BASE_ID=app8xoyx1XCumYFXV
            CRM_GROUP_ID=-1002566480563
            TEAM_GROUP_ID=-4860594772
            AIRTABLE_API_KEY=${AIRTABLE_API_KEY}
            GSHEET_ID=1KEFClhl4mVwCXI3YPfeE1B9X3SOkML2fp3NMocZzm8k
            GSHEET_CREDS_FILE=service_account.json
            ENVFILE
            sed -i 's/^            //' .env

            sudo sed -i '/^WatchdogSec=/d' /etc/systemd/system/oisha-os.service || true
            sudo systemctl daemon-reload
            sudo systemctl reset-failed oisha-os || true
            sudo systemctl restart oisha-os

            HEALTH_OK=0
            for _ in $(seq 1 24); do
              HTTP_CODE="$(curl -s -o /tmp/oisha-health.json -w "%{http_code}" --max-time 10 http://127.0.0.1:8080/healthz/ || echo 000)"
              if [ "$HTTP_CODE" = "200" ] && systemctl is-active --quiet oisha-os; then
                HEALTH_OK=1
                break
              fi
              sleep 5
            done

            if [ "$HEALTH_OK" != "1" ]; then
              echo "XATO: Oisha /healthz sog'lom emas"
              cat /tmp/oisha-health.json 2>/dev/null || true
              sudo journalctl -u oisha-os --no-pager -n 80
              exit 1
            fi

            sleep 25
            HTTP_CODE="$(curl -s -o /tmp/oisha-health.json -w "%{http_code}" --max-time 10 http://127.0.0.1:8080/healthz/ || echo 000)"
            if [ "$HTTP_CODE" != "200" ] || ! systemctl is-active --quiet oisha-os; then
              echo "XATO: Oisha stability window'dan o'tmadi"
              cat /tmp/oisha-health.json 2>/dev/null || true
              sudo journalctl -u oisha-os --no-pager -n 80
              exit 1
            fi

            echo "SUCCESS: Oisha Oracle production sog'lom."
            cat /tmp/oisha-health.json

      - name: Notify Telegram
        if: always()
        run: |
          STATUS="${{ steps.oracle.outcome }}"
          if [ "$STATUS" = "success" ]; then
            MSG="Oisha deploy: success%0ACommit: ${{ github.sha }}%0AProduction: Oracle VM healthy"
          else
            MSG="Oisha deploy: failure%0ACommit: ${{ github.sha }}%0AReason: Oracle VM health check failed"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${OWNER_ID}" \
            -d "text=${MSG}" || true
