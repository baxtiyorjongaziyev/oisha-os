name: Oracle Production Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - 'deploy/**'
      - 'scripts/**'
      - 'data/service_account.json'
      - '.github/workflows/oracle-deploy.yml'
  workflow_dispatch:

concurrency:
  group: oracle-production-deploy
  cancel-in-progress: true

# Workflow-level default: read-only. import-guard runs pull-request-adjacent
# code (compileall/pytest against checked-out src); it needs no write access.
# The deploy job overrides this with the write scopes it actually needs.
permissions:
  contents: read

env:
  OWNER_ID: "150074828"

jobs:
  # Prod'ga chiqishdan oldin kod umuman yuklana olishini tekshiramiz.
  # Import-time SyntaxError/IndentationError systemd'ni cheksiz restart
  # loop'ga tushiradi (bir marta counter 1586 ga yetgan), health-check esa
  # buni deploy tugagach ushlaydi — ya'ni prod allaqachon o'lik bo'ladi.
  # Bu gate GitHub-hosted runner'da ishlaydi va sekundlar oladi.
  import-guard:
    name: Import-time crash guard
    if: "!startsWith(github.event.head_commit.message, 'chore(auto):')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Compile every source file
        run: python -m compileall -q src/ scripts/

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify prod entrypoint imports
        env:
          SKIP_LIVE: "1"
        run: pytest tests/test_syntax_guard.py -q

  deploy:
    name: Oracle VM healthy deploy
    needs: import-guard
    if: "!startsWith(github.event.head_commit.message, 'chore(auto):')"
    runs-on: [self-hosted, oracle]
    environment: production
    permissions:
      contents: read
      deployments: write
    timeout-minutes: 10
    steps:
      - name: Deploy to Oracle VM and verify health
        id: oracle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AMOCRM_CLIENT_ID: ${{ secrets.AMOCRM_CLIENT_ID }}
          AMOCRM_CLIENT_SECRET: ${{ secrets.AMOCRM_CLIENT_SECRET }}
          AMOCRM_REDIRECT_URL: ${{ secrets.AMOCRM_REDIRECT_URL }}
          AMOCRM_TOKEN_JSON: ${{ secrets.AMOCRM_TOKEN_JSON }}
          AMOCRM_REFRESH_TOKEN: ${{ secrets.AMOCRM_REFRESH_TOKEN }}
          OISHA_API_SECRET: ${{ secrets.OISHA_API_SECRET }}
          OPENCLAW_SECRET: ${{ secrets.OPENCLAW_SECRET }}
          USERBOT_SESSION_STRING: ${{ secrets.USERBOT_SESSION_STRING }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          PROJECTS_GROUP_ID: ${{ secrets.PROJECTS_GROUP_ID }}
          CRM_GROUP_ID: ${{ secrets.CRM_GROUP_ID }}
          TEAM_GROUP_ID: ${{ secrets.TEAM_GROUP_ID }}
          TOPIC_CRM_ID: ${{ secrets.TOPIC_CRM_ID }}
          TOPIC_GENERAL_ID: ${{ secrets.TOPIC_GENERAL_ID }}
          TOPIC_KIRIM_ID: ${{ secrets.TOPIC_KIRIM_ID }}
          TOPIC_REPORTS_ID: ${{ secrets.TOPIC_REPORTS_ID }}
          TOPIC_TASKS_ID: ${{ secrets.TOPIC_TASKS_ID }}
          HISOBCHI_FINANCE_GROUP_ID: ${{ secrets.HISOBCHI_FINANCE_GROUP_ID }}
          HISOBCHI_KIRIM_TOPIC_ID: ${{ secrets.HISOBCHI_KIRIM_TOPIC_ID }}
          HISOBCHI_CHIQIM_TOPIC_ID: ${{ secrets.HISOBCHI_CHIQIM_TOPIC_ID }}
          HISOBCHI_PNL_TOPIC_ID: ${{ secrets.HISOBCHI_PNL_TOPIC_ID }}
          HISOBCHI_CASHFLOW_TOPIC_ID: ${{ secrets.HISOBCHI_CASHFLOW_TOPIC_ID }}
          HISOBCHI_BALANCE_TOPIC_ID: ${{ secrets.HISOBCHI_BALANCE_TOPIC_ID }}
          HISOBCHI_GSHEET_ID: ${{ secrets.HISOBCHI_GSHEET_ID }}
          TOPIC_MEETINGS_ID: ${{ secrets.TOPIC_MEETINGS_ID }}
          TOPIC_FOLLOWUP_ID: ${{ secrets.TOPIC_FOLLOWUP_ID }}
          TOPIC_SELLER_1_LEADS_ID: ${{ secrets.TOPIC_SELLER_1_LEADS_ID }}
          TOPIC_SELLER_2_LEADS_ID: ${{ secrets.TOPIC_SELLER_2_LEADS_ID }}
          HISOBCHI_QARZDORLIK_TOPIC_ID: ${{ secrets.HISOBCHI_QARZDORLIK_TOPIC_ID }}
          HISOBCHI_PNL_WORKSHEET_GID: ${{ secrets.HISOBCHI_PNL_WORKSHEET_GID }}
          # Fail-safe rollout: keep Oracle polling until the Cloud Run head is
          # live-verified, then set this repository variable to "disabled".
          TELEGRAM_BOT_INGRESS_MODE: ${{ vars.TELEGRAM_BOT_INGRESS_MODE || 'polling' }}
          # Lokal LLM fallback. Standart holat — o'chiq: 954MB li VM da
          # qwen2.5:3b OOM keltirib chiqargan. "1" qilib yoqiladi.
          ENABLE_OLLAMA: ${{ vars.ENABLE_OLLAMA || '0' }}
        run: |
            set -euo pipefail
            OISHA_DIR="/home/ubuntu/oisha-os"
            cd "$OISHA_DIR"

            mkdir -p data
            cp -a data/*.session /tmp/ 2>/dev/null || true
            cp -a data/amocrm_token.json /tmp/amocrm_token.json 2>/dev/null || true

            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main

            mkdir -p data
            cp -a /tmp/*.session data/ 2>/dev/null || true
            cp -a /tmp/amocrm_token.json data/amocrm_token.json 2>/dev/null || true
            rm -f service_account.json data/service_account.json token.pickle data/token.pickle

            ./venv/bin/pip install -q -r requirements.txt

            # Ollama ENDI IXTIYORIY. VM da 954MB RAM bor; qwen2.5:3b
            # inference paytida bir necha yuz MB dan gigabaytgacha oladi va
            # 11-avgust kuni OOM killer runner'ni o'ldirdi (dmesg: "python
            # invoked oom-killer" x3, keyin runner uchun "Failed with result
            # 'oom-kill'"). Yoqish uchun ENABLE_OLLAMA repository variable'ini
            # "1" qiling. O'chiq bo'lsa .env ga OLLAMA_BASE_URL yozilmaydi —
            # free_ai_router.py:118 provayderni butunlay o'tkazib yuboradi,
            # ya'ni o'lik portga urinish ham bo'lmaydi.
            if [ "${ENABLE_OLLAMA:-0}" = "1" ]; then
              chmod +x deploy/bootstrap_ollama.sh
              OLLAMA_TEXT_MODEL=qwen2.5:3b deploy/bootstrap_ollama.sh
            else
              echo "[OLLAMA] ENABLE_OLLAMA yoqilmagan — o'tkazib yuborildi."
            fi

            if [ "${ENABLE_OLLAMA:-0}" = "1" ]; then
              OLLAMA_BASE_URL_VALUE="http://127.0.0.1:11434/api"
            else
              OLLAMA_BASE_URL_VALUE=""
            fi

            : "${AMOCRM_REDIRECT_URL:=https://localhost}"
            if [ -n "${AMOCRM_TOKEN_JSON:-}" ]; then
              printf '%s' "$AMOCRM_TOKEN_JSON" > data/amocrm_token.json
            fi

            cat > .env <<ENVFILE
            BOT_TOKEN=${BOT_TOKEN}
            API_ID=${API_ID}
            API_HASH=${API_HASH}
            GEMINI_API_KEY=${GEMINI_API_KEY}
            GROQ_API_KEY=${GROQ_API_KEY}
            CLOUDFLARE_AI_API_TOKEN=${CLOUDFLARE_AI_API_TOKEN}
            CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
            OLLAMA_BASE_URL=${OLLAMA_BASE_URL_VALUE}
            OLLAMA_TEXT_MODEL=qwen2.5:3b
            ENABLE_PAID_AI_FALLBACK=false
            ENABLE_AI_AUTOPILOT=true
            AMOCRM_SUBDOMAIN=jonbrandingagency
            AMOCRM_CLIENT_ID=${AMOCRM_CLIENT_ID}
            AMOCRM_CLIENT_SECRET=${AMOCRM_CLIENT_SECRET}
            AMOCRM_REDIRECT_URL=${AMOCRM_REDIRECT_URL}
            AMOCRM_REFRESH_TOKEN=${AMOCRM_REFRESH_TOKEN}
            OISHA_API_SECRET=${OISHA_API_SECRET}
            OPENCLAW_SECRET=${OPENCLAW_SECRET}
            USERBOT_SESSION_STRING=${USERBOT_SESSION_STRING}
            TURSO_DATABASE_URL=${TURSO_DATABASE_URL}
            TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}
            OWNER_ID=150074828
            OISHA_RUNTIME=vm_service
            CLOUD_RUN_CONTROL_PLANE_ONLY=false
            SESSION_MODE=file
            HEALTH_LIVE_DB_PROBE=0
            ENABLE_CLOUD_USERBOT=true
            ENABLE_AUTO_REPLY=false
            AUTO_REPLY_MODE=shadow
            USERBOT_DISABLE_PRIVATE_REPLIES=true
            TELEGRAM_BOT_TO_BOT_ENABLED=false
            TELEGRAM_BOT_RUNTIME_BACKEND=aiogram
            TELEGRAM_BOT_INGRESS_MODE=${TELEGRAM_BOT_INGRESS_MODE}
            TELEGRAM_ADMIN_AIOGRAM_DISPATCHER_ENABLED=true
            OISHA_COMMAND_CENTER_DIGEST_ENABLED=true
            OISHA_COMMAND_CENTER_DIGEST_HOUR=9
            OISHA_COMMAND_CENTER_DIGEST_MINUTE=5
            ALLOW_LOCAL_RUN=0
            AIRTABLE_BASE_ID=app8xoyx1XCumYFXV
            CRM_GROUP_ID=${CRM_GROUP_ID}
            TEAM_GROUP_ID=${TEAM_GROUP_ID}
            PROJECTS_GROUP_ID=${PROJECTS_GROUP_ID}
            TOPIC_CRM_ID=${TOPIC_CRM_ID}
            TOPIC_GENERAL_ID=${TOPIC_GENERAL_ID}
            TOPIC_KIRIM_ID=${TOPIC_KIRIM_ID}
            TOPIC_REPORTS_ID=${TOPIC_REPORTS_ID}
            TOPIC_TASKS_ID=${TOPIC_TASKS_ID}
            TOPIC_MEETINGS_ID=${TOPIC_MEETINGS_ID}
            TOPIC_FOLLOWUP_ID=${TOPIC_FOLLOWUP_ID}
            TOPIC_SELLER_1_LEADS_ID=${TOPIC_SELLER_1_LEADS_ID}
            TOPIC_SELLER_2_LEADS_ID=${TOPIC_SELLER_2_LEADS_ID}
            HISOBCHI_FINANCE_GROUP_ID=${HISOBCHI_FINANCE_GROUP_ID}
            HISOBCHI_KIRIM_TOPIC_ID=${HISOBCHI_KIRIM_TOPIC_ID}
            HISOBCHI_CHIQIM_TOPIC_ID=${HISOBCHI_CHIQIM_TOPIC_ID}
            HISOBCHI_PNL_TOPIC_ID=${HISOBCHI_PNL_TOPIC_ID}
            HISOBCHI_CASHFLOW_TOPIC_ID=${HISOBCHI_CASHFLOW_TOPIC_ID}
            AMOCRM_ALERT_FORWARD_GROUP_ID=-1003854308552
            AMOCRM_ALERT_FORWARD_TOPIC_ID=443
            HISOBCHI_BALANCE_TOPIC_ID=${HISOBCHI_BALANCE_TOPIC_ID}
            HISOBCHI_QARZDORLIK_TOPIC_ID=${HISOBCHI_QARZDORLIK_TOPIC_ID}
            HISOBCHI_GSHEET_ID=${HISOBCHI_GSHEET_ID}
            HISOBCHI_PNL_WORKSHEET_GID=${HISOBCHI_PNL_WORKSHEET_GID}
            AIRTABLE_API_KEY=${AIRTABLE_API_KEY}
            ENVFILE
            sed -i 's/^            //' .env

            if [ -n "${USERBOT_SESSION_STRING:-}" ]; then
              mkdir -p data
              printf '%s' "$USERBOT_SESSION_STRING" > data/userbot_session_string.txt
              rm -f data/userbot.session data/*.session
            fi

            # Sync nginx config and reload (for /telegram-mcp SSE endpoint etc.)
            echo "=== NGINX SITES-ENABLED FILES ==="
            ls -la /etc/nginx/sites-enabled/ || true
            for f in /etc/nginx/sites-enabled/*; do
              if [ -f "$f" ] || [ -L "$f" ]; then
                echo "=== FILE: $f ==="
                sudo cat "$f" || true
              fi
            done
            sudo cp deploy/nginx-oisha.conf /etc/nginx/sites-available/oisha
            # `reload` TO'XTAGAN unit'da yiqiladi va xato jim yutilardi —
            # natijada nginx 12-avgustda "inactive" holatda qolib ketgan edi.
            # reload-or-restart ikkala holatni ham qamrab oladi. Deploy'ni
            # yiqitmaymiz (ilova nginx'siz ham ishlaydi), lekin endi jim
            # emas — xato aniq ko'rinadi.
            if systemctl is-active --quiet caddy; then
              echo "[WEB] Caddy is active, reloading Caddyfile"
              sudo systemctl reload caddy || true
            elif sudo nginx -t 2>/dev/null; then
              sudo systemctl reload-or-restart nginx || echo "Nginx reload skipped"
            fi

            sudo sed -i '/^WatchdogSec=/d' /etc/systemd/system/oisha-os.service || true
            sudo mkdir -p /etc/systemd/system/oisha-os.service.d
            sudo tee /etc/systemd/system/oisha-os.service.d/10-resilience.conf >/dev/null <<'UNIT'
            [Unit]
            StartLimitIntervalSec=0

            [Service]
            Restart=always
            RestartSec=10
            TimeoutStopSec=35
            KillSignal=SIGINT
            UNIT
            sudo sed -i 's/^            //' /etc/systemd/system/oisha-os.service.d/10-resilience.conf
            sudo systemctl daemon-reload
            sudo systemctl reset-failed oisha-os || true
            sudo systemctl restart oisha-os

            HEALTH_OK=0
            for _ in $(seq 1 24); do
              HTTP_CODE="$(curl -s -o /tmp/oisha-health.json -w "%{http_code}" --max-time 10 http://127.0.0.1:8080/readyz/ || echo 000)"
              if [ "$HTTP_CODE" = "200" ] && systemctl is-active --quiet oisha-os; then
                HEALTH_OK=1
                break
              fi
              sleep 5
            done

            if [ "$HEALTH_OK" != "1" ]; then
              echo "XATO: Oisha /readyz production dependencies tayyor emas"
              cat /tmp/oisha-health.json 2>/dev/null || true
              sudo journalctl -u oisha-os --no-pager -n 80
              exit 1
            fi

            # The userbot boot can briefly block the event loop while Telegram,
            # Google and CRM clients initialize. Treat stability as a short
            # window with retries, not a single brittle curl.
            sleep 25
            STABLE_OK=0
            for _ in $(seq 1 12); do
              HTTP_CODE="$(curl -s -o /tmp/oisha-health.json -w "%{http_code}" --max-time 10 http://127.0.0.1:8080/readyz/ || echo 000)"
              if [ "$HTTP_CODE" = "200" ] && systemctl is-active --quiet oisha-os; then
                STABLE_OK=1
                break
              fi
              sleep 5
            done
            if [ "$STABLE_OK" != "1" ]; then
              echo "XATO: Oisha stability window'dan o'tmadi"
              cat /tmp/oisha-health.json 2>/dev/null || true
              sudo journalctl -u oisha-os --no-pager -n 80
              exit 1
            fi

            echo "SUCCESS: Oisha Oracle production sog'lom."
            cat /tmp/oisha-health.json

      - name: Notify Telegram
        if: always() && !cancelled()
        run: |
          STATUS="${{ steps.oracle.outcome }}"
          if [ "$STATUS" = "success" ]; then
            MSG="Oisha deploy: success%0ACommit: ${{ github.sha }}%0AProduction: Oracle VM healthy"
          else
            MSG="Oisha deploy: failure%0ACommit: ${{ github.sha }}%0AReason: Oracle VM health check failed"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${OWNER_ID}" \
            -d "text=${MSG}" || true
