# Userbot session'ni Oracle VM da tiklash.
#
# Nega aynan VM da: session EGASI — Oracle dagi oisha-os.service. Kalitni
# o'sha mashinada yaratsak, u hech qachon boshqa IP dan ochilmaydi va
# AuthKeyDuplicated xavfi yo'qoladi (qarang
# docs/operations/telethon-session-ownership.md).
#
# Xavfsizlik afzalliklari:
#   - GitHub runner da emas, to'g'ridan-to'g'ri Oracle VM da ishlaydi
#   - TELEGRAM_PHONE / TELEGRAM_PASSWORD ni VM ning .env idan oladi,
#     ya'ni GitHub secret shart emas
#   - session stringni hech qayerda chop etmaydi: to'g'ridan-to'g'ri
#     data/userbot_session_string.txt ga va .env ga yozadi
name: Userbot Auth (Oracle VM)

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'start = kod so‘rash | code = kodni yuborish | status = holat | restart = servisni qayta ishga tushirish'
        required: true
        default: 'status'
        type: choice
        options: [start, code, status, restart, diagnose, leads]
      code:
        description: '[faqat step=code] Telegram login kodi (faqat raqamlar)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  auth:
    name: Userbot auth on Oracle VM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run auth step on Oracle VM
        uses: appleboy/ssh-action@v1
        env:
          AUTH_STEP: ${{ inputs.step }}
          AUTH_CODE: ${{ inputs.code }}
          TG_PHONE: ${{ secrets.TELEGRAM_PHONE }}
          TG_PASSWORD: ${{ secrets.TELEGRAM_PASSWORD }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 14m
          envs: AUTH_STEP,AUTH_CODE,TG_PHONE,TG_PASSWORD
          script: |
            set -euo pipefail
            cd /home/ubuntu/oisha-os
            mkdir -p data

            # GitHub secrets dan .env ga qo'shish (agar yo'q bo'lsa)
            if [ -n "${TG_PHONE:-}" ] && ! grep -q '^TELEGRAM_PHONE=' .env 2>/dev/null; then
              echo "TELEGRAM_PHONE=${TG_PHONE}" >> .env
              echo ".env ga TELEGRAM_PHONE qo'shildi"
            fi
            if [ -n "${TG_PASSWORD:-}" ] && ! grep -q '^TELEGRAM_PASSWORD=' .env 2>/dev/null; then
              echo "TELEGRAM_PASSWORD=${TG_PASSWORD}" >> .env
              echo ".env ga TELEGRAM_PASSWORD qo'shildi"
            fi

            show_status() {
              if [ -f data/userbot_auth_status.json ]; then
                echo "STATUS: $(cat data/userbot_auth_status.json)"
              else
                echo "STATUS: (hali yo'q)"
              fi
            }

            # .env ni `source` QILMAYMIZ: qiymatida bo'sh joy yoki maxsus belgi
            # bo'lsa bash uni buyruq deb ishga tushirib, sir bo'lagini logga
            # chiqarardi (2026-10-02 da shunday bo'ldi). Auth skript .env ni
            # o'zi load_dotenv bilan o'qiydi; bu yerda faqat telefon kerak.
            TELEGRAM_PHONE="$(sed -n 's/^TELEGRAM_PHONE=//p' .env 2>/dev/null | tail -n 1 | tr -d "\"'")"

            case "$AUTH_STEP" in
              start)
                if [ ! -f .env ]; then
                  echo "XATO: /home/ubuntu/oisha-os/.env topilmadi"; exit 1
                fi
                # Parol .env da bormi — qiymatini KO'RSATMAYMIZ, faqat bor-yo'qligini.
                if grep -qE '^TELEGRAM_PASSWORD=.+' .env; then
                  echo "TELEGRAM_PASSWORD: .env da bor"
                else
                  echo "OGOHLANTIRISH: .env da TELEGRAM_PASSWORD yo'q."
                  echo "Akkauntda 2FA yoqilgan bo'lsa, skript parolni"
                  echo "data/userbot_auth_password.txt faylidan kutadi."
                fi
                # TELEGRAM_PHONE borligini tekshir
                if [ -z "${TELEGRAM_PHONE:-}" ]; then
                  echo "XATO: .env da TELEGRAM_PHONE yo'q yoki bo'sh"
                  echo "TELEGRAM_PHONE=+998XXXXXXXXX formatida .env ga qo'shing"
                  exit 1
                fi
                echo "TELEGRAM_PHONE: .env da bor (oxirgi 4 raqam: ...${TELEGRAM_PHONE: -4})"
                rm -f data/userbot_auth_code.txt data/userbot_auth_status.json
                nohup ./venv/bin/python scripts/prod/auth_userbot_on_oracle.py \
                  > data/userbot_auth.log 2>&1 &
                echo "Auth skript fonda ishga tushdi (PID $!)"
                sleep 15
                show_status
                echo "--- log ---"; tail -n 20 data/userbot_auth.log || true
                ;;

              code)
                if ! printf '%s' "$AUTH_CODE" | grep -qE '^[0-9]{4,8}$'; then
                  echo "XATO: kod faqat 4-8 ta raqamdan iborat bo'lishi kerak"; exit 1
                fi
                printf '%s' "$AUTH_CODE" > data/userbot_auth_code.txt
                chmod 600 data/userbot_auth_code.txt
                echo "Kod yozildi, skript uni 0.5s ichida oladi."
                sleep 20
                show_status
                echo "--- log ---"; tail -n 30 data/userbot_auth.log || true
                ;;

              status)
                show_status
                echo "--- log ---"; tail -n 30 data/userbot_auth.log || true
                ;;

              leads)
                # Faqat o'qish, faqat sonlar — ism/telefon chiqarilmaydi.
                echo "=== oisha-leads servisi ==="
                systemctl is-active oisha-leads || true
                systemctl show oisha-leads -p ActiveEnterTimestamp -p NRestarts || true
                ./venv/bin/python - <<'PY' || echo "XATO: hisobot skripti yiqildi"
            import datetime, os, sqlite3, sys
            from collections import Counter
            sys.path.insert(0, ".")
            from dotenv import load_dotenv
            load_dotenv(".env")
            days = 7
            since = datetime.datetime.now() - datetime.timedelta(days=days)
            print(f"=== Oisha yetkazish bazasi (oxirgi {days} kun, updated_at bo'yicha) ===")
            con = sqlite3.connect("data/leadgen_delivery.db")
            rows = con.execute(
                "SELECT substr(updated_at,1,10) d, count(1), sum(amocrm_ok), sum(sheets_ok), sum(telegram_ok) "
                "FROM deliveries WHERE updated_at >= ? GROUP BY d ORDER BY d", (since.isoformat(),)
            ).fetchall()
            print("sana        jami amocrm sheets telegram")
            for d, n, a, s, t in rows:
                print(f"{d}  {n:4} {a or 0:6} {s or 0:6} {t or 0:8}")
            tot = con.execute(
                "SELECT count(1), sum(amocrm_ok), sum(sheets_ok), sum(telegram_ok) FROM deliveries WHERE updated_at >= ?",
                (since.isoformat(),),
            ).fetchone()
            print(f"JAMI        {tot[0]:4} {tot[1] or 0:6} {tot[2] or 0:6} {tot[3] or 0:8}")
            for lid, err, r in con.execute(
                "SELECT leadgen_id, last_error, retries FROM deliveries WHERE updated_at >= ? "
                "AND (amocrm_ok=0 OR sheets_ok=0 OR telegram_ok=0)", (since.isoformat(),)
            ).fetchall():
                print(f"  CHALA: {lid} retries={r} err={(err or '')[:120]}")
            print(f"=== Meta (oxirgi {days} kun, created_time bo'yicha) ===")
            try:
                from src.schedulers import meta_leadgen_scheduler as m
                token = m._get_page_token()
                ver = os.getenv("META_GRAPH_API_VERSION", "v19.0").strip() or "v19.0"
                per_day, ids = Counter(), set()
                for fid in m._get_active_form_ids(token, ver):
                    for lead in m._get_pages(f"https://graph.facebook.com/{ver}/{fid}/leads", token, "id,created_time"):
                        ct = datetime.datetime.strptime(lead["created_time"][:19], "%Y-%m-%dT%H:%M:%S")
                        if ct >= since:
                            per_day[ct.strftime("%Y-%m-%d")] += 1
                            ids.add(str(lead["id"]))
                for d in sorted(per_day):
                    print(f"{d}  {per_day[d]:4}")
                print(f"JAMI        {len(ids):4}")
                known = {r[0] for r in con.execute("SELECT leadgen_id FROM deliveries")}
                missing = sorted(ids - known)
                print(f"Meta'da bor, Oisha bazasida YO'Q: {len(missing)}")
                for lid in missing[:20]:
                    print(f"  YO'Q: {lid}")
            except Exception as exc:
                print(f"Meta so'rovi xatosi: {type(exc).__name__}: {str(exc)[:200]}")
            PY
                echo "=== AmoCRM voronkalari va bosqichlari (jonli) ==="
                ./venv/bin/python - <<'PY' || true
            import sys, requests
            sys.path.insert(0, ".")
            from dotenv import load_dotenv
            load_dotenv(".env")
            from src.services.core.crm.amocrm.sync import AmoCRMSync
            from src.services.core.crm import amocrm_pipeline_config as cfg
            a = AmoCRMSync()
            r = requests.get(f"{a.base_url}/api/v4/leads/pipelines", headers=a._get_headers(), timeout=20)
            print("HTTP", r.status_code)
            for p in r.json().get("_embedded", {}).get("pipelines", []):
                sts = ", ".join(f"{s['id']}:{s['name']}" for s in p["_embedded"]["statuses"])
                print(f"- {p['id']} {p['name']} (arxiv={p.get('is_archive')}): {sts}")
            print("KOD: UTC", cfg.UTC_PIPELINE_ID, cfg.UTC_NEW_STATUS_ID,
                  "| INHOUSE", cfg.TARGET_LEADS_INHOUSE_PIPELINE_ID, cfg.TARGET_LEADS_INHOUSE_NEW_STATUS_ID)
            PY
                echo "=== claims jadvali ==="
                ./venv/bin/python -c "import sqlite3;c=sqlite3.connect('data/leadgen_delivery.db');print('claims:',c.execute('select count(1),min(claimed_at),max(claimed_at) from leadgen_claims').fetchone())" || true
                echo "=== oisha-leads: oxirgi 40 qator (xom, maskalangan) ==="
                sudo journalctl -u oisha-leads -n 40 --no-pager 2>/dev/null \
                  | sed -E 's/[A-Za-z0-9_+/=-]{40,}/[MASKED]/g; s/\+?998[0-9 -]{9,}/[TEL]/g' | cut -c1-260 || true
                echo "=== oisha-leads logi (oxirgi 24 soat) ==="
                J="$(sudo journalctl -u oisha-leads --since '24 hours ago' --no-pager 2>/dev/null)"
                echo "Routed lead: $(printf '%s\n' "$J" | grep -c 'Routed lead')"
                echo "WATCHDOG: $(printf '%s\n' "$J" | grep -c 'WATCHDOG')"
                echo "ERROR/Traceback: $(printf '%s\n' "$J" | grep -cE 'ERROR|Traceback')"
                printf '%s\n' "$J" | grep -E 'ERROR|WARNING|Traceback|Routed lead|SOS' \
                  | sed -E 's/[A-Za-z0-9_+/=-]{40,}/[MASKED]/g; s/\+?998[0-9 -]{9,}/[TEL]/g' \
                  | cut -c1-240 | tail -n 25 || true
                ;;

              diagnose)
                # Faqat o'qish. Uzun token-ga o'xshash ketma-ketliklar maskalanadi.
                show_status
                f=data/userbot_session_string.txt
                if [ -f "$f" ]; then
                  echo "$f: bor ($(wc -c < "$f") bayt, $(date -r "$f" '+%F %T'))"
                else
                  echo "$f: yo'q"
                fi
                echo "--- oisha-os: userbot/session loglari (oxirgi 6 soat) ---"
                sudo journalctl -u oisha-os --since '6 hours ago' --no-pager 2>/dev/null \
                  | grep -iE 'USERBOT|SESSION_KEEPER|SESSION STORE|AuthKey|Unauthorized' \
                  | sed -E 's/[A-Za-z0-9_+/=-]{40,}/[MASKED]/g' | cut -c1-260 | tail -n 60 || true
                ;;

              restart)
                sudo systemctl restart oisha-os
                echo "oisha-os qayta ishga tushirildi, /readyz kutilmoqda..."
                for i in $(seq 1 20); do
                  HTTP_CODE="$(curl -s -o /tmp/readyz.json -w "%{http_code}" \
                    --max-time 10 http://127.0.0.1:8080/readyz/ || echo 000)"
                  if [ "$HTTP_CODE" = "200" ]; then
                    echo "READY: $(cat /tmp/readyz.json)"; exit 0
                  fi
                  sleep 15
                done
                echo "XATO: /readyz 200 bermadi"
                echo "OXIRGI JAVOB: $(cat /tmp/readyz.json 2>/dev/null || echo yo-q)"
                exit 1
                ;;
            esac
