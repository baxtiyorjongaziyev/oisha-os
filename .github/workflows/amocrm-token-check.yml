name: AmoCRM Token Check

on:
  workflow_dispatch:

jobs:
  check:
    name: Check amoCRM token status
    runs-on: [self-hosted, oracle]
    timeout-minutes: 5
    steps:
      - name: Check token on Hetzner VPS
        run: |
          set -euo pipefail
          OISHA_DIR="/home/deploy/oisha-os"
          [ -d "$OISHA_DIR" ] || OISHA_DIR="/home/ubuntu/oisha-os"
          cd "$OISHA_DIR"

          echo "=== Token fayl holati ==="
          if [ -f data/amocrm_token.json ]; then
            echo "Fayl mavjud"
            # Faqat kalitlarni ko'rsatamiz, qiymatlarni EMAS
            python3 - <<'PY'
          import json
          t = json.load(open('data/amocrm_token.json'))
          print('Kalitlar:', list(t.keys()))
          print('access_token:', 'BOR' if t.get('access_token') else 'YOQ')
          print('refresh_token:', 'BOR' if t.get('refresh_token') else 'YOQ')
          print('expires_in:', t.get('expires_in', '?'))
          print('expires_at:', t.get('expires_at', '?'))
          print('token_type:', t.get('token_type', '?'))
          PY
          else
            echo "XATO: data/amocrm_token.json TOPILMADI"
          fi

          echo ""
          echo "=== API test ==="
          TOKEN=$(python3 -c "import json; print(json.load(open('data/amocrm_token.json')).get('access_token',''))" 2>/dev/null || echo "")
          if [ -n "$TOKEN" ]; then
            HTTP=$(curl -s -o /tmp/amo_test.json -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" \
              "https://jonbranding.amocrm.ru/api/v4/account" 2>/dev/null)
            echo "GET /api/v4/account: HTTP $HTTP"
            if [ "$HTTP" != "200" ]; then
              cat /tmp/amo_test.json 2>/dev/null | head -c 200 || true
            fi
          fi

          echo ""
          echo "=== Refresh urinish ==="
          set +e
          set -a; [ -f .env ] && . ./.env; set +a
          set -e
          ./venv/bin/python scripts/refresh_crm_token.py 2>&1 || true
