name: Delete Juma Messages (Hetzner VPS)

on:
  workflow_dispatch:

jobs:
  delete-messages:
    name: Bugungi Juma DM'larini o'chir
    runs-on: [self-hosted, oracle]
    timeout-minutes: 30
    steps:
      - name: Delete on Hetzner VPS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OISHA_DIR="/home/deploy/oisha-os"
          [ -d "$OISHA_DIR" ] || OISHA_DIR="/home/ubuntu/oisha-os"
          cd "$OISHA_DIR"

          if [ -d .git ]; then
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" 2>/dev/null || true
            git fetch origin main
            git stash --include-untracked 2>/dev/null || true
            git checkout origin/main -- scripts/delete_juma_messages.py scripts/telethon_guard.py scripts/__init__.py
            git remote set-url origin "https://github.com/baxtiyorjongaziyev/oisha-os.git" 2>/dev/null || true
          fi

          if [ -f .env ]; then
            set -o allexport
            source .env
            set +o allexport
          fi

          ./venv/bin/python scripts/delete_juma_messages.py
