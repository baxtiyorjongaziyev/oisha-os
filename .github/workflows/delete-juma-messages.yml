name: Delete Juma Messages (Oracle VM)

on:
  workflow_dispatch:

jobs:
  delete-messages:
    name: Bugungi Juma DM'larini o'chir
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Delete on Oracle VM
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 25m
          envs: GITHUB_TOKEN
          script: |
            set -euo pipefail
            cd /home/ubuntu/oisha-os

            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/baxtiyorjongaziyev/oisha-os.git" 2>/dev/null || true
            git fetch origin main
            git stash --include-untracked 2>/dev/null || true
            git checkout origin/main -- scripts/delete_juma_messages.py

            if [ -f .env ]; then
              set -o allexport
              source .env
              set +o allexport
            fi

            ./venv/bin/python scripts/delete_juma_messages.py
