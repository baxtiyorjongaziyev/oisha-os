version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/salescoach-ai"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/marketing-os/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Resolver verified against production Linux/Python 3.11 on 2026-10-05.
    # aiohttp <7 multidict constraint and Sphinx <0.23 docutils constraint.
    # Ignore only these incompatible releases; security alerts remain enabled.
    ignore:
      - dependency-name: "multidict"
        versions: ["7.0.0"]
      - dependency-name: "docutils"
        versions: ["0.23"]
      # libsql-client 0.3.1 requires sphinx-press-theme<0.9.0.
      - dependency-name: "sphinx-press-theme"
        versions: ["0.9.1"]
