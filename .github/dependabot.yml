version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      all-npm-root:
        patterns:
          - "*"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/salescoach-ai"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      all-salescoach-ai:
        patterns:
          - "*"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/marketing-os/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      all-marketing-os:
        patterns:
          - "*"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      all-python:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "multidict"
        versions: ["7.0.0"]
      - dependency-name: "docutils"
        versions: ["0.23"]
      - dependency-name: "sphinx-press-theme"
        versions: ["0.9.1"]
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
