# Gemini Code Assist on GitHub — repo config.
have_fun: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: 10
  pull_request_opened:
    help: false
    summary: true
    code_review: true
ignore_patterns:
  - "src/services/debug/**"
  - "scripts/debug/**"
  - "**/*.lock"
  - "**/pnpm-lock.yaml"
  - "requirements-lock.txt"
  - "graphify-out/**"
