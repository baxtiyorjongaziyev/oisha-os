[alembic]
script_location = alembic
prepend_sys_path = .

# SQLite for local dev; override via DATABASE_URL env var for production.
# Turso (libSQL) is not directly supported by SQLAlchemy, so migrations run
# against the local SQLite replica and are applied to Turso separately.
sqlalchemy.url = sqlite:///data/bot.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
