version: "3.8"

services:
  oisha:
    build: .
    container_name: oisha-os
    restart: always
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./oisha_userbot.session:/app/oisha_userbot.session
    deploy:
      resources:
        limits:
          memory: 850M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16
    container_name: salescoach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: salescoach
      POSTGRES_USER: salescoach
      POSTGRES_PASSWORD: salescoach_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salescoach -d salescoach"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: salescoach-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: salescoach-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: salescoach
      MINIO_ROOT_PASSWORD: salescoach_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
  postgres_data:
  redis_data:
