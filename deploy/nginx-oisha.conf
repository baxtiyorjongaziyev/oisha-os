# Oisha Admin Dashboard — oisha.jonbranding.uz
# / -> Next.js web (127.0.0.1:3000), /api/ -> FastAPI (127.0.0.1:8080)
# HTTPS: certbot --nginx shu faylga 443 blokini o'zi qo'shadi.
# Basic auth: /etc/nginx/.htpasswd-oisha (oracle-web-setup.sh yaratadi).

server {
    listen 80;
    listen [::]:80;
    server_name oisha.jonbranding.uz;

    # Monitoring uchun ochiq health check (autentifikatsiyasiz)
    location ~ ^/(healthz|readyz)/?$ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location /api/ {
        auth_basic "Oisha Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-oisha;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        auth_basic "Oisha Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-oisha;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
