<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JonBranding Portfolio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header>
            <h1 id="user-name">JonBranding</h1>
            <p>Eksklyuziv Dizayn va Branding Portfoliosi</p>
            <div id="login-widget-container" style="margin-top: 1rem;">
                <script async src="https://telegram.org/js/telegram-widget.js?22" 
                    data-telegram-login="JonBranding_Bot" 
                    data-size="large" 
                    data-onauth="onTelegramAuth(user)" 
                    data-request-access="write"></script>
            </div>
        </header>

        <main id="portfolio-container"></main>

        <!-- Modal for details -->
        <div id="modal" class="modal hidden">
            <div class="modal-content glass">
                <span class="close-btn">&times;</span>
                <img id="modal-image" src="" alt="">
                <h2 id="modal-title"></h2>
                <p id="modal-category" class="category-badge"></p>
                <p id="modal-description"></p>
                <a id="modal-link" href="#" target="_blank" class="btn">Loyihani ko'rish</a>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
