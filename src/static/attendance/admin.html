<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oisha · Smart Attendance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;background:#f8fafc}</style>
</head>
<body class="text-slate-900 min-h-screen">
<main class="max-w-5xl mx-auto px-5 py-8">
  <header class="flex flex-wrap items-center gap-3 mb-6">
    <div>
      <p class="text-xs text-slate-500">HR Management</p>
      <h1 class="text-2xl font-semibold">Smart Attendance</h1>
    </div>
    <input id="day" type="date" class="ml-auto border border-slate-200 rounded-lg px-3 py-2 bg-white">
  </header>

  <section id="login" class="hidden bg-white rounded-2xl p-6 shadow-sm">
    <a href="/api/auth/telegram/login?next=/davomat/admin" class="text-sky-600 font-semibold">Telegram bilan kirish →</a>
  </section>

  <section id="app" class="hidden space-y-6">
    <div id="cards" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>

    <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
      <h2 class="font-semibold px-5 pt-5">Bugungi yozuvlar</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm mt-3">
          <thead class="text-left text-slate-500 bg-slate-50"><tr>
            <th class="px-5 py-2">Xodim</th><th class="px-5 py-2">Turi</th><th class="px-5 py-2">Vaqt</th><th class="px-5 py-2">Holat</th>
          </tr></thead>
          <tbody id="rows" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm p-5">
      <h2 class="font-semibold">Ofis joylashuvi</h2>
      <p class="text-sm text-slate-500 mt-1">Ofis ichida turib bosing — telefon joylashuvi geofence markazi bo‘ladi.</p>
      <div class="flex flex-wrap items-center gap-3 mt-4">
        <label class="text-sm">Radius, m <input id="radius" type="number" value="150" min="30" max="1000" class="border rounded-lg px-2 py-1 w-24 ml-1"></label>
        <button id="set-office" class="bg-slate-900 text-white rounded-lg px-4 py-2 font-medium">Ofis joylashuvini shu yerdan belgilash</button>
      </div>
      <p id="office-msg" class="text-sm mt-3"></p>
    </div>
  </section>
</main>
<script src="/static/attendance/common.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const CARDS = [
  ['scheduled_today', 'Bugun kutilgan'], ['present', 'Kelgan'], ['on_time', 'O‘z vaqtida'], ['late', 'Kechikkan'],
  ['absent', 'Kelmagan'], ['pending_verification', 'Tekshiruvda'], ['attendance_rate', 'Davomat, %'],
  ['average_lateness_min', 'O‘rtacha kechikish, daq'],
];

function today() {
  return new Date().toLocaleDateString('en-CA', { timeZone: TZ });
}

async function load() {
  try {
    const d = await api(`/admin/dashboard?day=${$('day').value}`);
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    $('cards').replaceChildren(...CARDS.map(([k, label]) => {
      const c = el('div', 'bg-white rounded-2xl p-4 shadow-sm');
      c.append(el('p', 'text-xs text-slate-500', label), el('p', 'text-2xl font-semibold mt-1', d[k] ?? '—'));
      return c;
    }));
    $('rows').replaceChildren(...d.events.map((e) => {
      const tr = el('tr');
      const st = el('td', 'px-5 py-2.5'); st.append(statusBadge(e.status));
      tr.append(el('td', 'px-5 py-2.5', e.employee_name), el('td', 'px-5 py-2.5', e.kind === 'check_in' ? 'Keldi' : 'Ketdi'),
                el('td', 'px-5 py-2.5 tabular-nums', hhmm(e.server_ts)), st);
      return tr;
    }));
    if (!d.events.length) {
      const tr = el('tr');
      tr.append(el('td', 'px-5 py-4 text-slate-400', 'Yozuv yo‘q'));
      $('rows').append(tr);
    }
  } catch (err) {
    if (err.status === 401) { $('login').classList.remove('hidden'); return; }
    $('app').classList.remove('hidden');
    $('cards').replaceChildren(el('p', 'text-rose-600 col-span-4', err.status === 403 ? 'Bu bo‘lim uchun HR/admin huquqi kerak.' : err.message));
  }
}

$('set-office').addEventListener('click', async () => {
  const msg = $('office-msg');
  msg.className = 'text-sm mt-3 text-slate-600'; msg.textContent = 'Lokatsiya aniqlanmoqda…';
  try {
    const fix = await getLocationOnce();
    if (fix.accuracy_m > 50) throw new Error(`GPS aniqligi past (±${Math.round(fix.accuracy_m)} m). Deraza yoniga borib qayta bosing.`);
    if (!confirm(`Ofis markazi: ${fix.latitude.toFixed(6)}, ${fix.longitude.toFixed(6)} (±${Math.round(fix.accuracy_m)} m). Saqlansinmi?`)) return;
    await api('/admin/office', { method: 'PUT', body: {
      name: 'Bosh ofis', latitude: fix.latitude, longitude: fix.longitude, radius_m: Number($('radius').value), max_accuracy_m: 75,
    } });
    msg.className = 'text-sm mt-3 text-emerald-600'; msg.textContent = 'Ofis joylashuvi saqlandi.';
  } catch (err) {
    msg.className = 'text-sm mt-3 text-rose-600'; msg.textContent = err.message;
  }
});

$('day').value = today();
$('day').addEventListener('change', load);
load();
</script>
</body>
</html>
